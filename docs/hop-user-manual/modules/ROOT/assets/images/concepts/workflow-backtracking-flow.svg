<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310">
  <defs>
    <style>
      .wf-bg { fill: #f8fafc; }
      .wf-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
      .wf-card-start { fill: #ffffff; stroke: #0e3a5a; stroke-width: 2.5; rx: 8px; }
      .wf-card-success { fill: #ffffff; stroke: #10b981; stroke-width: 2.5; rx: 8px; }
      .wf-card-fail { fill: #ffffff; stroke: #ef4444; stroke-width: 2.5; rx: 8px; }
      
      .wf-text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14.5px; font-weight: 700; fill: #0e3a5a; }
      .wf-text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .wf-text-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; text-transform: uppercase; }
      
      .wf-hop-uncond { stroke: #0e3a5a; stroke-width: 2.5; fill: none; }
      .wf-hop-success { stroke: #10b981; stroke-width: 2.5; fill: none; }
      .wf-hop-failure { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 3; fill: none; }
      
      .wf-hop-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; }
      .wf-ribbon { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .wf-ribbon-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      
      /* Step token animation along success branch */
      .wf-token-seq {
        animation: wf-seqFollow 6s infinite ease-in-out;
      }

      @keyframes wf-seqFollow {
        0% { transform: translate(65px, 150px); opacity: 0; }
        5% { opacity: 1; }
        25% { transform: translate(220px, 150px); }
        35% { transform: translate(220px, 150px); }
        55% { transform: translate(450px, 105px); }
        65% { transform: translate(450px, 105px); }
        85% { transform: translate(670px, 105px); opacity: 1; }
        95% { transform: translate(805px, 105px); opacity: 1; }
        100% { transform: translate(805px, 105px); opacity: 0; }
      }
      .wf-ink-muted { fill: #475569; }
      .wf-ink-strong { fill: #0e3a5a; }

      /* Dark mode. The OS preference is the default, but the Hop site also has
         its own light/dark toggle which sets data-theme on the page root, so
         both have to be honoured -- and an explicit light choice has to win
         over a dark OS. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .wf-bg { fill: #0f172a; }
        :root:not([data-theme="light"]) .wf-card { fill: #1e293b; stroke: #334155; }
        :root:not([data-theme="light"]) .wf-card-start { fill: #1e293b; stroke: #60a5fa; }
        :root:not([data-theme="light"]) .wf-card-success { fill: #1e293b; stroke: #10b981; }
        :root:not([data-theme="light"]) .wf-card-fail { fill: #1e293b; stroke: #ef4444; }
        :root:not([data-theme="light"]) .wf-text-title { fill: #f1f5f9; }
        :root:not([data-theme="light"]) .wf-text-subtitle { fill: #94a3b8; }
        :root:not([data-theme="light"]) .wf-hop-uncond { stroke: #94a3b8; }
        :root:not([data-theme="light"]) .wf-ribbon { fill: #1e293b; stroke: #334155; }
        :root:not([data-theme="light"]) .wf-ribbon-text { fill: #cbd5e1; }
        :root:not([data-theme="light"]) .wf-ink-muted { fill: #94a3b8; }
        :root:not([data-theme="light"]) .wf-ink-strong { fill: #f1f5f9; }
      }

      :root[data-theme="dark"] .wf-bg { fill: #0f172a; }
      :root[data-theme="dark"] .wf-card { fill: #1e293b; stroke: #334155; }
      :root[data-theme="dark"] .wf-card-start { fill: #1e293b; stroke: #60a5fa; }
      :root[data-theme="dark"] .wf-card-success { fill: #1e293b; stroke: #10b981; }
      :root[data-theme="dark"] .wf-card-fail { fill: #1e293b; stroke: #ef4444; }
      :root[data-theme="dark"] .wf-text-title { fill: #f1f5f9; }
      :root[data-theme="dark"] .wf-text-subtitle { fill: #94a3b8; }
      :root[data-theme="dark"] .wf-hop-uncond { stroke: #94a3b8; }
      :root[data-theme="dark"] .wf-ribbon { fill: #1e293b; stroke: #334155; }
      :root[data-theme="dark"] .wf-ribbon-text { fill: #cbd5e1; }
      :root[data-theme="dark"] .wf-ink-muted { fill: #94a3b8; }
      :root[data-theme="dark"] .wf-ink-strong { fill: #f1f5f9; }
    </style>

    <marker id="arrow-uncond" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0e3a5a" />
    </marker>
    <marker id="arrow-succ" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="310" rx="10" class="wf-bg" />

  <!-- Top Title Banner -->
  <g transform="translate(25, 16)">
    <rect width="830" height="36" rx="6" fill="#0e3a5a" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">
      Workflow Orchestration &amp; Backtracking Model
    </text>
    <text x="392" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94a3b8">
      — One action at a time; hops route on success or failure
    </text>
  </g>

  <!-- CONNECTIONS / HOPS -->

  <!-- Hop 1: Start -> Check Files (Unconditional) -->
  <line x1="105" y1="150" x2="165" y2="150" class="wf-hop-uncond" marker-end="url(#arrow-uncond)" />
  <rect x="110" y="131" width="52" height="18" rx="3" fill="#e2e8f0" />
  <text x="136" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" class="wf-ink-strong">ALWAYS</text>

  <!-- Hop 2 (Success Path): Check Files -> Run Pipeline -->
  <path d="M 325 150 C 355 150, 360 105, 395 105" class="wf-hop-success" marker-end="url(#arrow-succ)" />
  <rect x="338" y="93" width="60" height="18" rx="3" fill="#d1fae5" />
  <text x="368" y="106" text-anchor="middle" class="wf-hop-label" fill="#059669">SUCCESS</text>

  <!-- Hop 3: Run Pipeline -> Archive Files -->
  <line x1="555" y1="105" x2="615" y2="105" class="wf-hop-success" marker-end="url(#arrow-succ)" />
  <rect x="565" y="90" width="42" height="17" rx="3" fill="#d1fae5" />
  <text x="586" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#059669">TRUE</text>

  <!-- Hop 4: Archive Files -> Success Action -->
  <line x1="765" y1="105" x2="805" y2="105" class="wf-hop-success" marker-end="url(#arrow-succ)" />

  <!-- Hop 5 (Failure Path): Check Files -> Send Alert -->
  <path d="M 325 150 C 355 150, 360 205, 395 205" class="wf-hop-failure" marker-end="url(#arrow-fail)" />
  <rect x="338" y="186" width="60" height="18" rx="3" fill="#fee2e2" />
  <text x="368" y="199" text-anchor="middle" class="wf-hop-label" fill="#dc2626">FAILURE</text>

  <!-- Hop 6: Send Alert -> Abort -->
  <line x1="555" y1="205" x2="615" y2="205" class="wf-hop-failure" marker-end="url(#arrow-fail)" />
  <rect x="565" y="190" width="42" height="17" rx="3" fill="#fee2e2" />
  <text x="586" y="203" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#dc2626">FALSE</text>

  <!-- ACTION 0: START -->
  <g transform="translate(25, 105)">
    <rect width="80" height="90" class="wf-card-start" />
    <circle cx="40" cy="34" r="14" fill="#0e3a5a" />
    <polygon points="36,27 48,34 36,41" fill="#ffffff" />
    <text x="40" y="64" text-anchor="middle" class="wf-text-title" font-size="13">Start</text>
    <text x="40" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b">Origin</text>
  </g>

  <!-- ACTION 1: CHECK SOURCE FILES -->
  <g transform="translate(165, 105)">
    <rect width="160" height="90" class="wf-card" />
    <rect x="12" y="10" width="64" height="18" rx="3" fill="#f1f5f9" />
    <text x="44" y="23" text-anchor="middle" class="wf-text-tag wf-ink-muted">Action 1</text>
    <text x="14" y="50" class="wf-text-title">Check Files</text>
    <text x="14" y="68" class="wf-text-subtitle">Prerequisites check</text>
    <text x="14" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" class="wf-ink-strong">Exit: True / False</text>
  </g>

  <!-- ACTION 2: RUN INGESTION PIPELINE (SUCCESS BRANCH) -->
  <g transform="translate(395, 60)">
    <rect width="160" height="90" class="wf-card-success" />
    <rect x="12" y="10" width="64" height="18" rx="3" fill="#d1fae5" />
    <text x="44" y="23" text-anchor="middle" class="wf-text-tag" fill="#059669">Action 2</text>
    <text x="14" y="50" class="wf-text-title">Run Pipeline</text>
    <text x="14" y="68" class="wf-text-subtitle">Fires data worker</text>
    <text x="14" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">Streams records</text>
  </g>

  <!-- ACTION 3: ARCHIVE FILES (SUCCESS BRANCH) -->
  <g transform="translate(615, 60)">
    <rect width="150" height="90" class="wf-card" />
    <rect x="12" y="10" width="64" height="18" rx="3" fill="#f1f5f9" />
    <text x="44" y="23" text-anchor="middle" class="wf-text-tag wf-ink-muted">Action 3</text>
    <text x="14" y="50" class="wf-text-title">Archive Files</text>
    <text x="14" y="68" class="wf-text-subtitle">Moves input to S3</text>
    <text x="14" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">Cleans temp dir</text>
  </g>

  <!-- SUCCESS END ACTION -->
  <g transform="translate(805, 85)">
    <circle cx="20" cy="20" r="18" fill="#10b981" />
    <polyline points="13,20 18,25 28,15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="20" y="50" text-anchor="middle" class="wf-text-title" font-size="12" fill="#059669">Success</text>
  </g>

  <!-- ACTION 4: SEND ALERT EMAIL (FAILURE BRANCH) -->
  <g transform="translate(395, 160)">
    <rect width="160" height="90" class="wf-card-fail" />
    <rect x="12" y="10" width="66" height="18" rx="3" fill="#fee2e2" />
    <text x="45" y="23" text-anchor="middle" class="wf-text-tag" fill="#dc2626">Fallback</text>
    <text x="14" y="50" class="wf-text-title">Send Alert</text>
    <text x="14" y="68" class="wf-text-subtitle">Emails on-call team</text>
    <text x="14" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Logs error details</text>
  </g>

  <!-- ACTION 5: ABORT WORKFLOW -->
  <g transform="translate(615, 160)">
    <rect width="150" height="90" class="wf-card-fail" />
    <rect x="12" y="10" width="54" height="18" rx="3" fill="#fee2e2" />
    <text x="39" y="23" text-anchor="middle" class="wf-text-tag" fill="#dc2626">Abort</text>
    <text x="14" y="50" class="wf-text-title">Abort Workflow</text>
    <text x="14" y="68" class="wf-text-subtitle">Flags job as failed</text>
    <text x="14" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Stops execution</text>
  </g>

  <!-- Sequential Step Execution Tracker (Pulsing Token) -->
  <circle cx="0" cy="0" r="6" fill="#00a3a6" stroke="#ffffff" stroke-width="2" class="wf-token-seq" />

  <!-- Bottom Explanatory Ribbon -->
  <g transform="translate(25, 260)">
    <rect width="830" height="36" class="wf-ribbon" />
    <circle cx="20" cy="18" r="4.5" fill="#10b981" />
    <text x="34" y="22" class="wf-ribbon-text">
      Backtracking: Hop follows one branch to its end, then returns to the last fork and takes any branch it has not run yet.
    </text>
  </g>
</svg>
