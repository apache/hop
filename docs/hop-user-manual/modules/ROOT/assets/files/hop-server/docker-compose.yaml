# Sample Compose file for a Hop Server image that already contains the project
# at /your-project. Environment JSON is mounted from the host so secrets stay
# out of the image.

services:
  hop-server:
    image: registry.example.com/your-project-hop-server:${GIT_SHA:-latest}
    ports:
      - "8080:8080"
    environment:
      HOP_PROJECT_FOLDER: /your-project
      HOP_PROJECT_NAME: your-project
      HOP_ENVIRONMENT_NAME: prod
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /config/prod.json
      HOP_SERVER_HOSTNAME: "0.0.0.0"
      HOP_SERVER_PORT: "8080"
      HOP_SERVER_USER: hop-admin
      HOP_SERVER_PASS: change-me
      HOP_SERVER_SHUTDOWN_TIMEOUT: "120"
    volumes:
      - /etc/hop/prod.json:/config/prod.json:ro
    restart: unless-stopped
    stop_grace_period: 120s
