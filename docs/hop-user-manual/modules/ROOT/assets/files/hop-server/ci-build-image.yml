# Sample GitHub Actions workflow: on a push to main, build the Hop Server
# image that contains this project and push it to a registry.
# Copy to .github/workflows/ in the project repository and adjust the
# registry login to match your registry.

name: Build Hop Server image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hop-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}/hop-server:main
