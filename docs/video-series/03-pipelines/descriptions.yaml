summary:
  en: Build your first Apache Hop pipeline. A pipeline moves rows through transforms that run together.
    You open a sample, create an empty pipeline, add Generate rows, split a hop, and preview the rows.
    The order id sequence starts at 1000.
  zh-CN: 搭建你的第一条 Apache Hop Pipeline。Pipeline 让一起运行的 Transform 搬运数据行。你会打开一个示例，新建一条空的 Pipeline，添加 Generate
    rows，拆开一条 hop，并预览这些行。order id 序列从 1000 开始。
  es-ES: Construye tu primer Pipeline de Apache Hop. Un Pipeline mueve filas a través de Transform que
    se ejecutan juntos. Abres un ejemplo, creas un Pipeline vacío, añades Generate rows, partes un hop
    y previsualizas las filas. La secuencia order id empieza en 1000.
  pt-PT: Constrói o teu primeiro Pipeline do Apache Hop. Um Pipeline move linhas através de Transform
    que correm juntos. Abres um exemplo, crias um Pipeline vazio, adicionas Generate rows, divides um
    hop e pré-visualizas as linhas. A sequência order id começa em 1000.
  fr-FR: Construisez votre premier Pipeline Apache Hop. Un Pipeline déplace des lignes à travers des Transform
    qui tournent ensemble. Vous ouvrez un exemple, créez un Pipeline vide, ajoutez Generate rows, scindez
    un hop et prévisualisez les lignes. La séquence order id commence à 1000.
  de-DE: Baue deine erste Apache-Hop-Pipeline. Eine Pipeline bewegt Zeilen durch Transform, die zusammen
    laufen. Du öffnest ein Beispiel, legst eine leere Pipeline an, fügst Generate rows hinzu, teilst einen
    hop und siehst dir die Zeilen an. Die order-id-Folge beginnt bei 1000.
  it-IT: Costruisci il tuo primo Pipeline di Apache Hop. Un Pipeline sposta le righe attraverso Transform
    che girano insieme. Apri un esempio, crei un Pipeline vuoto, aggiungi Generate rows, dividi un hop
    e vedi l'anteprima delle righe. La sequenza order id inizia da 1000.
