  en: Version control with Git
  zh-CN: 用 Git 做版本控制
  es-ES: Control de versiones con Git
  pt-PT: Controlo de versões com Git
  fr-FR: Contrôle de version avec Git
  de-DE: Versionsverwaltung mit Git
