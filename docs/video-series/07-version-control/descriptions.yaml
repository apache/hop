summary:
  en: Give the project folder a Git history from Hop GUI. The first commit adds the pipeline and the workflow
    from the default project. A later commit changes the order id sequence from 1000 to 50000, and the
    visual diff shows both values side by side. Environment files and passwords stay out of the repository.
  zh-CN: 在 Hop GUI 里给 project 文件夹加上 Git 历史。第一次提交加入 default project 里的 Pipeline 和 Workflow。之后的一次提交把 order
    id 序列从 1000 改成 50000，可视化差异并排显示这两个值。environment 文件和密码留在仓库之外。
  es-ES: Dale al project una historia de Git desde Hop GUI. El primer commit añade el Pipeline y el Workflow
    del default project. Un commit posterior cambia la secuencia order id de 1000 a 50000, y la diferencia
    visual muestra los dos valores lado a lado. Los archivos de environment y las contraseñas se quedan
    fuera del repositorio.
  pt-PT: Dá à pasta do project uma história Git a partir do Hop GUI. O primeiro commit adiciona o Pipeline
    e o Workflow do default project. Um commit posterior muda a sequência order id de 1000 para 50000,
    e a diferença visual mostra os dois valores lado a lado. Os ficheiros de environment e as palavras-passe
    ficam fora do repositório.
  fr-FR: Donnez au dossier du project un historique Git depuis Hop GUI. Le premier commit ajoute le Pipeline
    et le Workflow du default project. Un commit suivant change la séquence order id de 1000 à 50000,
    et le diff visuel montre les deux valeurs côte à côte. Les fichiers d'environment et les mots de passe
    restent hors du dépôt.
  de-DE: Gib dem project-Ordner aus Hop GUI eine Git-Geschichte. Der erste Commit fügt die Pipeline und
    den Workflow aus dem default project hinzu. Ein späterer Commit ändert die order-id-Folge von 1000
    auf 50000, und der visuelle Vergleich zeigt beide Werte nebeneinander. environment-Dateien und Passwörter
    bleiben außerhalb des Repository.
  it-IT: Dai alla cartella del project una storia Git da Hop GUI. Il primo commit aggiunge il Pipeline
    e il Workflow del default project. Un commit successivo cambia la sequenza order id da 1000 a 50000,
    e il confronto visivo mostra i due valori uno accanto all'altro. I file di environment e le password
    restano fuori dal repository.
