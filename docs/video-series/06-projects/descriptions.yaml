title:
  en: Projects and environments
  zh-CN: project 和 environment
  es-ES: project y environment
  pt-PT: project e environment
  fr-FR: project et environment
  de-DE: project und environment
  it-IT: project e environment
summary:
  en: A project is the folder you share. An environment holds the values that change between development
    and production, in configuration files kept outside that folder. Hop reads those files from top to
    bottom, and a later file wins. Passwords do not belong in the project. The next video puts the folder
    in Git.
  zh-CN: project 是你分享的文件夹。environment 存放在开发和生产之间会变化的值，这些配置文件放在文件夹之外。Hop 从上到下读取这些文件，后面的文件获胜。密码不属于 project。下一集把这个文件夹放进
    Git。
  es-ES: Un project es la carpeta que compartes. Un environment guarda los valores que cambian entre desarrollo
    y producción, en archivos de configuración fuera de esa carpeta. Hop lee esos archivos de arriba abajo,
    y gana el archivo posterior. Las contraseñas no pertenecen al project. El siguiente vídeo pone la
    carpeta en Git.
  pt-PT: Um project é a pasta que partilhas. Um environment guarda os valores que mudam entre desenvolvimento
    e produção, em ficheiros de configuração fora dessa pasta. O Hop lê esses ficheiros de cima para baixo,
    e o ficheiro seguinte ganha. As palavras-passe não pertencem ao project. O vídeo seguinte põe a pasta
    no Git.
  fr-FR: Un project est le dossier que vous partagez. Un environment contient les valeurs qui changent
    entre le développement et la production, dans des fichiers de configuration gardés hors de ce dossier.
    Hop lit ces fichiers de haut en bas, et le fichier qui suit l'emporte. Les mots de passe n'ont pas
    leur place dans le project. La vidéo suivante met le dossier dans Git.
  de-DE: Ein project ist der Ordner, den du teilst. Ein environment enthält die Werte, die sich zwischen
    Entwicklung und Produktion ändern, in Konfigurationsdateien außerhalb dieses Ordners. Hop liest diese
    Dateien von oben nach unten, und die spätere Datei gewinnt. Passwörter gehören nicht ins project.
    Das nächste Video legt den Ordner in Git.
  it-IT: Un project è la cartella che condividi. Un environment contiene i valori che cambiano tra sviluppo
    e produzione, in file di configurazione tenuti fuori da quella cartella. Hop legge quei file dall'alto
    in basso, e vince il file più in basso. Le password non appartengono al project. Il video successivo
    mette la cartella in Git.
