summary:
  en: Apache Hop is a data integration and orchestration platform. This short video explains what Hop
    is for, who it is for, and where to start. A pipeline moves rows. A workflow runs tasks. The same
    work can run on your laptop or on a server.
  zh: Apache Hop 是一个数据集成与编排平台。这个短视频说明 Hop 用来做什么、适合谁，以及从哪里开始。Pipeline 搬运数据行。Workflow 按顺序运行任务。同一套工作可以在笔记本上运行，也可以在服务器上运行。
  es-MX: Apache Hop es una plataforma de integración y orquestación de datos. Este video corto explica
    para qué sirve Hop, para quién es y por dónde empezar. Un Pipeline mueve filas. Un Workflow ejecuta
    tareas. El mismo trabajo puede correr en tu laptop o en un servidor.
  pt-BR: O Apache Hop é uma plataforma de integração e orquestração de dados. Este vídeo curto explica
    para que o Hop serve, para quem ele é e por onde começar. Um Pipeline move linhas. Um Workflow executa
    tarefas. O mesmo trabalho pode rodar no seu notebook ou em um servidor.
  fr: Apache Hop est une plateforme d'intégration et d'orchestration de données. Cette courte vidéo explique
    à quoi sert Hop, à qui il s'adresse et par où commencer. Un Pipeline déplace des lignes. Un Workflow
    exécute des tâches. Le même travail peut tourner sur votre ordinateur ou sur un serveur.
  de-DE: Apache Hop ist eine Plattform für Datenintegration und Orchestrierung. Dieses kurze Video erklärt,
    wofür Hop da ist, für wen es gedacht ist und wo du anfängst. Ein Pipeline bewegt Zeilen. Ein Workflow
    führt Aufgaben aus. Dieselbe Arbeit kann auf deinem Laptop oder auf einem Server laufen.
  it-IT: Apache Hop è una piattaforma di integrazione e orchestrazione dei dati. Questo breve video spiega
    a cosa serve Hop, per chi è e da dove iniziare. Un Pipeline sposta le righe. Un Workflow esegue i
    compiti. Lo stesso lavoro può girare sul tuo portatile o su un server.
  nl-NL: Apache Hop is een platform voor data-integratie en orkestratie. Deze korte video legt uit waar
    Hop voor is, voor wie het bedoeld is en waar je begint. Een Pipeline verplaatst rijen. Een Workflow
    voert taken uit. Hetzelfde werk kan op je laptop of op een server draaien.
