title:
  en: Run a pipeline and a workflow
  zh-CN: 运行 Pipeline 和 Workflow
  es-ES: Ejecutar un Pipeline y un Workflow
  pt-PT: Executar um Pipeline e um Workflow
  fr-FR: Exécuter un Pipeline et un Workflow
  de-DE: Eine Pipeline und einen Workflow ausführen
  it-IT: Eseguire un Pipeline e un Workflow
summary:
  en: Run the pipeline and the workflow you built. In Hop GUI, Run finishes the work, a preview shows
    the first rows, and Pause pipeline on condition stops on a matching row. Then hop-run runs the same
    files from the command line, with the project, the environment, a path inside the project, the run
    configuration, and log level Basic.
  zh-CN: 运行你已经搭建的 Pipeline 和 Workflow。在 Hop GUI 里，Run 把工作做完，预览显示最前面的几行，Pause pipeline on condition 在某一行符合条件时停下。然后
    hop-run 从命令行运行同样的文件，带上 project、environment、project 内的路径、run configuration，以及日志级别 Basic。
  es-ES: Ejecuta el Pipeline y el Workflow que construiste. En Hop GUI, Run termina el trabajo, una vista
    previa muestra las primeras filas y Pause pipeline on condition se detiene en una fila que coincide.
    Después hop-run ejecuta los mismos archivos desde la línea de comandos, con el project, el environment,
    una ruta dentro del project, la run configuration y el nivel de registro Basic.
  pt-PT: Executa o Pipeline e o Workflow que construíste. No Hop GUI, Run termina o trabalho, uma pré-visualização
    mostra as primeiras linhas e Pause pipeline on condition pára numa linha que coincide. Depois o hop-run
    executa os mesmos ficheiros a partir da linha de comandos, com o project, o environment, um caminho
    dentro do project, a run configuration e o nível de registo Basic.
  fr-FR: Exécutez le Pipeline et le Workflow que vous avez construits. Dans Hop GUI, Run termine le travail,
    un aperçu montre les premières lignes et Pause pipeline on condition s'arrête sur une ligne qui correspond.
    Ensuite hop-run exécute les mêmes fichiers depuis la ligne de commande, avec le project, l'environment,
    un chemin dans le project, la run configuration et le niveau de journal Basic.
  de-DE: Führe die Pipeline und den Workflow aus, die du gebaut hast. In Hop GUI beendet Run die Arbeit,
    eine Vorschau zeigt die ersten Zeilen, und Pause pipeline on condition hält bei einer passenden Zeile
    an. Danach führt hop-run dieselben Dateien von der Kommandozeile aus, mit project, environment, einem
    Pfad im project, der run configuration und der Protokollstufe Basic.
  it-IT: Esegui il Pipeline e il Workflow che hai costruito. In Hop GUI, Run completa il lavoro, un'anteprima
    mostra le prime righe e Pause pipeline on condition si ferma su una riga corrispondente. Poi hop-run
    esegue gli stessi file dalla riga di comando, con il project, l'environment, un percorso dentro il
    project, la run configuration e il livello di log Basic.
