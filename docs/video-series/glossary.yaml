# Product words stay in English in every spoken language, because the GUI
# in the picture uses these words. Gloss a word the first time, then keep it.
keep_english:
  - Pipeline
  - Workflow
  - Transform
  - Action
  - Hop GUI
  - Hop Web
  - Hop Server
  - project
  - environment
  - run configuration

# Literal replacements applied to the text before text-to-speech.
# Subtitles keep the narration as written. Longer patterns win.
speak_as:
  - pattern: project-config.json
    say: project config
  - pattern: first-workflow.hwf
    say: first workflow
  - pattern: first-pipeline.hpl
    say: first pipeline
  - pattern: PRM_EXAMPLE
    say: parameter example
  - pattern: hop-run.bat
    say: hop run batch
  - pattern: hop-run.sh
    say: hop run shell
  - pattern: hop-gui.bat
    say: hop gui batch
  - pattern: hop-gui.sh
    say: hop gui shell
  - pattern: hop-env
    say: hop env
  - pattern: hop-run
    say: hop run
  - pattern: "java -version"
    say: java version
  - pattern: "${PROJECT_HOME}"
    say: the PROJECT_HOME variable
  - pattern: "${PASSWORD}"
    say: the PASSWORD variable

# Sent to the TTS API as replace. The written narration and the subtitles
# stay as they are. A value in slashes is IPA. GUI is "gooey", not G-U-I.
pronounce:
  GUI: "/ˈɡuːi/"
