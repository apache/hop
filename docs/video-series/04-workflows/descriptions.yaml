summary:
  en: Build your first Apache Hop workflow. A workflow runs actions in order and chooses a green path
    when the pipeline succeeds and a red path when it fails. The workflow runs the pipeline from the previous
    video. You can also start the workflow at a chosen action.
  zh-CN: 搭建你的第一条 Apache Hop Workflow。Workflow 按顺序运行 Action，Pipeline 成功时走绿色路径，失败时走红色路径。这条 Workflow 运行上一集的
    Pipeline。你也可以从指定的 Action 开始运行 Workflow。
  es-ES: Construye tu primer Workflow de Apache Hop. Un Workflow ejecuta Action en orden y elige un camino
    verde cuando el Pipeline tiene éxito y un camino rojo cuando falla. El Workflow ejecuta el Pipeline
    del vídeo anterior. También puedes empezar el Workflow en un Action elegido.
  pt-PT: Constrói o teu primeiro Workflow do Apache Hop. Um Workflow executa Action por ordem e escolhe
    um caminho verde quando o Pipeline tem sucesso e um caminho vermelho quando falha. O Workflow executa
    o Pipeline do vídeo anterior. Também podes começar o Workflow num Action à tua escolha.
  fr-FR: Construisez votre premier Workflow Apache Hop. Un Workflow exécute les Action dans l'ordre et
    choisit un chemin vert quand le Pipeline réussit et un chemin rouge quand il échoue. Le Workflow exécute
    le Pipeline de la vidéo précédente. Vous pouvez aussi démarrer le Workflow à un Action choisi.
  de-DE: Baue deinen ersten Apache-Hop-Workflow. Ein Workflow führt Action der Reihe nach aus und nimmt
    einen grünen Pfad, wenn die Pipeline gelingt, und einen roten, wenn sie fehlschlägt. Der Workflow
    führt die Pipeline aus dem vorigen Video aus. Du kannst den Workflow auch bei einem gewählten Action
    starten.
  it-IT: Costruisci il tuo primo Workflow di Apache Hop. Un Workflow esegue gli Action in ordine e sceglie
    un percorso verde quando il Pipeline riesce e un percorso rosso quando fallisce. Il Workflow esegue
    il Pipeline del video precedente. Puoi anche avviare il Workflow da un Action scelto.
