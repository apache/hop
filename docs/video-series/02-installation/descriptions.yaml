summary:
  en: Install the Apache Hop client. You need Java 21, the latest client zip from hop.apache.org, and
    a few minutes. Unpack it, start Hop GUI, and keep your configuration outside the installation folder
    so the next version still sees your projects.
  zh-CN: 安装 Apache Hop 客户端。你需要 Java 21、hop.apache.org 上最新的客户端 zip，以及几分钟时间。解压并启动 Hop GUI，把配置放在安装文件夹之外，这样下一个版本仍然看得到你的
    project。
  es-ES: Instala el cliente de Apache Hop. Necesitas Java 21, el zip más reciente del cliente en hop.apache.org
    y unos minutos. Descomprímelo, arranca Hop GUI y guarda la configuración fuera de la carpeta de instalación,
    para que la siguiente versión siga viendo tus projects.
  pt-PT: Instala o cliente Apache Hop. Precisas do Java 21, do zip mais recente do cliente em hop.apache.org
    e de uns minutos. Descompacta-o, inicia o Hop GUI e mantém a configuração fora da pasta de instalação,
    para a versão seguinte continuar a ver os teus projects.
  fr-FR: Installez le client Apache Hop. Il vous faut Java 21, le zip le plus récent du client sur hop.apache.org,
    et quelques minutes. Décompressez-le, lancez Hop GUI et gardez la configuration en dehors du dossier
    d'installation, pour que la version suivante voie encore vos projects.
  de-DE: Installiere den Apache-Hop-Client. Du brauchst Java 21, das neueste Client-Zip von hop.apache.org
    und ein paar Minuten. Entpacke es, starte Hop GUI und lege die Konfiguration außerhalb des Installationsordners
    ab, damit die nächste Version deine projects noch sieht.
  it-IT: Installa il client Apache Hop. Ti servono Java 21, lo zip più recente del client su hop.apache.org
    e qualche minuto. Scompattalo, avvia Hop GUI e tieni la configurazione fuori dalla cartella di installazione,
    così la versione successiva vede ancora i tuoi project.
