title:
  en: Install the Apache Hop client
  zh-CN: 安装 Apache Hop 客户端
  es-ES: Instalar el cliente de Apache Hop
  pt-PT: Instalar o cliente Apache Hop
  fr-FR: Installer le client Apache Hop
  de-DE: Den Apache-Hop-Client installieren
