title:
  en: Secrets and variable resolvers
  zh-CN: 机密和变量解析器
  es-ES: Secretos y resolvers de variables
  pt-PT: Segredos e resolvers de variáveis
  fr-FR: Secrets et résolveurs de variables
  de-DE: Geheimnisse und Variablen-Resolver
  it-IT: Segreti e resolver di variabili
summary:
  en: |
    A password does not belong in the connection or in Git. The connection named crm stores ${PASSWORD}. On your laptop the environment sets that name to the example value abcd. On a shared system the same name is #{keystore:databases/crm:password}, and a variable resolver reads the vault. The token that opens the vault stays outside the project.
  zh-CN: |
    密码不属于连接，也不属于 Git。名为 crm 的连接里存放的是 ${PASSWORD}。在笔记本上，environment 把这个名字设成示例值 abcd。在共享系统上，同一个名字是 #{keystore:databases/crm:password}，由变量解析器去读取保险库。打开保险库的令牌留在 project 之外。
  es-ES: |
    Una contraseña no pertenece a la conexión ni a Git. La conexión llamada crm guarda ${PASSWORD}. En tu portátil el environment pone ese nombre en el valor de ejemplo abcd. En un sistema compartido el mismo nombre es #{keystore:databases/crm:password}, y un resolver de variables lee la caja fuerte. El token que abre la caja fuerte se queda fuera del project.
  pt-PT: |
    Uma palavra-passe não pertence à ligação nem ao Git. A ligação chamada crm guarda ${PASSWORD}. No teu portátil o environment põe esse nome no valor de exemplo abcd. Num sistema partilhado o mesmo nome é #{keystore:databases/crm:password}, e um resolver de variáveis lê o cofre. O token que abre o cofre fica fora do project.
  fr-FR: |
    Un mot de passe n'a pas sa place dans la connexion ni dans Git. La connexion nommée crm contient ${PASSWORD}. Sur votre ordinateur portable, l'environment donne à ce nom la valeur d'exemple abcd. Sur un système partagé, le même nom est #{keystore:databases/crm:password}, et un résolveur de variables lit le coffre. Le jeton qui ouvre le coffre reste en dehors du project.
  de-DE: |
    Ein Passwort gehört nicht in die Verbindung und nicht in Git. Die Verbindung namens crm speichert ${PASSWORD}. Auf deinem Laptop setzt das environment diesen Namen auf den Beispielwert abcd. Auf einem gemeinsamen System ist derselbe Name #{keystore:databases/crm:password}, und ein Variablen-Resolver liest den Tresor. Das Token, das den Tresor öffnet, bleibt außerhalb des project.
  it-IT: |
    Una password non appartiene alla connessione né a Git. La connessione chiamata crm contiene ${PASSWORD}. Sul tuo portatile l'environment imposta quel nome sul valore di esempio abcd. Su un sistema condiviso lo stesso nome è #{keystore:databases/crm:password}, e un resolver di variabili legge il caveau. Il token che apre il caveau resta fuori dal project.
