DmlSupport.Error.MergeNotSupported=The database type {0} does not support MERGE in Hop. Use Insert/Update instead.
DmlSupport.Error.MergeVersionTooOld={0} supports MERGE from version {2}; this server is version {1}. Use Insert/Update instead.
DmlSupport.Error.UpsertNotSupported=The database type {0} has no insert-or-update statement in Hop. Use Insert/Update instead.
