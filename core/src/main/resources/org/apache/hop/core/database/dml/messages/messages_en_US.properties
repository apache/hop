DmlSupport.Error.UpdateOnlyColumn={0} can only update the columns it inserts, and column {1} is only updated.
DmlSupport.Error.UniqueKeyUnknown=Unable to read the unique indexes of table {1} to use {0}: {2}
DmlSupport.Error.NoUniqueKey={0} needs a primary key or a unique index on exactly the key columns ({1}) of table {2}.
DmlSupport.Error.OtherUniqueKey={0} reacts to every unique index, and table {2} has others besides the one on the key columns ({1}).
DmlSupport.Error.RowAliasOnMariaDb={0}: this server is MariaDB, which has no row alias for INSERT ... ON DUPLICATE KEY UPDATE.
DmlSupport.Note.NoMultiRowForm=The database type {0} declares no {1} statement of several rows: one row per statement is written.
