DmlSupport.Note.MaxParameters={0} takes at most {1} parameters per statement: {2} rows of {3} parameters each.
DmlSupport.Note.SessionRefusesMultiRow={0} rules out {1} statements of several rows here, so one row per statement is written: {2}
DmlSupport.Note.MultiRowDisabledByVariable=Statements of several rows are switched off by the variable {0}: one row per statement is written.
