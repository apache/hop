# Configuration for actions/labeler (v5+ format): a label applies when any of
# its globs matches any changed file.
# Please keep the entries sorted lexicographically in each category.

# General
AI:
  - changed-files:
      - any-glob-to-any-file: ['plugins/tech/ai/**/*', 'plugins/transforms/languagemodelchat/**/*', 'plugins/transforms/textchunker/**/*']
Beam:
  - changed-files:
      - any-glob-to-any-file: ['engine-beam/**/*']
Containers:
  - changed-files:
      - any-glob-to-any-file: ['docker/**/*', 'helm/**/*']
Documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**/*']
Git:
  - changed-files:
      - any-glob-to-any-file: ['plugins/misc/git/**/*', 'plugins/tech/git-vfs/**/*']
Graph Databases:
  - changed-files:
      - any-glob-to-any-file: ['plugins/tech/age/**/*', 'plugins/tech/falkordb/**/*', 'plugins/tech/gremlin/**/*', 'plugins/tech/neo4j/**/*']
Hop Gui:
  - changed-files:
      - any-glob-to-any-file: ['rap/**/*', 'rcp/**/*', 'ui/**/*']
Integration Testing:
  - changed-files:
      - any-glob-to-any-file: ['integration-tests/**/*']
Lineage:
  - changed-files:
      - any-glob-to-any-file: ['plugins/tech/openlineage/**/*']
Lint:
  - changed-files:
      - any-glob-to-any-file: ['plugins/misc/lint/**/*']
Spark:
  - changed-files:
      - any-glob-to-any-file: ['plugins/engines/spark/**/*']
Unit Testing:
  - changed-files:
      - any-glob-to-any-file: ['plugins/misc/testing/**/*']
