# Developer-only override for manual exploration. NOT used by CI.
#
# Pins the Marquez API/admin ports and adds the graphical Marquez web UI, so you can
# browse the lineage graph from the host while a pipeline emits lineage.
#
# Usage (brings up only Marquez + its UI, no Hop test container):
#   cd docker/integration-tests
#   docker compose -f integration-tests-openlineage.yaml \
#                  -f integration-tests-openlineage.dev.yaml up marquez marquez-web
#
# Then open:
#   - Marquez web UI : http://localhost:3000
#   - Marquez API    : http://localhost:5050/api/v1/namespaces
#
# The API host ports are 5050/5051 (not 5000/5001) because macOS reserves port 5000 for
# AirPlay Receiver. The web UI reaches the API over the internal compose network, so this
# only affects direct curl access from the host.

services:
  marquez:
    ports:
      - "5050:5000"
      - "5051:5001"

  marquez-web:
    image: marquezproject/marquez-web:latest
    # marquez-web only publishes a linux/amd64 image (see the API service note).
    platform: linux/amd64
    environment:
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
      - WEB_PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      marquez:
        condition: service_healthy
