services:
  integration_test_salesforce:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      salesforce_mock:
        condition: service_healthy
    links:
      - salesforce_mock

  salesforce_mock:
    image: python:3.12-alpine
    hostname: salesforce_mock
    command: ["python", "/opt/bulk_api.py"]
    volumes:
      - ./salesforce-mock/bulk_api.py:/opt/bulk_api.py:ro
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
