services:
  integration_test_hadoop:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    links:
      - namenode
      - datanode

  namenode:
    image: apache/hadoop:3.3.6
    hostname: namenode
    user: root
    command: >
      bash -c "mkdir -p /tmp/hadoop/dfs/name &&
      if [ ! -d /tmp/hadoop/dfs/name/current ]; then hdfs namenode -format -force -nonInteractive; fi &&
      hdfs namenode"
    volumes:
      - ./resource/hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./resource/hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_HOME: /opt/hadoop
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -E 'OFF|ON'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  datanode:
    image: apache/hadoop:3.3.6
    hostname: datanode
    user: root
    command: >
      bash -c "mkdir -p /tmp/hadoop/dfs/data && hdfs datanode"
    volumes:
      - ./resource/hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./resource/hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_HOME: /opt/hadoop
    depends_on:
      namenode:
        condition: service_healthy
