services:
  integration_test_ai:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      ollama:
        condition: service_healthy
    links:
      - ollama

  # One Ollama for every AI integration test. Each transform needs a different kind of model, so
  # the models are pulled together here rather than standing up a container per transform. Add a
  # pull line below when a new AI test needs another model, and add it to the healthcheck so the
  # test container waits for it.
  ollama:
    # Pin version for CI stability; tests reach it over compose DNS (ollama:11434).
    image: ollama/ollama:0.34.0
    hostname: ollama
    # The image ships no models, so the server is started and the test model pulled here. The
    # healthcheck below is what holds the test container back until that pull has finished.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text
        ollama pull qwen2.5:0.5b
        wait
    healthcheck:
      # nomic-embed-text is ~274MB and returns 768 dimensions, which the Embed text test asserts
      # on. qwen2.5:0.5b is ~400MB and is the chat model Structured extract uses: Ollama
      # constrains generation to the JSON schema, so a small model is enough to return the right
      # shape. Extend this condition when another model is added above.
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text && ollama list | grep -q qwen2.5"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 20s
