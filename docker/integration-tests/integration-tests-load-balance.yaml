services:
  integration_test_load_balance:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      hop_server_a:
        condition: service_healthy
      hop_server_b:
        condition: service_healthy
    links:
      - hop_server_a
      - hop_server_b

  hop_server_a:
    image: apache/hop:Development
    build:
      context: ../../.
      dockerfile: docker/Dockerfile
    pull_policy: never
    hostname: hop-server-a
    networks:
      default:
        aliases:
          - hop-server-a
    environment:
      - HOP_SERVER_PORT=8181
      - HOP_SERVER_HOSTNAME=hop-server-a
    healthcheck:
      test: curl -u cluster:cluster --fail http://hop-server-a:8181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  hop_server_b:
    image: apache/hop:Development
    build:
      context: ../../.
      dockerfile: docker/Dockerfile
    pull_policy: never
    hostname: hop-server-b
    networks:
      default:
        aliases:
          - hop-server-b
    environment:
      - HOP_SERVER_PORT=8181
      - HOP_SERVER_HOSTNAME=hop-server-b
    healthcheck:
      test: curl -u cluster:cluster --fail http://hop-server-b:8181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
