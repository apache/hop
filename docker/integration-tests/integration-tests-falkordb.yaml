services:
  integration_test_falkordb:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      falkordb:
        condition: service_healthy
    links:
      - falkordb

  falkordb:
    image: falkordb/falkordb:6.0.1
    ports:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GRAPH.QUERY healthcheck 'RETURN 0' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
