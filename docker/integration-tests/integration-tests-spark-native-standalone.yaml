# Native Spark in cluster mode against a Spark 4.1 standalone cluster: master + 2 workers.
#
# The workers share no disk with the Hop test container except /data, the data the pipelines
# read and write (HOP_DATA). Hop builds the fat jar itself, uploads it and the project package
# through the "staging" MinIO connection to SeaweedFS (S3 API, 8333), and submits MainSpark to
# the master's REST submission server. The cluster downloads both from the SeaweedFS filer over
# plain HTTP (8888), so the Spark distribution needs no extra jars.
#
# Run with: integration-tests/scripts/run-tests-docker.sh PROJECT_NAME=spark-native-standalone INCLUDE_DISABLED=true
services:
  hop-spark-native-standalone-test:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      spark:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - spark-data:/data
    command:
      - bash
      - -c
      - mkdir -p /data/files && cp /files/spark-native-standalone/files/* /data/files/ && /files/scripts/run-tests.sh ${PROJECT_NAME}

  spark:
    build:
      context: ../../docker/integration-tests/spark/.
      dockerfile: Dockerfile.master
      args:
        SPARK_VERSION: ${SPARK_NATIVE_VERSION:-4.1.3}
        HADOOP_VERSION: ${HADOOP_VERSION:-3}
        BASE_URL: ${SPARK_BASE_URL:-https://dlcdn.apache.org/spark}
    hostname: spark
    environment:
      - SPARK_MASTER_HOST=spark
      # Cluster mode submits through the REST submission server on port 6066
      - SPARK_MASTER_OPTS=-Dspark.master.rest.enabled=true

  spark-worker-1: &spark-worker
    build:
      context: ../../docker/integration-tests/spark/.
      dockerfile: Dockerfile.worker
      args:
        SPARK_VERSION: ${SPARK_NATIVE_VERSION:-4.1.3}
        HADOOP_VERSION: ${HADOOP_VERSION:-3}
        BASE_URL: ${SPARK_BASE_URL:-https://dlcdn.apache.org/spark}
    depends_on:
      spark:
        condition: service_healthy
    environment:
      - SPARK_MASTER=spark://spark:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - spark-data:/data
    # The test container writes /data as another user than the workers
    command: [ "bash", "-c", "chmod 777 /data && exec /bin/bash /worker.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "[ \"$$(stat -c %a /data)\" = 777 ] && curl -fsS http://127.0.0.1:8081/ >/dev/null" ]
      interval: 5s
      retries: 24

  spark-worker-2:
    <<: *spark-worker

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    hostname: seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: "ApacheHopAccessKey"
      AWS_SECRET_ACCESS_KEY: "ApacheHopSecretKey"
    # Create the staging bucket once the server is up; healthy only after that. No one-shot
    # setup container: the runner's "up --abort-on-container-exit" would stop on its exit.
    entrypoint:
      - sh
      - -c
      - >-
        weed server -s3 -dir=/data -volume.max=0 -master.volumeSizeLimitMB=64 &
        until echo 's3.bucket.create -name hop-staging' | weed shell -master=localhost:9333 2>&1 | grep -qE 'created bucket|already exists'; do sleep 2; done;
        touch /tmp/bucket-ready;
        wait
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/bucket-ready && curl -fsS http://localhost:8333/healthz >/dev/null" ]
      interval: 5s
      retries: 36
      start_period: 10s

volumes:
  spark-data:
