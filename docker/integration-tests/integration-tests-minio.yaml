services:
  integration_test_minio:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      seaweedfs:
        condition: service_healthy
    links:
      - seaweedfs

  # S3-compatible object store behind the "minio" VFS connection. SeaweedFS serves the S3 API on
  # 8333; the admin identity comes from the AWS_* variables. The connection is still of the Minio
  # type: that plugin speaks plain S3 and works against any compatible store.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    hostname: seaweedfs
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: "ApacheHopAccessKey"
      AWS_SECRET_ACCESS_KEY: "ApacheHopSecretKey"
    command: server -s3 -dir=/data -volume.max=0 -master.volumeSizeLimitMB=64
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
