# Echoes back the HTTP method it was called with, for any method and any path.
#
# httpbin only routes the well-known verbs, so it answers 405 to a custom method such as LIST.
# That is enough to prove a request went out, but not enough to prove the right verb arrived.
# nginx parses an arbitrary method token and exposes it as $request_method, which lets the REST
# custom-method tests (issue #4770) assert on the verb the server actually saw.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # A fixed, deliberately non-UTF-8 payload for the binary tests (issue #3746). Exact-match
        # so it wins over the catch-all method echo below.
        location = /binary {
            default_type application/octet-stream;
            alias /usr/share/nginx/binary.dat;
        }

        location / {
            default_type text/plain;
            # No trailing newline: the tests compare the response body to the method verbatim.
            return 200 "$request_method";
        }
    }
}
