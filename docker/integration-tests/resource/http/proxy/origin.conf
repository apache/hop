# An origin server that sits on an internal network the test container is not attached to, so it
# is reachable only by going through the proxy. That is what makes the negative proxy test mean
# something: without proxy settings the request cannot succeed by accident.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            default_type application/json;
            return 200 '{"reached":"proxied-origin"}';
        }
    }
}
