# A forward proxy for the REST and HTTP proxy tests, on two ports so that one container covers
# both the anonymous and the authenticated path:
#
#   3128  open to anyone
#   3129  demands Basic credentials (hopproxy / hopproxypass, see the passwords file)
#
# The tests assert on the X-Cache header Squid adds to every response, which is what distinguishes
# a proxied response from a direct one: the target servers themselves never set it.

http_port 3128
http_port 3129

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm hop-integration-tests
auth_param basic children 1
auth_param basic credentialsttl 1 minute

acl authenticated proxy_auth REQUIRED
acl authenticated_port myport 3129

# CONNECT is needed for https:// targets, which tunnel rather than being proxied in the clear.
# Squid denies a CONNECT to any port not listed here, so both TLS ports in this test set have to
# be named: 443 is mtls_test, and 8080 is the tomcat service — its server.xml puts TLS on the
# port that is conventionally plain HTTP, which is easy to misread as a typo here.
acl SSL_ports port 443
acl SSL_ports port 8080
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# Everything else on the authenticating port needs credentials; the open port needs none.
http_access deny authenticated_port !authenticated
http_access allow all

# Deterministic responses: every request reaches the origin, none is served from cache.
cache deny all
via on
forwarded_for on

# Logging is left at the image defaults on purpose: squid drops to the unprivileged "proxy" user
# and cannot open /dev/stdout, which makes it exit at start-up with "Cannot open for writing".
# Use "docker compose logs proxy" plus /var/log/squid/access.log inside the container instead.
