# A paginating API, one endpoint per RestPaginationType, so each mode can be tested against a
# server that really behaves the way that mode expects.
#
# Every endpoint serves the same six items over three pages of two. A test therefore passes only
# when it collected 6 distinct ids: too few means paging stopped early, too many (or duplicates)
# means it looped or re-fetched a page.
#
# Deliberately dumb: nginx maps request state to a canned response. The paging token a mode sends
# is what selects the page, so a mode that fails to send its token gets page one again and the
# test fails on the duplicate ids.

events {
    worker_connections 1024;
}

http {
    default_type application/json;

    # ---------------------------------------------------------------- page bodies
    # Bare arrays for the modes whose body is just the items; envelopes where a mode has to read
    # a token back out of the body.
    map $paging_page $items {
        default '[]';
        1       '[{"id":1,"name":"item-1"},{"id":2,"name":"item-2"}]';
        2       '[{"id":3,"name":"item-3"},{"id":4,"name":"item-4"}]';
        3       '[{"id":5,"name":"item-5"},{"id":6,"name":"item-6"}]';
    }

    # The cursor that reaches the client for the *next* request. Empty on the last page, which is
    # how every cursor mode learns to stop.
    map $paging_page $next_cursor {
        default '';
        1       'cursor-page-2';
        2       'cursor-page-3';
        3       '';
    }

    # ---------------------------------------------------------------- ?page=N
    # Shared by LINK_HEADER, PAGE_NUMBER and BODY_NEXT_URL. The default has to be past the end
    # rather than page one: PAGE_NUMBER keeps incrementing until a page comes back empty, so a
    # default of 1 would serve it page one forever and the loop would only stop on the safeguard.
    map $arg_page $link_page {
        default 4;
        ''      1;
        1       1;
        2       2;
        3       3;
    }
    map $link_page $link_header {
        default '';
        1       '<http://paging/link?page=2>; rel="next"';
        2       '<http://paging/link?page=3>; rel="next"';
        3       '';
    }

    # ---------------------------------------------------------------- OFFSET_LIMIT
    # offset advances by the configured limit; an offset past the end returns an empty array,
    # which is the stop signal.
    map $arg_offset $offset_page {
        default 4;
        ''      1;
        0       1;
        2       2;
        4       3;
    }

    # ---------------------------------------------------------------- CURSOR family
    # The first request carries no cursor at all, so an empty value has to mean page one.
    map $cursor_token $cursor_page {
        default         4;
        ''              1;
        'cursor-page-2' 2;
        'cursor-page-3' 3;
    }

    server {
        listen 80;

        # ------------------------------------------------------------ LINK_HEADER
        location /link {
            set $paging_page $link_page;
            add_header Link $link_header;
            return 200 $items;
        }

        # ------------------------------------------------------------ PAGE_NUMBER
        location /page {
            set $paging_page $link_page;
            return 200 $items;
        }

        # ------------------------------------------------------------ OFFSET_LIMIT
        location /offset {
            set $paging_page $offset_page;
            return 200 $items;
        }

        # ------------------------------------------------------------ CURSOR
        # Token travels as a query parameter and comes back in the body envelope.
        location /cursor {
            set $cursor_token $arg_cursor;
            set $paging_page $cursor_page;
            return 200 '{"items":$items,"next":"$next_cursor"}';
        }

        # ------------------------------------------------------------ HEADER_CURSOR
        # Same envelope, but the token arrives as a request header instead.
        location /header-cursor {
            set $cursor_token $http_x_cursor;
            set $paging_page $cursor_page;
            return 200 '{"items":$items,"next":"$next_cursor"}';
        }

        # ------------------------------------------------------------ BODY_NEXT_URL
        # The next page is an absolute URL inside the body.
        location /body-next {
            set $paging_page $link_page;
            set $next_url $link_body_next_url;
            return 200 '{"items":$items,"next_url":"$next_url"}';
        }

        # ------------------------------------------------------------ BODY_CURSOR
        # The token is in the POST body, which nginx only populates into $request_body for a
        # location that forwards the request. So this one hands the body to the internal server
        # below as a header, and that server does the mapping.
        location /body-cursor {
            proxy_pass http://127.0.0.1:8081/resolved-body-cursor;
            proxy_set_header X-Body $request_body;
        }
    }

    # BODY_CURSOR sends {"cursor":"...","limit":n} (JSON) or cursor=...&limit=n (form encoded);
    # matching on the token substring covers both without parsing either.
    map $http_x_body $body_cursor_token {
        default              '';
        '~cursor-page-2'     'cursor-page-2';
        '~cursor-page-3'     'cursor-page-3';
    }

    map $link_page $link_body_next_url {
        default '';
        1       'http://paging/body-next?page=2';
        2       'http://paging/body-next?page=3';
        3       '';
    }

    server {
        listen 127.0.0.1:8081;

        location /resolved-body-cursor {
            set $cursor_token $body_cursor_token;
            set $paging_page $cursor_page;
            return 200 '{"items":$items,"next":"$next_cursor"}';
        }
    }
}
