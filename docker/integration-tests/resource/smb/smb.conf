[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   server min protocol = SMB2
   server max protocol = SMB3
   ntlm auth = ntlmv2-only
   map to guest = Never
   usershare allow guests = no
   server signing = mandatory
   smb encrypt = desired
   disable netbios = yes
   smb ports = 445
   log level = 1
   bind interfaces only = no

[data]
   path = /share
   read only = no
   browsable = yes
   valid users = hop
   force user = hop
   create mask = 0644
   directory mask = 0755
