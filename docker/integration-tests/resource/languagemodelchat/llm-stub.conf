# Stands in for the OpenAI, Mistral, Anthropic and Hugging Face endpoints and answers every chat
# request with the API key it received, so a test can assert on the key the transform sent.
#
# The answer is the header in square brackets: "[Bearer sk-...]", or "[]" when no key was sent.
# The brackets keep an empty header from reading as a missing answer.

events {}

http {
  server {
    listen 80;
    default_type application/json;

    location = /health {
      return 200 'ok';
    }

    # OpenAI and Mistral send the key as "Authorization: Bearer <key>" and read the same
    # chat completion shape back.
    location /openai/ {
      return 200 '{"id":"stub","object":"chat.completion","created":1,"model":"stub","choices":[{"index":0,"message":{"role":"assistant","content":"[$http_authorization]"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}}';
    }

    location /mistral/ {
      return 200 '{"id":"stub","object":"chat.completion","created":1,"model":"stub","choices":[{"index":0,"message":{"role":"assistant","content":"[$http_authorization]"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}}';
    }

    # Anthropic sends the key as "x-api-key: <key>".
    location /anthropic/ {
      return 200 '{"id":"stub","type":"message","role":"assistant","model":"stub","content":[{"type":"text","text":"[$http_x_api_key]"}],"stop_reason":"end_turn","usage":{"input_tokens":1,"output_tokens":1}}';
    }

    # Hugging Face posts to the dedicated endpoint URL given as model id.
    location /huggingface {
      return 200 '[{"generated_text":"[$http_authorization]"}]';
    }
  }
}
