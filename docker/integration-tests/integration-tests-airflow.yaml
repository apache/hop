services:
  integration_test_airflow:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      airflow:
        condition: service_healthy
    links:
      - airflow
  # Airflow 3 standalone: API server, scheduler, DAG processor and triggerer in one container,
  # with SQLite and the LocalExecutor. The simple auth manager rewrites its passwords file at start-up,
  # so the file is written inside the container instead of being mounted read-only.
  airflow:
    image: apache/airflow:3.4.0
    command:
      - bash
      - -c
      - |
        echo '{"admin": "admin"}' > /opt/airflow/passwords.json && exec airflow standalone
    ports:
      - "8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=admin:admin
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE=/opt/airflow/passwords.json
    volumes:
      - ./resource/airflow/dags:/opt/airflow/dags:ro
    healthcheck:
      # Healthy once the API answers and the test DAGs are parsed.
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health && airflow dags list | grep -q hop_it_slow" ]
      interval: 10s
      timeout: 60s
      retries: 30
      start_period: 30s
