services:
  integration_test_redis:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      redis:
        condition: service_healthy
    links:
      - redis

  redis:
    # Pin version for CI stability; tests use compose DNS (redis:6379) only.
    image: redis:7.2-bookworm
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
