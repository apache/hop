services:
  integration_test_database:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      postgres:
        condition: service_healthy
      ssh:
        condition: service_started
      ssh-jump:
        condition: service_started
      ssh-target:
        condition: service_started
    links:
      - postgres
      - mysql
      - ssh
      - ssh-jump
    environment:
      - SSH_TUNNEL_HOST=ssh
      - SSH_TUNNEL_PORT=22
      - SSH_TUNNEL_USER=hop
      - SSH_TUNNEL_PASSWORD=hop_ssh_password
      - HOP_DRIVERS_DOWNLOAD=mysql

  ssh:
    build:
      context: ../../.
      dockerfile: docker/integration-tests/ssh.Dockerfile

  # SSH jump host test (main-0038-postgres-via-ssh-jump-host): Hop reaches ssh-jump, ssh-jump
  # reaches ssh-target, and only ssh-target reaches PostgreSQL as postgres-behind-ssh. The test
  # container shares no network with ssh-target and cannot resolve postgres-behind-ssh, so the
  # connection only works through both SSH servers, in that order.
  ssh-jump:
    build:
      context: ../../.
      dockerfile: docker/integration-tests/ssh.Dockerfile
    networks:
      - default
      - ssh-jump-net

  ssh-target:
    build:
      context: ../../.
      dockerfile: docker/integration-tests/ssh.Dockerfile
    networks:
      - ssh-jump-net
      - ssh-target-net

  postgres:
    image: postgres:latest
    env_file:
      - database.env
    networks:
      default:
      ssh-target-net:
        aliases:
          - postgres-behind-ssh
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s
    volumes:
      # init scripts run automatically on first cluster init (read only)
      - ./unit-test-db-startup.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

  mysql:
    image: mysql:9.2.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=my-secret-pw
    volumes:
      - ./resource/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    tmpfs:
      # secure_file_priv folder, where main-0050 lets the server write its SELECT ... INTO OUTFILE
      # files. INTO OUTFILE refuses to overwrite a file, so it has to be empty on every start, also
      # when KEEP_IMAGES=true makes compose reuse the container.
      - /var/lib/mysql-files:mode=1777

networks:
  # internal: no route out of the compose project, and no member of the default network on it.
  ssh-jump-net:
    internal: true
  ssh-target-net:
    internal: true
