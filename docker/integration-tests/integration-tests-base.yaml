services:
  integration_test:
    image: hop-base-image
    build:
      context: ../../.
      dockerfile: docker/integration-tests/unit-tests.Dockerfile
      args:
        # Exported by run-tests-docker.sh so that a rebuild triggered by "compose up --build"
        # (hop_server, spark) creates the same container user as the up-front build. A mismatch
        # makes the mounts below unreadable/unwritable for the container user.
        - JENKINS_USER=${JENKINS_USER:-jenkins}
        - JENKINS_UID=${JENKINS_UID:-1000}
        - JENKINS_GROUP=${JENKINS_GROUP:-jenkins}
        - JENKINS_GID=${JENKINS_GID:-1000}
    volumes:
      - ../../integration-tests/:/files
      # Real GCP service-account JSON, staged by run-tests-docker.sh (GCP_KEY_FILE=...).
      # Defaults to the checked-in placeholder, which makes the Google Sheets ITs skip.
      - ${GCP_KEY_HOST_PATH:-./resource/dummyfile}:/tmp/google-key-apache-hop-it.json:ro
    environment:
      - FLASK_ENV=docker
      # Optional workflow basename filter (substring or glob). Set by run-tests-docker.sh.
      - TEST_FILTER=${TEST_FILTER:-}
      # Skip Google Sheets ITs when no real service-account JSON key is provided.
      - SKIP_GOOGLE_SHEETS=${SKIP_GOOGLE_SHEETS:-false}
      # Run a project that carries a disabled.txt anyway. run-tests.sh honours the marker too, so
      # the opt-in has to reach the container as well as the host script.
      - INCLUDE_DISABLED=${INCLUDE_DISABLED:-false}
      # Seconds a single hop-run may take before the watchdog in run-tests.sh dumps its JVM
      # threads and kills it. 0 disables the watchdog.
      - HOP_IT_TIMEOUT=${HOP_IT_TIMEOUT:-1800}
    command: [ "bash", "-c", "/files/scripts/run-tests.sh ${PROJECT_NAME}" ]
