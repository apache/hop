services:
  integration_test_languagemodelchat_api_keys:
    extends:
      file: integration-tests-base.yaml
      service: integration_test
    depends_on:
      llmstub:
        condition: service_healthy
    links:
      - llmstub
    # Provider keys in the environment. The transform only sends these to the provider's own
    # endpoint, so the stub, which echoes back whichever key it receives, must never see them.
    environment:
      - OPENAI_API_KEY=sk-it-openai
      - MISTRAL_API_KEY=sk-it-mistral
      - ANTHROPIC_API_KEY=sk-it-anthropic
      - HF_ACCESS_TOKEN=hf-it-token

  # Answers chat requests for every provider with the API key it received, see llm-stub.conf.
  llmstub:
    image: nginx:alpine
    hostname: llmstub
    volumes:
      - ./resource/languagemodelchat/llm-stub.conf:/etc/nginx/nginx.conf:ro
    # 127.0.0.1 rather than localhost: busybox wget resolves localhost to ::1 first, and this
    # server listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
