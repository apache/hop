SearchConfig.MinContentQueryLength.Label=Minimum characters for content search
SearchConfig.MinContentQueryLength.Tooltip=Object names are always searched. File and field content is only searched when the query has at least this many characters (default 3). Prevents floods of hits while typing.
SearchConfig.MaxResults.Label=Maximum search results
SearchConfig.MaxResults.Tooltip=Hard limit on the number of results built for Hop GUI search (default 500). Further matches are not collected so the UI stays responsive.
SearchConfig.MaxMatchesPerFile.Label=Maximum matches per text file
SearchConfig.MaxMatchesPerFile.Tooltip=Stop scanning a single text file after this many matching lines (default 20).
SearchConfig.MaxTextFileSizeMb.Label=Maximum text file size for search (MB)
SearchConfig.MaxTextFileSizeMb.Tooltip=Text files larger than this are skipped for content search (default 1 MB). Use dedicated tools for million-row CSV/JSON files.
SearchConfig.IncludeProjectTextFiles.Label=Include project text files in content search
SearchConfig.IncludeProjectTextFiles.Tooltip=When enabled, CSV, JSON, SQL and other project text files are content-searched (subject to size and match limits). Open text files are always eligible. Disable to search only pipelines, workflows, metadata and open files.
SearchConfig.SearchAsYouType.Label=Search as you type
SearchConfig.SearchAsYouType.Tooltip=When enabled, search runs automatically after a short pause while typing. Press Enter to search immediately either way.
SearchConfig.DebounceMs.Label=Search-as-you-type delay (ms)
SearchConfig.DebounceMs.Tooltip=Milliseconds to wait after the last keystroke before running a live search (default 300).
