WorkflowRunConfigurationDialog.ExportResources.Label=Exportar recursos vinculados para o servidor
WorkflowRunConfigurationDialog.ExportResources.ToolTip=Essa opção seleciona não apenas o workflow que você está executando remotamente, mas também os pipelines e workflows referenciados.
WorkflowRunConfigurationDialog.HopServer.Label=Servidor Hop
WorkflowRunConfigurationDialog.label.Default=Tornar esta a seleção padrão
WorkflowRunConfigurationDialog.label.Description=Descrição
WorkflowRunConfigurationDialog.label.EngineType=Tipo de mecanismo de workflow
WorkflowRunConfigurationDialog.label.ExecutionInfoLocation=Local das informações de execução
WorkflowRunConfigurationDialog.label.name=Nome
WorkflowRunConfigurationDialog.NamedResourceSourceFolder.Label=Pasta de origem de referência de recursos nomeados
WorkflowRunConfigurationDialog.NamedResourceSourceFolder.ToolTip=Esta é a pasta de origem de referência para os recursos nomeados que estão sendo usados (por exemplo, '${PROJECT_HOME}')
WorkflowRunConfigurationDialog.NamedResourceTargetFolder.Label=Pasta de destino de referência de recursos nomeados
WorkflowRunConfigurationDialog.NamedResourceTargetFolder.ToolTip=É aqui que você espera que a pasta de origem seja mapeada no servidor remoto.
WorkflowRunConfigurationDialog.RunConfiguration.Label=Executar Configuração
WorkflowRunConfigurationDialog.ServerPollDelay.Label=Atraso na resposta do servidor (ms)
WorkflowRunConfigurationDialog.ServerPollInterval.Label=Intervalo de resposta do servidor (ms)
WorkflowRunConfigurationDialog.toolTip.ExecutionInfoLocation=Opcionalmente, especifique o local para onde deseja enviar informações de execução sobre este workflow.
WorkflowRunConfigurationDialog.Transactional.Label=Tornar este workflow transacional
WorkflowRunConfigurationDialog.Transactional.ToolTip=Se você habilitar isso, sempre haverá apenas uma conexão usada por banco de dados. No final do fluxo de trabalho, haverá um commit ou rollback (em caso de erro) em todas as conexões nomeadas ao mesmo tempo.
WorkflowRunConfigurationDialog.WaitUntilFinished.Label=Espere até terminar
WorkflowRunConfigurationDialog.WaitUntilFinished.ToolTip=Aguarde até que um workflow executado remotamente termine
WorkflowRunConfigurationDialog.LoadBalancingAlgorithm.Label=Algoritmo de distribuição
WorkflowRunConfigurationDialog.LoadBalancingAlgorithm.ToolTip=Carga equilibrada se espalha pelos servidores. Pacote mantém o menor número possível de servidores ocupados para os ociosos serem desativados e desligados.
WorkflowRunConfigurationDialog.LoadBalancingMaxRetries.Label=Máximo de tentativas.
WorkflowRunConfigurationDialog.LoadBalancingMaxRetries.ToolTip=Quantas vezes mais tentar outro servidor depois de uma falha de envio ou de capacidade. Use '$ {MAX RETRIES}' se você quiser isso em uma variável.
WorkflowRunConfigurationDialog.LoadBalancingRetryWindow.Label=Intervalo para tentar novamente (ms)
WorkflowRunConfigurationDialog.LoadBalancingRetryWindow.ToolTip=Desista de tentar depois de tantos milissegundos da primeira tentativa. 0 significa apenas contagem de repetição. Use '${RETRY_WINDOW_MS}' se quiser isso em uma variável.
WorkflowRunConfigurationDialog.LoadBalancingRetryOnFailure.Label=Retentar execuções falhadas.
WorkflowRunConfigurationDialog.LoadBalancingRetryOnFailure.ToolTip=Quando ativado, tente novamente se o fluxo de trabalho remoto for executado e falhar. Desligado por padrão porque uma execução falhada pode já ter escrito dados.
WorkflowRunConfigurationDialog.LoadBalancingProbeTimeout.Label=Tempo limite da sonda de servidor.
WorkflowRunConfigurationDialog.LoadBalancingProbeTimeout.ToolTip=Quanto tempo para esperar por cada verificação de situação do servidor Hop. Por padrão é 3000.
WorkflowRunConfigurationDialog.LoadBalancingConfigRefresh.Label=Intervalo de atualização de configuração (ms)
WorkflowRunConfigurationDialog.LoadBalancingConfigRefresh.ToolTip=Frequência para reler esta configuração de execução dos metadados para que ativar/desativar e máximo de mudanças simultâneas tenham efeito. Por padrão é 10000.
WorkflowRunConfigurationDialog.LoadBalancingStateFolder.Label=Pasta de estado de atribuição
WorkflowRunConfigurationDialog.LoadBalancingStateFolder.ToolTip=Pasta VFS opcional para arquivos de registros de tarefas, por exemplo, '${PROJECT HOME}/loadbalance'. Deixe vazio para ignorar os arquivos.
