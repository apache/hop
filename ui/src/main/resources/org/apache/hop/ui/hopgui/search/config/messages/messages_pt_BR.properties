SearchConfig.MinContentQueryLength.Label=Caracteres mínimos para pesquisa de conteúdo
SearchConfig.MinContentQueryLength.Tooltip=Os nomes dos objetos são sempre pesquisados. O arquivo e o conteúdo do campo só são pesquisados quando a consulta tem pelo menos tantos caracteres (padrão 3). Evita enchentes de resultados enquanto se digita.
SearchConfig.MaxResults.Label=Máximo de resultados de busca.
SearchConfig.MaxResults.Tooltip=Limite duro no número de resultados construídos para a pesquisa da interface gráfica do Hop (padrão 500). Mais resultados não são coletados para que a interface continue respondendo.
SearchConfig.MaxMatchesPerFile.Label=Máximo de correspondências por arquivo de texto
SearchConfig.MaxMatchesPerFile.Tooltip=Pare de escanear um único arquivo de texto depois de tantas linhas correspondentes (padrão 20).
SearchConfig.MaxTextFileSizeMb.Label=Tamanho máximo do arquivo de texto para pesquisa (MB)
SearchConfig.MaxTextFileSizeMb.Tooltip=Arquivos de texto maiores que este são ignorados para pesquisa de conteúdo (padrão 1 MB). Use ferramentas dedicadas para arquivos CSV/JSON.
SearchConfig.IncludeProjectTextFiles.Label=Incluir arquivos de texto do projeto na pesquisa de conteúdo
SearchConfig.IncludeProjectTextFiles.Tooltip=Quando habilitado, CSV, JSON, SQL e outros arquivos de texto do projeto são pesquisados por conteúdo (sujeito a tamanho e limites de correspondência). Arquivos de texto abertos são sempre elegíveis. Desativar para buscar apenas em condutos, fluxos de trabalho, metadados e arquivos abertos.
SearchConfig.SearchAsYouType.Label=Procure enquanto digita.
SearchConfig.SearchAsYouType.Tooltip=Quando habilitado, a busca é executada automaticamente após uma pequena pausa durante a digitação. Pressione Enter para procurar imediatamente.
SearchConfig.DebounceMs.Label="Pesquisa como você"
SearchConfig.DebounceMs.Tooltip=Milissegundos para esperar após a última tecla ser pressionda antes de executar uma busca ao vivo (padrão 300).
