DatabasePerspectiveConfigPlugin.Name=Perspectiva do Banco de Dados
DatabasePerspectiveConfigPlugin.AutoConnect.Label=Conectar automaticamente ao executar SQL
DatabasePerspectiveConfigPlugin.AutoConnect.Tooltip=Conecte o banco de dados do editor SQL sem perguntar se ele já está conectado. Você também pode ativar isso do diálogo que aparece quando a opção está desligada.
DatabasePerspectiveConfigPlugin.SelectExecuted.Label=Selecione o SQL executado no editor
DatabasePerspectiveConfigPlugin.SelectExecuted.Tooltip=Depois de executar ou executar todos, destaque apenas as declarações que foram enviadas para o banco de dados. Uma cláusula de sobra após um ponto e vírgula não é selecionada.
DatabasePerspectiveConfigPlugin.QueryRowLimit.Label=Limite da fila de consultas
DatabasePerspectiveConfigPlugin.QueryRowLimit.Tooltip=Número máximo de linhas mostradas para um SELECT no editor SQL e para visualização da tabela. Um LIMIT SQL acima desse valor ainda está aqui, então um SELECT * não puxa toda a tabela.
DatabasePerspectiveConfigPlugin.Save.Error.Title=Erro
DatabasePerspectiveConfigPlugin.Save.Error.Message=Erro ao salvar as opções de perspectiva do banco de dados
