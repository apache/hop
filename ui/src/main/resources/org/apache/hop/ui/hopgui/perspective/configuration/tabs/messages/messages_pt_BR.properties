ConfigSecurityTab.Tab.Name=Segurança.
ConfigSecurityTab.Status.Unrestricted=A sessão é irrestrita. Modo de configuração: Qualquer um pode mudar as configurações de segurança até que a autenticação esteja ativada.
ConfigSecurityTab.Status.User=Assinado como ''{0}'' com papéis. Modo de configuração: {2}.
ConfigSecurityTab.NoPermission.Message=Você não tem permissão para gerenciar as configurações de segurança. Só administradores podem mudar de modo e usuários.
ConfigSecurityTab.General.Tab=Geral.
ConfigSecurityTab.Oauth.Tab=OAuth.
ConfigSecurityTab.External.Tab=Exterior
ConfigSecurityTab.Basic.Tab=Básico.
ConfigSecurityTab.Mode.Label=Modo de autenticação
ConfigSecurityTab.Mode.Hint=Nenhum = acesso aberto. EXTERNAL = trust servlet container / reverso proxy / LDAP grupos expostos como papéis. BASIC = Forma gerenciada por Hop login + usuários (users.json). OAUTH2 = OpenID Connect (código de autorização + PKCE).
ConfigSecurityTab.Welcome.Label=Mensagem de boas-vindas
ConfigSecurityTab.Welcome.Tooltip=Mostrado na página de entrada do Hop Web (BASIC e OAUTH2). Deixe vazio para usar o padrão.
ConfigSecurityTab.Welcome.Hint=Texto personalizado opcional sob o título Apache Hop Web na página de login.
ConfigSecurityTab.Oauth.Group=OAuth2 / OpenID Connect
ConfigSecurityTab.Oauth.Issuer=URL do emissor
ConfigSecurityTab.Oauth.ClientId=ID do cliente
ConfigSecurityTab.Oauth.ClientSecret=Segredo do cliente
ConfigSecurityTab.Oauth.RedirectUri=Redirecionar URI (vazio = auto)
ConfigSecurityTab.Oauth.Scopes=Escopo
ConfigSecurityTab.Oauth.RoleClaim=Papel / grupos reivindicam
ConfigSecurityTab.Oauth.UsernameClaim=Nome de usuário:
ConfigSecurityTab.Oauth.Pkce=Use PKCE (S256)
ConfigSecurityTab.Oauth.Hint=Registre-se redirecionando URI '{context}'/outh/callback com seu IP. Ajuste o modo para OAUTH2 na guia Geral. Mapear grupos de IdP para papéis de Hop na guia Externa (mesma tabela de mapeamento é usada para grupos de reivindicação).
ConfigSecurityTab.Oauth.MappingsHint=Os nomes de grupo/papel IdP são mapeados para papéis de Hop na guia External (papel de conteúdo/idP → papel de Hop).
ConfigSecurityTab.External.Hint=O modo EXTERNA confia no principal do recipiente de servlet (Tomcat, proxy reverso ou grupos apoiados pelo LDAP expostos como papéis). Mapeie os nomes para os papéis de Hop abaixo. Os mesmos mapas são usados para grupos de reivindicação OAUTH2.
ConfigSecurityTab.RoleMappings.Group=Mapeamentos de papéis (contentor / IdP → Hop)
ConfigSecurityTab.RoleMappings.ContainerRole=Container / papel IdP
ConfigSecurityTab.RoleMappings.HopRole=Papel de hop
ConfigSecurityTab.Users.Group=Usuários (modo BASIC)
ConfigSecurityTab.Users.Hint=Deixe ''Nova senha'' vazia para manter a senha existente. Novos usuários precisam de uma senha. Funções: administrador, usuário, operador, somente leitura. Ajuste o modo para BASIC na guia Geral para usar esta loja de usuários.
ConfigSecurityTab.Users.Username=Nome de usuário
ConfigSecurityTab.Users.Roles=Papel
ConfigSecurityTab.Users.Enabled=Activado
ConfigSecurityTab.Users.NewPassword=Nova senha
ConfigSecurityTab.Users.PasswordRequired=A senha é necessária para o novo usuário.
ConfigSecurityTab.Users.EmptyStore=Pelo menos um usuário é necessário no modo BASIC.
ConfigSecurityTab.Button.Save=Salve
ConfigSecurityTab.Button.Reload=Recarregar
ConfigSecurityTab.Saved.Title=Segurança salva
ConfigSecurityTab.Saved.Message=Configuração de segurança salva. As sessões existentes do navegador mantêm seus papéis atuais até o re-login. O modo BASIC usa o filtro de Hop (também não habilita a restrição de segurança Tomcat).
ConfigSecurityTab.Error.Title=Configuração de segurança
ConfigSecurityTab.Error.Reload=Erro ao carregar a configuração de segurança.
ConfigSecurityTab.Error.Save=Erro ao salvar a configuração de segurança.
