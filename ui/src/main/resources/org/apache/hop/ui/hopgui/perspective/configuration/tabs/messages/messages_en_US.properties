ConfigSecurityTab.Welcome.Tooltip=Shown on the Hop Web sign-in page (BASIC and OAUTH2). Leave empty to use the default.
ConfigSecurityTab.Welcome.Hint=Optional custom text under the Apache Hop Web title on the login page.
ConfigSecurityTab.Oauth.Group=OAuth2 / OpenID Connect
