ConfigSecurityTab.Mode.Hint=NONE = open access. EXTERNAL = trust servlet container / reverse proxy / LDAP groups exposed as roles. BASIC = Hop-managed form login + users (users.json). OAUTH2 = OpenID Connect (authorization code + PKCE).
