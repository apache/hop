HopGui.Dialog.CopyOrDistribute.Message=La transformation ''{0}'' a {1} transformation(s) en destination.\n\nIl existe plusieurs manières d''envoyer les données vers les transformations destinatrices:\n\n   - Distribuer les lignes: Apache Hop partagera les lignes parmi les transformations : la première ligne à la première transformation, la seconde ligne à la seconde transformation, etc.\n   - Copier les lignes : chaque transformation destinatrice recevra TOUTES les lignes.\n   - Répartir la charger: Si une transformation est occupée, au lieu d''attendre que cette dernière soit de nouveau disponible, les lignes seront envoyées à la transformation suivante.\n\nQuelle méthode voulez-vous utiliser?\n (Par défaut, Apache Hop utilisera la seconde méthode)
