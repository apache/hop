PartitionSchemaDialog.Dynamic.Label=¿Crear dinámicamente la definición de esquema?
PartitionSchemaDialog.Dynamic.Tooltip=Cuando esta opción está activada, el esquema de partición será definido dinámicamente en tiempo de ejecución cuando la pipelineón es ejecutada en modo cluster. Cuando la pipelineón es ejecutada localmente las particiones indicados abajo son utilizadas.
PartitionSchemaDialog.Number.Label=¿Número de particiones por servidor esclavo?
PartitionSchemaDialog.Number.Tooltip=Especifique el número de particiones para utilizar en cada servidor esclavo. Esto es utilizado únicamente cuando la pipelineón es ejecutada en modo cluster.
PartitionSchemaDialog.PartitionID.Label=ID de partición
PartitionSchemaDialog.PartitionName.Label=Nombre del esquema de partición
PartitionSchemaDialog.Partitions.Label=Particiones
