WorkflowRunConfigurationDialog.ExportResources.Label=Export linked resources to server
WorkflowRunConfigurationDialog.ExportResources.ToolTip=This option picks up not just the workflow you're executing remotely but also the referenced pipelines and workflows.
WorkflowRunConfigurationDialog.HopServer.Label=Hop server
WorkflowRunConfigurationDialog.label.Default=Make this the default selection
WorkflowRunConfigurationDialog.label.Description=Description
WorkflowRunConfigurationDialog.label.EngineType=Workflow engine type
WorkflowRunConfigurationDialog.label.ExecutionInfoLocation = Execution information location
WorkflowRunConfigurationDialog.label.name=Name
WorkflowRunConfigurationDialog.NamedResourceSourceFolder.Label=Named resources reference source folder
WorkflowRunConfigurationDialog.NamedResourceSourceFolder.ToolTip=This is the reference source folder for the named resources that are being used (e.g. '${PROJECT_HOME}')
WorkflowRunConfigurationDialog.NamedResourceTargetFolder.Label=Named resources reference target folder
WorkflowRunConfigurationDialog.NamedResourceTargetFolder.ToolTip=This is where you would expect the source folder to map to on the remote server.
WorkflowRunConfigurationDialog.RunConfiguration.Label=Run Configuration
WorkflowRunConfigurationDialog.ServerPollDelay.Label=Server poll delay (ms)
WorkflowRunConfigurationDialog.ServerPollInterval.Label=Server poll interval (ms)
WorkflowRunConfigurationDialog.toolTip.ExecutionInfoLocation = Optionally specify the location to where you want to send execution information about this workflow.
WorkflowRunConfigurationDialog.Transactional.Label=Make this workflow transactional
WorkflowRunConfigurationDialog.Transactional.ToolTip=If you enable this there will always be just one connection used per database.  At the end of the workflow there will be a commit or rollback (in case of error) on all named connections at the same time.
WorkflowRunConfigurationDialog.WaitUntilFinished.Label=Wait until finished
WorkflowRunConfigurationDialog.WaitUntilFinished.ToolTip=Wait until a remotely executed workflow finishes
WorkflowRunConfigurationDialog.LoadBalancingAlgorithm.Label=Distribution algorithm
WorkflowRunConfigurationDialog.LoadBalancingAlgorithm.ToolTip=Even load spreads work across servers. Pack keeps as few servers busy as possible so idle ones can be disabled and turned off.
WorkflowRunConfigurationDialog.LoadBalancingMaxRetries.Label=Maximum retries
WorkflowRunConfigurationDialog.LoadBalancingMaxRetries.ToolTip=How many extra times to try another server after a submit or capacity failure. Use '${MAX_RETRIES}' if you want this in a variable.
WorkflowRunConfigurationDialog.LoadBalancingRetryWindow.Label=Retry window (ms)
WorkflowRunConfigurationDialog.LoadBalancingRetryWindow.ToolTip=Give up retrying after this many milliseconds from the first attempt. 0 means retry count only. Use '${RETRY_WINDOW_MS}' if you want this in a variable.
WorkflowRunConfigurationDialog.LoadBalancingRetryOnFailure.Label=Retry failed executions
WorkflowRunConfigurationDialog.LoadBalancingRetryOnFailure.ToolTip=When enabled, also retry if the remote workflow runs and fails. Off by default because a failed run may already have written data.
WorkflowRunConfigurationDialog.LoadBalancingProbeTimeout.Label=Server probe timeout (ms)
WorkflowRunConfigurationDialog.LoadBalancingProbeTimeout.ToolTip=How long to wait for each Hop server status check. Default 3000.
WorkflowRunConfigurationDialog.LoadBalancingConfigRefresh.Label=Configuration refresh interval (ms)
WorkflowRunConfigurationDialog.LoadBalancingConfigRefresh.ToolTip=How often to re-read this run configuration from metadata so enable/disable and max concurrent changes take effect. Default 10000.
WorkflowRunConfigurationDialog.LoadBalancingStateFolder.Label=Assignment state folder
WorkflowRunConfigurationDialog.LoadBalancingStateFolder.ToolTip=Optional VFS folder for assignment ledger files, for example '${PROJECT_HOME}/loadbalance'. Leave empty to skip files.
