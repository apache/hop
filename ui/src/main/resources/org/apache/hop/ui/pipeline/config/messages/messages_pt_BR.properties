PipelineRunConfigurationDialog.NamedResourceSourceFolder.Label=Pasta de origem de referência de recursos nomeados
PipelineRunConfigurationDialog.NamedResourceSourceFolder.ToolTip=Esta é a pasta de origem de referência para os recursos nomeados que estão sendo usados (por exemplo, '${PROJECT_HOME}')
PipelineRunConfigurationDialog.NamedResourceTargetFolder.Label=Pasta de destino de referência de recursos nomeados
PipelineRunConfigurationDialog.NamedResourceTargetFolder.ToolTip=É aqui que você espera que a pasta de origem seja mapeada no servidor remoto.
PipelineRunConfigurationDialog.RowSetSize.Label=Tamanho do conjunto de linhas
PipelineRunConfigurationDialog.RunConfiguration.Label=Executar Configuração
PipelineRunConfigurationDialog.SafeModeEnabled.Label=Modo seguro
PipelineRunConfigurationDialog.SampleSize.Label=Número de linhas para amostra na interface
PipelineRunConfigurationDialog.SampleTypeInGui.Label=Tipo de amostra durante a execução na interface
PipelineRunConfigurationDialog.ServerPollDelay.Label=Atraso na resposta do servidor (ms)
PipelineRunConfigurationDialog.ServerPollInterval.Label=Intervalo na resposta do servidor (ms)
PipelineRunConfigurationDialog.SortTransformsTopologically.Label=Ordenar transformações
PipelineRunConfigurationDialog.toolTip.ExecutionDataProfile=Este perfil descreve que tipo de dados você deseja recuperar das transformações de pipeline.
PipelineRunConfigurationDialog.toolTip.ExecutionInfoLocation=Este é o local onde todas as informações referentes à execução dos pipelines são tratadas.
PipelineRunConfigurationDialog.Transactional.Label=Tornar este pipeline transacional
PipelineRunConfigurationDialog.Transactional.ToolTip=Se você habilitar isso, sempre haverá apenas uma conexão usada por banco de dados. No final do pipeline haverá um commit ou rollback (em caso de erro) em todas as conexões nomeadas ao mesmo tempo.
PipelineRunConfigurationDialog.Variables.Column.Description=Descrição
PipelineRunConfigurationDialog.Variables.Column.Name=Nome de variável
PipelineRunConfigurationDialog.Variables.Column.Value=Valor
PipelineRunConfigurationDialog.VariablesTab.TabTitle=Variáveis
PipelineRunConfigurationDialog.WaitTime.Label=Tempo de espera para verificação do buffer (ms)
PipelineRunConfigurationDialog.DetectBufferDeadlocks.Label=Detecte bloqueios de buffers.
PipelineRunConfigurationDialog.DetectBufferDeadlocks.ToolTip=Analise o conduto para topologias divididas que podem ser bloqueadas em linhas delimitadas (motor local clássico). Os achados são registrados durante a preparação. Ativado por padrão.
PipelineRunConfigurationDialog.MitigateBufferDeadlocks.Label=Mitigar bloqueios de buffers
PipelineRunConfigurationDialog.MitigateBufferDeadlocks.ToolTip=Quando os riscos são detectados, usem conjuntos de linhas derramadas apenas no salto recomendado para que os produtores não bloqueiem quando um buffer encher. Ativado por padrão para que os condutos façam progresso em vez de pendurar; excessos de linhas derramam em disco (custo de E/S). Desative se preferir apenas memória limitada.
PipelineRunConfigurationDialog.BufferDeadlockSpillDirectory.Label=Diretório de derrames de buffers.
PipelineRunConfigurationDialog.BufferDeadlockSpillDirectory.ToolTip=Diretório de arquivos temporários derramados. Deixe vazio para usar o diretório temporário do sistema.
PipelineRunConfigurationDialog.LoadBalancingAlgorithm.Label=Algoritmo de equilíbrio
PipelineRunConfigurationDialog.LoadBalancingAlgorithm.ToolTip=Cargas equilibradas se espalham pelos servidores. Pacote mantém o menor número possível de servidores ocupados para os ociosos serem desativados e desligados.
PipelineRunConfigurationDialog.LoadBalancingMaxRetries.Label=Máximas tentativas.
PipelineRunConfigurationDialog.LoadBalancingMaxRetries.ToolTip=Quantas vezes mais tentar outro servidor depois de uma falha de envio ou de capacidade. Use '$ {MAX RETRIES}' se você quiser isso em uma variável.
PipelineRunConfigurationDialog.LoadBalancingRetryWindow.Label=Intervalo para tentar novamente (ms)
PipelineRunConfigurationDialog.LoadBalancingRetryWindow.ToolTip=Desista de tentar depois de tantos milissegundos da primeira tentativa. 0 significa apenas contagem de repetição. Use '${RETRY_WINDOW_MS}' se quiser isso em uma variável.
PipelineRunConfigurationDialog.LoadBalancingRetryOnFailure.Label=Retentar execuções falhadas.
PipelineRunConfigurationDialog.LoadBalancingRetryOnFailure.ToolTip=Quando ativado, também tente novamente se o conduto remoto for executado e falhar. Desligado por padrão porque uma execução falhada pode já ter escrito dados.
PipelineRunConfigurationDialog.LoadBalancingProbeTimeout.Label=Tempo limite da sonda de servidor.
PipelineRunConfigurationDialog.LoadBalancingProbeTimeout.ToolTip=Quanto tempo para esperar por cada verificação de status do servidor Hop. Por padrão é 3000.
PipelineRunConfigurationDialog.LoadBalancingConfigRefresh.Label=Intervalo de atualização de configuração (ms)
PipelineRunConfigurationDialog.LoadBalancingConfigRefresh.ToolTip=Frequência para reler esta configuração de execução a partir dos metadados para que ativar/desativar e máximo de mudanças simultâneas tenham efeito. Por padrão é 10000.
PipelineRunConfigurationDialog.LoadBalancingStateFolder.Label=Pasta de estado de atribuição
PipelineRunConfigurationDialog.LoadBalancingStateFolder.ToolTip=Pasta VFS opcional para arquivos de registros de tarefas, por exemplo '${PROJECT HOME}/loadbalance'. Deixe vazio para ignorar os arquivos.
PipelineRunConfigurationDialog.LockFreeRowSets.Label=
PipelineRunConfigurationDialog.LockFreeRowSets.ToolTip=
