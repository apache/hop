DatabasePerspectiveConfigPlugin.Name=Database Perspective
DatabasePerspectiveConfigPlugin.AutoConnect.Label=Automatically connect when executing SQL
DatabasePerspectiveConfigPlugin.AutoConnect.Tooltip=Connect the SQL editor's database without asking if it is not already connected. You can also enable this from the dialog that appears when the option is off.
DatabasePerspectiveConfigPlugin.SelectExecuted.Label=Select the executed SQL in the editor
DatabasePerspectiveConfigPlugin.SelectExecuted.Tooltip=After Run or Run all, highlight only the statement(s) that were sent to the database. A leftover clause after a semicolon is left unselected.
DatabasePerspectiveConfigPlugin.QueryRowLimit.Label=Query row limit
DatabasePerspectiveConfigPlugin.QueryRowLimit.Tooltip=Maximum number of rows shown for a SELECT in the SQL editor and for table preview. A SQL LIMIT above this value is still capped here so a SELECT * does not pull the whole table.
DatabasePerspectiveConfigPlugin.Save.Error.Title=Error
DatabasePerspectiveConfigPlugin.Save.Error.Message=Error saving Database perspective options
