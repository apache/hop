PipelineGraph.Hop.Tooltip.HopTypeCopy=La transformación de origen [{0}] está copiando todas las filas de salida a todas las transformaciones de destino.{1}Tenga en cuenta que esto es diferente del comportamiento por defecto, en el que las filas se distribuyen entre las transformaciones de destino de forma rotatoria.{1}
PipelineGraph.Hop.Tooltip.HopTypeError=Cada fila considerada como causa de error por la transformación [{0}] se envía a la transformación [{1}].{2}Esto se hace como parte de la configuración del tratamiento de errores de la transformación de origen.{2}
PipelineGraph.Hop.Tooltip.HopTypeInfo=Las filas se envían a la transformación [{0}] para que puedan utilizarse como información adicional.{2}Esa transformación de destino lee específicamente de la transformación [{1}] y se trata como un caso especial.{2}Esto significa que para esta transformación de origen no se aplican las reglas normales de lectura de filas.{2}Normalmente, una transformación lee información de todas las transformaciones de origen de forma rotatoria.{2}
PipelineGraph.Hop.Tooltip.InfoTransformCopies=Actualmente, el motor no permite que la transformación de origen [{0}] de la que se lee específicamente (en la transformación [{1}] se ejecute en varias copias.{2}Si por razones de rendimiento esto sigue siendo necesario, le aconsejamos que inserte (por ejemplo) una transformación ficticia (1 copia) para agregar los datos.{2}
