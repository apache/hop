WorkflowRunConfigurationDialog.Transactional.Label=Hacer que este flujo de trabajo sea transaccional
WorkflowRunConfigurationDialog.Transactional.ToolTip=Si activa esta opción, siempre se utilizará una única conexión por base de datos.  Al final del flujo de trabajo habrá un commit o rollback (en caso de error) en todas las conexiones nombradas al mismo tiempo.
