WorkflowRunConfigurationDialog.ExportResources.Label=Exportar recursos vinculados al servidor
WorkflowRunConfigurationDialog.ExportResources.ToolTip=Esta opción recoge no sólo el flujo de trabajo que está ejecutando remotamente, sino también las canalizaciones y flujos de trabajo referenciados.
WorkflowRunConfigurationDialog.HopServer.Label=Servidor hop
WorkflowRunConfigurationDialog.label.Default=Seleccione esta opción por defecto
WorkflowRunConfigurationDialog.label.Description=Descripción
WorkflowRunConfigurationDialog.label.EngineType=Tipo de motor del flujo de trabajo
WorkflowRunConfigurationDialog.label.ExecutionInfoLocation=Ubicación de la información de ejecución
WorkflowRunConfigurationDialog.label.name=Nombre
WorkflowRunConfigurationDialog.NamedResourceSourceFolder.Label=Carpeta de referencia de recursos con nombre
WorkflowRunConfigurationDialog.NamedResourceSourceFolder.ToolTip=Se trata de la carpeta de origen de referencia para los recursos con nombre que se están utilizando (por ejemplo, '${PROJECT_HOME}').
WorkflowRunConfigurationDialog.NamedResourceTargetFolder.Label=Carpeta de destino de referencia de recursos nombrados
WorkflowRunConfigurationDialog.NamedResourceTargetFolder.ToolTip=Aquí es donde se espera que la carpeta de origen se mapee en el servidor remoto.
WorkflowRunConfigurationDialog.RunConfiguration.Label=Ejecutar configuración
WorkflowRunConfigurationDialog.ServerPollDelay.Label=Retardo de sondeo del servidor (ms)
