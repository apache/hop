CachingFileExecutionInfoLocation.RootFolder.Label=Pasta para guardar os arquivos
CachingFileExecutionInfoLocation.RootFolder.Tooltip=Selecione a pasta em qual você irá encontrar um único arquivo por pipeline ou workflow executado
CachingFileExecutionInfoLocation.PersistenceDelay.Label=O tempo de atraso de persistência (em milissegundos)
CachingFileExecutionInfoLocation.PersistenceDelay.Tooltip=O tempo máximo para esperar antes de gravar dados no arquivo de cache
CachingFileExecutionInfoLocation.MaxCacheSize.Label=Tamanho máximo do cache
CachingFileExecutionInfoLocation.MaxCacheSize.Tooltip=O número máximo de execuções a serem mantidas no cache de memória (padrão: 50)
CachingFileExecutionInfoLocation.MaxCacheAge.Label=Idade máxima para entrada de cache (em milissegundos)
CachingFileExecutionInfoLocation.MaxCacheAge.Tooltip=O tempo máximo (em ms) para manter uma entrada no cache sem leitura ou gravação. Um valor ausente mantém 86400000 ms (1 dia). Novas localizações usam 600000 ms (10 minutos) por padrão.
CachingFileExecutionInfoLocation.CreateParentFolder.Label=Criar diretório?
CachingFileExecutionInfoLocation.CreateParentFolder.Tooltip=Marque essa opção para criar o diretório especificado se ele não existir.
