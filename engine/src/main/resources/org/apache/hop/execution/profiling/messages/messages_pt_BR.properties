ExecutionDataProfile.description=Descreva como os dados de saída da transformação são formados
ExecutionDataProfile.name=Perfil de Dados de Execução
ExecutionDataProfile.Group.LargeValues=Grandes valores.
ExecutionDataProfile.Label.StringValueLimit=Comprimento máximo da cadeia de caracteres
ExecutionDataProfile.Tooltip.StringValueLimit=Número máximo de caracteres de um campo de cadeia de caracteres para manter em linhas de amostra e em valores mínimos e máximos. Um corpo REST ou JSON armazenado em um campo de cadeia de caracteres usa este limite. Deixe vazio para ficar sem limite. 0 não guarda nenhum desses valores. Um valor maior é substituído por '<não armazenado, N caracteres>'. Você pode usar uma variável, por exemplo '$ {SAMPLE STRING LIMIT}'. Valores mínimos e máximos são calculados apenas a partir de valores armazenados.
ExecutionDataProfile.Label.JsonValueLimit=Comprimento máximo JSON
ExecutionDataProfile.Tooltip.JsonValueLimit=Número máximo de caracteres do texto compacto JSON para manter para um campo JSON. Deixe vazio para ficar sem limite. 0 não guarda nenhum desses valores. Um valor maior é substituído por um texto JSON '<não armazenado, N caracteres>'. Você pode usar uma variável, por exemplo, '$ {SAMPLE JSON LIMIT}'.
ExecutionDataProfile.Label.BinaryValueLimit=Tamanho binário máximo (bytes)
ExecutionDataProfile.Tooltip.BinaryValueLimit=Número máximo de bytes para um campo binário. Deixe vazio para ficar sem limite. 0 não guarda nenhum desses valores. Um valor maior é deixado vazio na amostra. Você pode usar uma variável, por exemplo '$ {SAMPLE BINARY LIMIT}'.
ExecutionDataProfile.Label.AvroValueLimit=Tamanho máximo de Avro (bytes)
ExecutionDataProfile.Tooltip.AvroValueLimit=Número máximo de bytes do esquema JSON mais o dado Avro para manter para um campo Registro Avro. Deixe vazio para ficar sem limite. 0 não guarda nenhum desses valores. Um valor maior é deixado vazio na amostra. Você pode usar uma variável, por exemplo, '$ {SAMPLE AVRO LIMIT}'.
