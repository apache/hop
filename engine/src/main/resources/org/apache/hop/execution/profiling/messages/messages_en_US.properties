ExecutionDataProfile.name=Execution Data Profile
ExecutionDataProfile.description=Describes how transform output data is profiled
ExecutionDataProfile.Group.LargeValues=Large values
ExecutionDataProfile.Label.StringValueLimit=Maximum string length
ExecutionDataProfile.Tooltip.StringValueLimit=Maximum number of characters of a String field to keep in sample rows and in minimum and maximum values. A REST or JSON body stored in a String field uses this limit. Leave empty for no limit. 0 stores none of these values. A longer value is replaced with '<not stored, N characters>'. You can use a variable, for example '${SAMPLE_STRING_LIMIT}'. Minimum and maximum values are calculated only from values that are stored.
ExecutionDataProfile.Label.JsonValueLimit=Maximum JSON length
ExecutionDataProfile.Tooltip.JsonValueLimit=Maximum number of characters of the compact JSON text to keep for a JSON field. Leave empty for no limit. 0 stores none of these values. A longer value is replaced with a JSON text '<not stored, N characters>'. You can use a variable, for example '${SAMPLE_JSON_LIMIT}'.
ExecutionDataProfile.Label.BinaryValueLimit=Maximum binary size (bytes)
ExecutionDataProfile.Tooltip.BinaryValueLimit=Maximum number of bytes to keep for a Binary field. Leave empty for no limit. 0 stores none of these values. A larger value is left empty in the sample. You can use a variable, for example '${SAMPLE_BINARY_LIMIT}'.
ExecutionDataProfile.Label.AvroValueLimit=Maximum Avro size (bytes)
ExecutionDataProfile.Tooltip.AvroValueLimit=Maximum number of bytes of schema JSON plus Avro datum to keep for an Avro Record field. Leave empty for no limit. 0 stores none of these values. A larger value is left empty in the sample. You can use a variable, for example '${SAMPLE_AVRO_LIMIT}'.