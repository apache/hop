GremlinGraphDatabase.name=Gremlin
GremlinGraphDatabase.description=A Gremlin server: Apache TinkerPop Gremlin Server, JanusGraph or Amazon Neptune
GremlinGraphDatabase.Group.Connection=Gremlin
GremlinGraphDatabase.hostnames.Label=Servers or IP addresses
GremlinGraphDatabase.hostnames.Tooltip=The host name or IP address of the Gremlin server. Separate several servers of a cluster with commas.
GremlinGraphDatabase.port.Label=Port
GremlinGraphDatabase.port.Tooltip=The port of the Gremlin server, 8182 by default
GremlinGraphDatabase.traversalSource.Label=Traversal source
GremlinGraphDatabase.traversalSource.Tooltip=The name of the traversal source on the server, g by default
GremlinGraphDatabase.username.Label=Username
GremlinGraphDatabase.username.Tooltip=The username, for servers with authentication. Leave empty otherwise.
GremlinGraphDatabase.password.Label=Password
GremlinGraphDatabase.password.Tooltip=The password, for servers with authentication
GremlinGraphDatabase.usingTls.Label=Use TLS?
GremlinGraphDatabase.usingTls.Tooltip=Connect over TLS (wss://). Amazon Neptune requires it.
GremlinGraphDatabase.serializer.Label=Serializer
GremlinGraphDatabase.serializer.Tooltip=How requests and results are serialized. GraphBinary works with current servers, GraphSON 2 with older ones.
