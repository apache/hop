AwsSecretsManagerVariableResolver.Region.Label=AWS region
AwsSecretsManagerVariableResolver.Region.Tooltip=The AWS region holding the secrets, for example eu-west-1. Leave empty to use AWS_REGION or the active profile.
AwsSecretsManagerVariableResolver.AuthenticationType.Label=Authentication type
AwsSecretsManagerVariableResolver.AuthenticationType.Tooltip=AUTOMATIC lets the AWS SDK find credentials itself (environment, profile, container or instance role). ACCESS_KEYS and CREDENTIALS_FILE use the options below.
AwsSecretsManagerVariableResolver.AccessKey.Label=Access key
AwsSecretsManagerVariableResolver.AccessKey.Tooltip=The AWS access key ID. Only used with authentication type ACCESS_KEYS.
AwsSecretsManagerVariableResolver.SecretKey.Label=Secret key
AwsSecretsManagerVariableResolver.SecretKey.Tooltip=The AWS secret access key. Only used with authentication type ACCESS_KEYS.
AwsSecretsManagerVariableResolver.SessionToken.Label=Session token
AwsSecretsManagerVariableResolver.SessionToken.Tooltip=The session token for temporary credentials. Optional, only used with authentication type ACCESS_KEYS.
AwsSecretsManagerVariableResolver.CredentialsFile.Label=Credentials file
AwsSecretsManagerVariableResolver.CredentialsFile.Tooltip=Path to an AWS credentials file. Only used with authentication type CREDENTIALS_FILE. Leave empty to use the standard location.
AwsSecretsManagerVariableResolver.ProfileName.Label=Profile name
AwsSecretsManagerVariableResolver.ProfileName.Tooltip=The profile to read from the credentials file. Defaults to "default".
AwsSecretsManagerVariableResolver.EndpointOverride.Label=Endpoint override
AwsSecretsManagerVariableResolver.EndpointOverride.Tooltip=An alternative Secrets Manager endpoint, for example a VPC endpoint or a local test service. Leave empty to use the regional AWS endpoint.
AwsSecretsManagerVariableResolver.SecretNamePrefix.Label=Secret name prefix
AwsSecretsManagerVariableResolver.SecretNamePrefix.Tooltip=Prefix placed in front of every secret name, for example "production/". Lets you keep expressions short.
AwsSecretsManagerVariableResolver.VersionStage.Label=Version stage
AwsSecretsManagerVariableResolver.VersionStage.Tooltip=The staging label to read, AWSCURRENT by default. Use AWSPREVIOUS to read the version from before the last rotation.
AwsSecretsManagerVariableResolver.CacheTtlSeconds.Label=Cache TTL (seconds)
AwsSecretsManagerVariableResolver.CacheTtlSeconds.Tooltip=How long a retrieved secret is reused before it is looked up again. 0 disables caching. Secrets Manager bills per API call, so a small value reduces cost, but rotated secrets take up to this long to be picked up.
