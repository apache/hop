ArrowFlightDataStream.BufferSize.Label=Stream maximum buffer size
ArrowFlightDataStream.BufferSize.Tooltip=The maximum number of rows to buffer, kept on the server, before throwing an error to prevent the server running out of memory.
ArrowFlightDataStream.BatchSize.Label=Batch size
ArrowFlightDataStream.BatchSize.Tooltip=The Apache Arrow batch size for the stream reading from the server.
ArrowFlightDataStream.SchemaDefinition.Label=The schema definition
ArrowFlightDataStream.SchemaDefinition.Tooltip=The expected schema definition for the incoming data streams on the server.
ArrowFlightDataStream.Hostname.Label=Hop Flight hostname
ArrowFlightDataStream.Hostname.Tooltip=The hostname on which we can reach the Hop Apache Arrow Flight server
ArrowFlightDataStream.Port.Label=Hop Flight port
ArrowFlightDataStream.Port.Tooltip=The port on which we can reach the Hop Apache Arrow Flight server
ArrowFlightDataStream.Tls.Label=Use TLS
ArrowFlightDataStream.Tls.Tooltip=Connect to the Hop Apache Arrow Flight server over TLS. The server needs to be started with a certificate and a private key.
ArrowFlightDataStream.VerifyServer.Label=Verify the server certificate
ArrowFlightDataStream.VerifyServer.Tooltip=Verify the certificate the Flight server presents. Only switch this off for testing with a self-signed certificate.
ArrowFlightDataStream.TrustedCertificates.Label=Trusted certificates file
ArrowFlightDataStream.TrustedCertificates.Tooltip=Optional PEM file with the certificate authority to trust when verifying the Flight server certificate. Leave empty to use the JVM trust store.
ArrowFlightDataStream.ClientCertificate.Label=Client certificate file
ArrowFlightDataStream.ClientCertificate.Tooltip=Optional PEM file with the client certificate to present to the Flight server (mutual TLS).
ArrowFlightDataStream.ClientKey.Label=Client private key file
ArrowFlightDataStream.ClientKey.Tooltip=The PEM file with the private key belonging to the client certificate (mutual TLS).
ArrowFlightDataStream.Username.Label=Username
ArrowFlightDataStream.Username.Tooltip=The user name to authenticate with on the Flight server. Leave empty when the server does not require authentication.
ArrowFlightDataStream.Password.Label=Password
ArrowFlightDataStream.Password.Tooltip=The password to authenticate with on the Flight server.
