AirflowWorkflowRunConfiguration.Connection.Label=Airflow connection
AirflowWorkflowRunConfiguration.Connection.Tooltip=The Airflow to run the workflow on
AirflowWorkflowRunConfiguration.BundleFolder.Label=DAG bundle folder
AirflowWorkflowRunConfiguration.BundleFolder.Tooltip=Where to publish the project as a DAG bundle: the folder Airflow reads as a DAG bundle, local or on a VFS location such as 's3://bucket/bundle'. Publishing replaces what an earlier publish left there. Leave empty to write the bundle in the project folder itself.
AirflowWorkflowRunConfiguration.WorkerHopHome.Label=Hop on the workers
AirflowWorkflowRunConfiguration.WorkerHopHome.Tooltip=Where Hop is installed on the Airflow workers. Default: '/opt/hop', as in the Hop container image.
AirflowWorkflowRunConfiguration.WorkerRunConfiguration.Label=Run configuration on the workers
AirflowWorkflowRunConfiguration.WorkerRunConfiguration.Tooltip=The workflow run configuration the workers run the workflow with. Default: 'local'.
AirflowWorkflowRunConfiguration.EnvironmentFiles.Label=Environment files
AirflowWorkflowRunConfiguration.EnvironmentFiles.Tooltip=Configuration files of the project to use on the workers, relative to the project folder and separated by ';', for example 'config/airflow-env.json'
AirflowWorkflowRunConfiguration.DagIdPrefix.Label=DAG id prefix
AirflowWorkflowRunConfiguration.DagIdPrefix.Tooltip=The start of every DAG id. Default: the project name followed by '__'.
AirflowWorkflowRunConfiguration.Tasks.Label=Tasks
AirflowWorkflowRunConfiguration.Tasks.Tooltip=The tasks of the DAGs. One task per action lets Airflow show, retry and clear each action, but every task starts Hop again (a few seconds), and on more than one worker the tasks can run on different machines. One task for the whole workflow starts Hop once and keeps the actions on one worker, so they can pass local files and JVM-scope variables to each other; Airflow then retries the whole workflow. Default: one task per action.
AirflowDagTasks.PER_ACTION=One task per action
AirflowDagTasks.WHOLE_WORKFLOW=One task for the whole workflow
AirflowWorkflowRunConfiguration.UnpausingDag.Label=Unpause a paused DAG?
AirflowWorkflowRunConfiguration.UnpausingDag.Tooltip=Airflow can pause new DAGs. A run of a paused DAG stays queued: unpause the DAG before starting the run, or fail without starting it.
AirflowWorkflowRunConfiguration.DagWaitSeconds.Label=Wait for a new DAG (seconds)
AirflowWorkflowRunConfiguration.DagWaitSeconds.Tooltip=How long to wait for Airflow to show the DAG of a workflow that was not published before. Airflow parses the stub again every 'min_file_process_interval' seconds, and finds a stub in a new bundle folder after 'refresh_interval' seconds. Default: 120.
AirflowWorkflowRunConfiguration.PollSeconds.Label=Check every (seconds)
AirflowWorkflowRunConfiguration.PollSeconds.Tooltip=How often to ask Airflow for the state and the log of the run. Default: 5.

AirflowWorkflowEngine.Error.WrongConfig=The Airflow workflow engine needs an Airflow run configuration
AirflowWorkflowEngine.Error.Unsaved=Save the workflow first: Airflow runs the workflow file as it is in the project
AirflowWorkflowEngine.Error.NoProject=Running a workflow on Airflow needs a project: the DAG bundle is a copy of the project
AirflowWorkflowEngine.Error.OutsideProject=The workflow {0} is not in the project folder {1}, so it is not part of the DAG bundle
AirflowWorkflowEngine.Error.NoConnection=Choose an Airflow connection in the run configuration
AirflowWorkflowEngine.Error.ConnectionNotFound=Airflow connection ''{0}'' does not exist
AirflowWorkflowEngine.Error.DagPaused=DAG {0} is paused and the run configuration does not unpause it: a run would stay queued
AirflowWorkflowEngine.Error.OldDag=Airflow still shows an earlier version of DAG {0} after {1} seconds. Check the DAG processor''s log for errors, or wait longer: Airflow parses a file again every 30 seconds by default (min_file_process_interval).
AirflowWorkflowEngine.Error.TasksUnknown=Airflow still shows DAG {0} with one task per action after {1} seconds. The Hop of the Airflow DAG processor and workers is probably older than 2.21 and ignores Tasks: upgrade Hop there, or set Tasks to ''One task per action''.
AirflowWorkflowEngine.Error.NoDag=Airflow does not show DAG {0} after {1} seconds. Check that Airflow reads the bundle folder as a DAG bundle and look for import errors in Airflow.
AirflowWorkflowEngine.Error.StoppedBeforeStart=Stopped before a run of DAG {0} was started
AirflowWorkflowEngine.Error.Monitor=Error following the DAG run in Airflow
AirflowWorkflowEngine.Log.PollFailed=Could not read the state of the DAG run ({0} time(s) in a row), trying again: {1}
AirflowWorkflowEngine.Error.Stop=Unable to stop run {1} of DAG {0}
AirflowWorkflowEngine.Log.Published=Published project {0} as a DAG bundle in {1}
AirflowWorkflowEngine.Log.WaitingForDag=Waiting up to {1} seconds for Airflow to show DAG {0}
AirflowWorkflowEngine.Log.WaitingForNewDag=Waiting up to {1} seconds for Airflow to read the version of DAG {0} that was just published
AirflowWorkflowEngine.Log.Unpaused=Unpaused DAG {0}
AirflowWorkflowEngine.Log.Started=Started run {1} of DAG {0}: {2}
AirflowWorkflowEngine.Log.Finished=The run of DAG {0} ended: {1}
AirflowWorkflowEngine.Log.Stopped=Asked Airflow to stop run {1} of DAG {0}
