ActionAirflowTriggerDagRun.Name=Trigger Airflow DAG run
ActionAirflowTriggerDagRun.Description=Start a run of an Apache Airflow DAG and wait for it to finish
ActionAirflowTriggerDagRun.Keywords=airflow,dag,trigger,orchestration,schedule
ActionAirflowTriggerDagRun.Group.DagRun=DAG run
ActionAirflowTriggerDagRun.Group.Conf=Run conf
ActionAirflowTriggerDagRun.Group.Wait=Wait
ActionAirflowTriggerDagRun.Group.Result=Result
ActionAirflowTriggerDagRun.Connection.Label=Airflow connection
ActionAirflowTriggerDagRun.Connection.Tooltip=The Airflow connection to use
ActionAirflowTriggerDagRun.DagId.Label=DAG id
ActionAirflowTriggerDagRun.DagId.Tooltip=The id of the DAG to run
ActionAirflowTriggerDagRun.DagRunId.Label=DAG run id
ActionAirflowTriggerDagRun.DagRunId.Tooltip=The id of the new run. Leave empty to let Airflow choose one. It must be unique within the DAG.
ActionAirflowTriggerDagRun.LogicalDate.Label=Logical date
ActionAirflowTriggerDagRun.LogicalDate.Tooltip=An ISO 8601 date and time with a time zone, for example 2026-11-21T10:00:00+01:00. Leave empty for none.
ActionAirflowTriggerDagRun.ConfJson.Label=Run conf (JSON)
ActionAirflowTriggerDagRun.ConfJson.Tooltip=A JSON object the DAG receives as dag_run.conf. Use it for numbers, lists and nested values. Variables like '${MY_VARIABLE}' are resolved first.
ActionAirflowTriggerDagRun.Conf.Tooltip=Keys with text values to add to the run conf. A key here replaces the same key in the JSON.
ActionAirflowTriggerDagRun.Conf.Name.Label=Key
ActionAirflowTriggerDagRun.Conf.Value.Label=Value
ActionAirflowTriggerDagRun.Wait.Label=Wait for the DAG run to finish
ActionAirflowTriggerDagRun.Wait.Tooltip=Wait until the DAG run succeeds or fails. When it fails, this action fails. Without waiting, the action succeeds once Airflow accepts the run.
ActionAirflowTriggerDagRun.PollInterval.Label=Check every (seconds)
ActionAirflowTriggerDagRun.PollInterval.Tooltip=How often to ask Airflow for the state of the run
ActionAirflowTriggerDagRun.Timeout.Label=Timeout (seconds)
ActionAirflowTriggerDagRun.Timeout.Tooltip=Fail when the run has not finished after this many seconds. 0 waits as long as it takes. The run continues in Airflow either way.
ActionAirflowTriggerDagRun.DagRunIdVariable.Label=DAG run id variable
ActionAirflowTriggerDagRun.DagRunIdVariable.Tooltip=The variable that receives the id of the new run
ActionAirflowTriggerDagRun.StateVariable.Label=State variable
ActionAirflowTriggerDagRun.StateVariable.Tooltip=The variable that receives the last known state of the run: queued, running, success or failed
ActionAirflowTriggerDagRun.Log.DagPaused=DAG {0} is paused. The new run stays queued until the DAG is unpaused in Airflow.
ActionAirflowTriggerDagRun.Log.Triggered=Started DAG run {0} of DAG {1}
ActionAirflowTriggerDagRun.Log.State=DAG run {0} is {1}
ActionAirflowTriggerDagRun.Log.Succeeded=DAG run {0} of DAG {1} succeeded
ActionAirflowTriggerDagRun.Log.Stopped=The workflow was stopped. Stopped waiting for DAG run {0}, which continues in Airflow.
ActionAirflowTriggerDagRun.Log.PollFailed=Unable to get the state of DAG run {0} ({1} of {2} checks in a row), trying again at the next check: {3}
ActionAirflowTriggerDagRun.Error.Execute=Unable to run the Airflow DAG
ActionAirflowTriggerDagRun.Error.NoConnection=Choose an Airflow connection
ActionAirflowTriggerDagRun.Error.ConnectionNotFound=Airflow connection {0} does not exist
ActionAirflowTriggerDagRun.Error.NoDagId=Enter the id of the DAG to run
ActionAirflowTriggerDagRun.Error.ConfJson=The run conf is not valid JSON: {0}
ActionAirflowTriggerDagRun.Error.ConfJsonNotObject=The run conf must be a JSON object, for example '{"key": "value"}'
ActionAirflowTriggerDagRun.Error.DagPaused=DAG {0} is paused: a new run would stay queued until someone unpauses the DAG. Unpause it in Airflow, or turn off Wait for the DAG run to finish.
ActionAirflowTriggerDagRun.Error.RunFailed=DAG run {0} of DAG {1} failed. Failed tasks: {2}
ActionAirflowTriggerDagRun.Error.Timeout=Timed out after {0} seconds waiting for DAG run {1} of DAG {2}, which is {3}. The run continues in Airflow.
