AirflowConnection.Name=Airflow Connection
AirflowConnection.Description=The URL and credentials of an Apache Airflow 3 REST API
AirflowConnection.Name.Label=Name
AirflowConnection.Group.Server=Server
AirflowConnection.Group.Authentication=Authentication
AirflowConnection.Description.Label=Description
AirflowConnection.Description.Tooltip=What this connection is for
AirflowConnection.Url.Label=URL
AirflowConnection.Url.Tooltip=The address of the Airflow API server, for example http://localhost:8080. Leave out /api/v2.
AirflowConnection.ConnectTimeout.Label=Connect timeout (seconds)
AirflowConnection.ConnectTimeout.Tooltip=How long to wait for a connection to the Airflow API server
AirflowConnection.RequestTimeout.Label=Request timeout (seconds)
AirflowConnection.RequestTimeout.Tooltip=How long to wait for an answer to a single request
AirflowConnection.AuthenticationType.Label=Authentication
AirflowConnection.AuthenticationType.Tooltip=How to sign in to the Airflow REST API
AirflowConnection.Username.Label=Username
AirflowConnection.Username.Tooltip=The Airflow user. The username and password are exchanged for a token at /auth/token.
AirflowConnection.Password.Label=Password
AirflowConnection.Password.Tooltip=The password of the Airflow user
AirflowConnection.Token.Label=Token
AirflowConnection.Token.Tooltip=A token to send as the bearer token, for example an API token of a managed Airflow service
AirflowConnection.Test.Label=Test connection
AirflowConnection.Test.Tooltip=Sign in and read the list of DAGs
AirflowConnection.Test.Title=Airflow connection
AirflowConnection.Test.Success=Connected to Airflow {0}.
AirflowConnection.Test.Error=Unable to connect to Airflow
AirflowAuthenticationType.NONE=None
AirflowAuthenticationType.USERNAME_PASSWORD=Username and password
AirflowAuthenticationType.TOKEN=Token
AirflowDag.Name=Airflow DAG
AirflowDag.Description=One Apache Airflow DAG of a workflow: its schedule, limits and the parameter values of its runs
AirflowDag.Name.Label=Name
AirflowDag.Group.Dag=DAG
AirflowDag.Group.Schedule=Schedule
AirflowDag.Group.Runs=Runs
AirflowDag.Group.Parameters=Parameters
AirflowDag.Workflow.Label=Workflow
AirflowDag.Workflow.Tooltip=The workflow this DAG runs, in the project: a path that starts with '${PROJECT_HOME}', or one relative to the project. Airflow reads the settings without Hop, so no other variables are resolved here or in the other fields.
AirflowDag.Workflow.Filter.Workflows=Workflows (*.hwf)
AirflowDag.Workflow.Filter.All=All files
AirflowDag.DagId.Label=DAG id
AirflowDag.DagId.Tooltip=The DAG id after the DAG id prefix of the bundle. Leave it empty to keep the DAG id the workflow has without this object: the prefix and the path of the workflow. A second DAG of the same workflow needs its own DAG id.
AirflowDag.DisplayName.Label=Display name
AirflowDag.DisplayName.Tooltip=The name Airflow shows instead of the DAG id. Leave it empty to show the DAG id.
AirflowDag.Tags.Label=Tags
AirflowDag.Tags.Tooltip=Tags for the DAG, separated by commas. The DAG also gets the tags hop and the project name.
AirflowDag.Tasks.Label=Tasks
AirflowDag.Tasks.Tooltip=One task per action, or one task for the whole workflow. This setting replaces the Tasks of the bundle or the run configuration for this DAG.
AirflowDag.Documentation.Label=Documentation
AirflowDag.Documentation.Tooltip=Markdown that Airflow shows with the DAG, above the name and version of the workflow
AirflowDag.Schedule.Label=Schedule
AirflowDag.Schedule.Tooltip=A cron expression, such as 0 6 * * *, or an Airflow preset, such as @daily. Airflow runs it in UTC. Leave it empty to start the DAG only from Airflow, its REST API or Hop.
AirflowDag.StartDate.Label=Start date (UTC)
AirflowDag.StartDate.Tooltip=The first date the schedule runs for, in UTC: 2026-01-31, or 2026-01-31 06:00
AirflowDag.EndDate.Label=End date (UTC)
AirflowDag.EndDate.Tooltip=The last date the schedule runs for, in UTC. Leave it empty to keep running.
AirflowDag.Catchup.Label=Catch up
AirflowDag.Catchup.Tooltip=Yes: after a pause, or with a start date in the past, Airflow runs every missed interval. No: only the latest one.
AirflowDag.PausedOnCreation.Label=Paused when created
AirflowDag.PausedOnCreation.Tooltip=Whether a new DAG starts paused, so that its schedule does not run until you unpause it
AirflowDag.MaxActiveRuns.Label=Max active runs
AirflowDag.MaxActiveRuns.Tooltip=How many runs of this DAG can run at the same time. Leave it empty for the Airflow default.
AirflowDag.MaxActiveTasks.Label=Max active tasks
AirflowDag.MaxActiveTasks.Tooltip=How many tasks of this DAG can run at the same time, over all its runs. Leave it empty for the Airflow default.
AirflowDag.RunTimeoutSeconds.Label=Run timeout (seconds)
AirflowDag.RunTimeoutSeconds.Tooltip=Airflow fails a run that takes longer. Leave it empty for no timeout.
AirflowDag.MaxConsecutiveFailedRuns.Label=Max consecutive failed runs
AirflowDag.MaxConsecutiveFailedRuns.Tooltip=Airflow pauses the DAG after this many failed runs in a row. Leave it empty, or 0, for the Airflow default.
AirflowDag.FailFast.Label=Fail fast
AirflowDag.FailFast.Tooltip=When a task fails, Airflow stops the other running tasks of the run. Only for a workflow without failure hops or joins, or one that runs as one task.
AirflowDag.Parameters.Label=Parameters
AirflowDag.Parameters.Tooltip=The parameter values every run of this DAG gets. A key in the conf of a run wins.
AirflowDag.Parameters.Name.Label=Parameter
AirflowDag.Parameters.Name.Tooltip=The name of a parameter of the workflow, or of a variable
AirflowDag.Parameters.Value.Label=Value
AirflowDag.Parameters.Value.Tooltip=The value, as text
AirflowDagSwitch.AIRFLOW_DEFAULT=Airflow default
AirflowDagSwitch.YES=Yes
AirflowDagSwitch.NO=No
