GitConnectionEditor.Name.Label=Name

GitConnection.Name=Git repository
GitConnection.Description=Read the files of a git repository, checked out at a branch or a revision, as if they were an ordinary folder. The name of the connection is the scheme which serves them.

GitConnection.Description.Label=Description
GitConnection.Description.Tooltip=What this connection is for. Optional.

GitConnection.RepositoryUrl.Label=Repository URL
GitConnection.RepositoryUrl.Tooltip=The repository to fetch: an HTTPS or SSH URL, a git:// URL, or a path on the disk of this machine. For example 'https://github.com/apache/hop.git' or 'git@github.com:apache/hop.git'.

GitConnection.Revision.Label=Branch, tag or commit
GitConnection.Revision.Tooltip=Which version of the repository to read, for example 'main', 'v2.20.0' or a full commit id. Leave empty for whatever the remote calls its default branch. A commit id is the only choice which cannot change under you, so it is what a deployment should point at.

GitConnection.BasePath.Label=Base path
GitConnection.BasePath.Tooltip=A folder inside the repository to serve as the root. With a base path of 'workflows', the connection 'ops' serves 'ops:///daily.hwf' for a repository file 'workflows/daily.hwf'. Leave empty for the root of the repository.

GitConnection.Test.Label=Test connection
GitConnection.Test.Tooltip=Ask the repository which branches and tags it has, using the values currently in this dialog. This does not check the revision out.
GitConnection.Test.Title=Git connection
GitConnection.Test.Error.Message=Could not reach the repository.

GitConnection.AuthType.Label=Authentication
GitConnection.AuthType.Tooltip=How this connection proves who it is to the server. None is a public repository. User name and password is an HTTPS clone, where the password is often a personal access token. SSH deploy key is a private key which belongs to this one repository.

GitConnection.UserName.Label=User name
GitConnection.UserName.Tooltip=The user to log in as. A personal access token often goes in the password field instead of a real password.

GitConnection.Password.Label=Password
GitConnection.Password.Tooltip=The password, or the personal access token of a server which takes one in its place. Leave empty for a public repository.

GitConnection.PrivateKey.Label=Deploy key
GitConnection.PrivateKey.Tooltip=The private key of a deploy key, in the OpenSSH or PKCS#8 format git reads. A deploy key is a key which belongs to this one repository, which is what a container should be given rather than a personal key.

GitConnection.Passphrase.Label=Key passphrase
GitConnection.Passphrase.Tooltip=The passphrase of the deploy key. Leave empty when the key has none.

GitConnection.SshUser.Label=SSH user
GitConnection.SshUser.Tooltip=The user to log in as over SSH. Leave empty to take it from the repository URL. A deploy key is normally used as 'git'.

GitConnection.KnownHosts.Label=Known hosts
GitConnection.KnownHosts.Tooltip=A known_hosts file to trust. Leave empty to use '~/.ssh/known_hosts'. A host which is in neither is refused, unless 'Accept unknown host keys' is on.

GitConnection.AcceptUnknownHosts.Label=Accept unknown host keys
GitConnection.AcceptUnknownHosts.Tooltip=Connect even when the server's host key is not in the known hosts file. A fresh container has no known_hosts, so this is what makes an SSH clone work there. Leave it off when the host key can be supplied.

GitConnection.CacheFolder.Label=Checkout folder
GitConnection.CacheFolder.Tooltip=Where to keep the working copy this connection reads from. A git repository has to be checked out before its files can be read, and this is where that happens. Leave empty to use a folder under the system temporary directory, which is right for a container and wrong for a long running server.

GitConnection.AlwaysFetch.Label=Fetch on every use
GitConnection.AlwaysFetch.Tooltip=Fetch the revision again on the first use of every run, rather than reusing the checkout of an earlier one. Leave this off for a deployment: the revision is fixed, so a checkout which is already there is the same one the fetch would produce. Turn it on while developing against a branch which moves.

GitConnection.CacheMinutes.Label=Maximum checkout age (minutes)
GitConnection.CacheMinutes.Tooltip=Fetch the revision again once a checkout is older than this. Only applies when 'Fetch on every use' is off. Leave empty to never fetch on the strength of age alone.

GitConnection.ReadOnly.Label=Read only
GitConnection.ReadOnly.Tooltip=Refuse to write to the working copy. A write only changes the checkout on disk: nothing commits it and nothing pushes it, so a connection which lets you write is useful for building something in the checkout rather than for updating the repository.

GitConnection.Timeout.Label=Timeout (seconds)
GitConnection.Timeout.Tooltip=How long to wait for the remote to answer, in seconds. Leave empty for the JGit default.
