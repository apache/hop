LoggingStorageRetryStrategy.Timeout=No response in time ({0}), trying again. The connection timeout is {1} seconds, the read timeout {2} seconds.
LoggingStorageRetryStrategy.Timeout.Object=No response in time while accessing {0} ({1}), trying again. The connection timeout is {2} seconds, the read timeout {3} seconds.
LoggingStorageRetryStrategy.TemporaryError=Temporary error, trying again: {0}
LoggingStorageRetryStrategy.TemporaryError.Object=Temporary error while accessing {0}, trying again: {1}
GoogleStorageStallWatchdog.Stalled.Reading=No progress reading {0} for {1} seconds ({2} bytes read so far), still waiting.
GoogleStorageStallWatchdog.Stalled.Writing=Writing {0} has not finished an upload chunk for {1} seconds ({2} bytes written so far): the connection is slow or stalled.
GoogleStorageStallWatchdog.Resumed.Reading=Reading {0} resumed after {1} seconds without progress.
GoogleStorageStallWatchdog.Resumed.Writing=Writing {0} finished the upload chunk after {1} seconds.
GoogleStorageStallWatchdog.Aborted.Reading=No progress reading {0} for {1} seconds, giving up: that is as long as the Google Cloud retry settings allow for one read.
