GoogleCloudPlugin.AccountKeyFile.Description=The path to a Google Cloud service account JSON key file
GoogleCloudPlugin.AccountKeyFile.Label=Account key file
GoogleCloudPlugin.GuiPlugin.Description=Google Cloud
GoogleCloudPlugin.MaxAttempts.Label=Max number of attempts
GoogleCloudPlugin.MaxAttempts.Description=Maximum number of attempts for a single request, including the first one
GoogleCloudPlugin.InitialRetryDelay.Label=Initial retry delay (seconds)
GoogleCloudPlugin.InitialRetryDelay.Description=Delay before the first retry, in seconds
GoogleCloudPlugin.RetryDelayMultiplier.Label=Retry delay multiplier
GoogleCloudPlugin.RetryDelayMultiplier.Description=Retry delay multiplier
GoogleCloudPlugin.MaxRetryDelay.Label=Maximum retry delay (seconds)
GoogleCloudPlugin.MaxRetryDelay.Description=Ceiling for the retry delay once the multiplier has been applied, in seconds
GoogleCloudPlugin.TotalTimeout.Label=Total timeout (minutes)
GoogleCloudPlugin.TotalTimeout.Description=Deadline for a request including all of its retries, in minutes
GoogleCloudPlugin.InitialRpcTimeout.Label=Initial RPC timeout (seconds)
GoogleCloudPlugin.InitialRpcTimeout.Description=Timeout for the first attempt, in seconds. Raised to the max RPC timeout if that is lower.
GoogleCloudPlugin.RpcTimeoutMultiplier.Label=RPC Timeout Multiplier
GoogleCloudPlugin.RpcTimeoutMultiplier.Description=RPC Timeout Multiplier
GoogleCloudPlugin.MaxRpcTimeout.Label=Max RPC timeout (seconds)
GoogleCloudPlugin.MaxRpcTimeout.Description=Ceiling for a single attempt timeout, in seconds. Never lower than the initial RPC timeout.
GoogleCloudPlugin.ConnectTimeout.Label=Connect timeout (seconds)
GoogleCloudPlugin.ConnectTimeout.Description=Socket connect timeout, in seconds
GoogleCloudPlugin.ReadTimeout.Label=Read timeout (seconds)
GoogleCloudPlugin.ReadTimeout.Description=Socket read timeout, in seconds
GoogleCloudPlugin.RetryNonIdempotentOperations.Label=Retry non-idempotent operations
GoogleCloudPlugin.RetryNonIdempotentOperations.Description=Also retry writes (create, delete, starting an upload). Google Cloud Storage only retries reads by default, so without this the retry settings above do not apply to writing files. Note that a retried delete can report "not found" when the first attempt already succeeded, and a retried create overwrites.
GoogleCloudPlugin.CacheTtlSeconds.Label=Cache TTL (seconds)
GoogleCloudPlugin.CacheTtlSeconds.Description=How long to cache folder listing results (in seconds, default 5). If not set, falls back to 10 seconds.
GoogleCloudPlugin.ScanFolderForLastModificationDate.Label=Scan folders to find last modified data
GoogleCloudPlugin.ScanFolderForLastModificationDate.Description=Scans all files in a folder and uses the most recent modification data as the folder modification data. This may have a performance impact in buckets with lots of files.