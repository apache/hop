GoogleCloudPlugin.ScanFolderForLastModificationDate.Description=Ler todos os arquivos em um diretório e utilizar a data mais recente de modificação como data de modificação do diretório. Isso pode sofrer impacto de performance em buckets com muitos arquivos.
