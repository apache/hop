GoogleCloudPlugin.RetryNonIdempotentOperations.Label=Tente novamente operações não-idepotentes.
GoogleCloudPlugin.RetryNonIdempotentOperations.Description=Também tente escrever novamente (criar, deletar, iniciar uma subida). O Google Cloud Storage só repete as leituras por padrão, então sem isso as configurações de repetição acima não se aplicam à escrita de arquivos. Note que uma deleção repetida pode relatar "não encontrado" quando a primeira tentativa já foi bem sucedida, e uma repetição pode criar sobrescritos.
