ParquetOutputMeta.FilenameIncludeDate.Tooltip=Add the pipeline start date to the file name with mask yyyyMMdd
ParquetOutputMeta.FilenameIncludeTime.Tooltip=Add the pipeline start time to the file name with mask HHmmss
