ParquetOutputMeta.FilenameIncludeCopyNr.Tooltip=Add the transform copy number so parallel copies do not write the same file
ParquetOutputMeta.FilenameIncludeSplitNr.Tooltip=Split the output into multiple files and include the part number in the file name
ParquetOutputMeta.FilenameSplitSize.Tooltip=Number of rows written to each split file. Suffixes such as 1m or 1e6 are accepted. The split size does not limit memory use, the row group size does
ParquetOutputMeta.FilenameCreateFolders.Tooltip=Create missing parent folders of the output path
ParquetOutputMeta.FilenameCompressionBeforeExtension.Tooltip=Place the compression codec before the file extension (file.snappy.parquet). When disabled the codec is appended after the extension (file.parquet.snappy)
ParquetOutputMeta.CompressionCodec.Tooltip=Parquet page compression codec
ParquetOutputMeta.Version.Tooltip=Parquet file format version
ParquetOutputMeta.RowGroupSize.Tooltip=Size of a Parquet row group in bytes (not rows), the unit of work for a reader. Suffixes such as 256m (256,000,000) are accepted. Every row group adds an entry per column to the file footer, so small row groups produce large footers that some readers reject. Default 268435456 (256 MB), Parquet itself defaults to 128 MB
ParquetOutputMeta.DataPageSize.Tooltip=Size of a data page in bytes, the unit of encoding and compression inside a column. Default 8192, Parquet itself defaults to 1048576 (1 MB)
ParquetOutputMeta.DictionaryPageSize.Tooltip=Maximum size of a dictionary page in bytes. When the dictionary of a column grows past this size the writer falls back to plain encoding for that column chunk. Default 1048576 (1 MB)
