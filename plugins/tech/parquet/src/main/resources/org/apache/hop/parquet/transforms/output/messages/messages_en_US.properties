ParquetOutput.Log.SmallRowGroupSize=The row group size of {0} bytes is very small: Parquet buffers rows until a row group is full and every row group adds an entry per column to the file footer, so this setting produces many row groups and a large footer that some readers reject. Consider a row group size of at least a few megabytes (Parquet defaults to {1} bytes)
