SmbConnection.Name = SMB Connection
SmbConnection.Description = Read and write an SMB2 or SMB3 file share without mounting it
SmbConnection.Name.Label = Name
Smb.Description.Label = Description
Smb.Description.Tooltip = Optional description of this connection
Smb.Hostname.Label = Hostname
Smb.Hostname.Tooltip = Server hostname. Example: fileserver.example.com or '${SMB_HOST}'. Azure Files uses account.file.core.windows.net.
Smb.Port.Label = Port
Smb.Port.Tooltip = TCP port. Default 445. Example: '${SMB_PORT}'
Smb.Share.Label = Share
Smb.Share.Tooltip = Share name on the server, without a leading slash. Example: data or '${SMB_SHARE}'
Smb.BasePath.Label = Folder in the share
Smb.BasePath.Tooltip = Optional folder inside the share. Paths on this connection stay under that folder. Empty is the share root. Example: '${SMB_FOLDER}'
Smb.Test.Label = Test connection
Smb.Test.Tooltip = Sign in and list the share root
Smb.Test.Title = SMB connection
Smb.Test.Error = Could not open the SMB share
Smb.AuthType.Label = Authentication
Smb.AuthType.Tooltip = NTLM is a username and password (NTLMv2). GUEST ignores the username and password. Current Windows has guest access off by default. Kerberos is not available yet.
Smb.Domain.Label = Domain
Smb.Domain.Tooltip = NetBIOS domain for an Active Directory account. Leave empty for a local account. A username of DOMAIN\\user is split when this is empty. user@dns.domain is not parsed. Example: '${SMB_DOMAIN}'
Smb.Username.Label = Username
Smb.Username.Tooltip = Account name. For Active Directory use the sAMAccountName, or DOMAIN\\user. Example: '${SMB_USER}'
Smb.Password.Label = Password
Smb.Password.Tooltip = Password for the account. Example: '${SMB_PASSWORD}'
Smb.Dialect.Label = Minimum SMB version
Smb.Dialect.Tooltip = Lowest dialect to offer. SMB 2.0.2 reaches current Windows and Samba. SMB 3.0 or SMB 3.1.1 refuses older servers. SMB1 is never offered.
Smb.RequireSigning.Label = Require SMB signing
Smb.RequireSigning.Tooltip = Refuse a server that does not sign. Leave off to still sign when the server requires it, which is the usual Windows policy.
Smb.Encrypt.Label = Encrypt session
Smb.Encrypt.Tooltip = Require SMB3 encryption. Turn this on when the share rejects unencrypted sessions.
Smb.Dfs.Label = Follow DFS referrals
Smb.Dfs.Tooltip = Let the client follow Distributed File System referrals. Leave off unless the share is a DFS root.
Smb.CallTimeout.Label = Call timeout (seconds)
Smb.CallTimeout.Tooltip = Read, write, and transact timeout. Default 60. Example: '${SMB_TIMEOUT}'
Smb.SocketTimeout.Label = Socket timeout (seconds)
Smb.SocketTimeout.Tooltip = How long the background reader waits for the next packet. 0 waits until the server sends one or drops the connection. Leave this at 0. A positive value closes a quiet session. Example: '${SMB_SOCKET_TIMEOUT}'
