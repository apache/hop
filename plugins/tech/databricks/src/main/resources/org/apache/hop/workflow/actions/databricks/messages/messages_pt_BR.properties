ActionDatabricksJobRun.UploadProjectPackage.Tooltip=Exportar e carregar um pacote de projeto Native Spark (mesma disposição como Tools \u2192 Exportar pacote de projeto para Native Spark) assim aninhado simples Mapeamento / Pipeline Arquivos executores sob resolução PROJECT HOME no cluster. Usa MainSpark --HopProjectPackage.
ActionDatabricksJobRun.ProjectHome.Label=Projeto casa (exportação)
ActionDatabricksJobRun.ProjectHome.Tooltip=Diretório do projeto usado para exportar um pacote. Deixe vazio para usar PROJECT HOME. Ignorado quando o pacote do Projeto está definido.
ActionDatabricksJobRun.ProjectPackageFile.Label=Arquivo do pacote do projeto (opcional)
ActionDatabricksJobRun.ProjectPackageFile.Tooltip=Opcional hop-spark pacote de projeto zip. Quando o pacote do projeto em branco e Upload Spark é verificado, as exportações de Hop do projeto home / PROJECT HOME no momento da implantação.
ActionDatabricksJobRun.EnvironmentConfigFile.Label=Arquivo de configuração do ambiente (opcional)
ActionDatabricksJobRun.EnvironmentConfigFile.Tooltip=Opcionalmente descrito-variáveis JSON carregado como env-config.json e passado para MainSpark como --HopConfigFile (mesmo como MainSpark 4o argumento / formulário nomeado).
ActionDatabricksJobRun.ClusterId.Label=Agrupamento/computação
ActionDatabricksJobRun.ClusterId.Tooltip=Implantar e executar computação (escolha um): (1) Clássico cluster existente - colar o ID de cluster de todos os propósitos da área de trabalho. (2) Clássico conjunto de trabalhos — insira o valor literal new cluster e definir centelha versão / nó type id / num workers abaixo (ou opcional new cluster JSON); Databricks inicia um cluster para a execução e termina-lo depois. (3) Sem servidor - insira o valor literal sem servidor; nenhum campo de cluster é enviado; usa environment key + cliente abaixo e java dependências para o jar.
ActionDatabricksJobRun.NewClusterSparkVersion.Label=Tradução e Sincronia:
ActionDatabricksJobRun.NewClusterSparkVersion.Tooltip=Databricks Runtime centelha versão para um cluster de trabalho clássico, por exemplo 18.2.x-scala2.13. Usado quando Cluster / Computação é novo cluster.
ActionDatabricksJobRun.NewClusterNodeType.Label=New cluster nó tipo id
ActionDatabricksJobRun.NewClusterNodeType.Tooltip=Tipo de nó em nuvem para um clássico grupo de trabalho. No AWS prefere i3.xlarge (NVMe local, sem EBS extra). M5.xlarge requer volumes de EBS. Exemplo Azure: Standard DS3 v2. Usado quando Cluster / Computação é novo cluster.
ActionDatabricksJobRun.NewClusterNumWorkers.Label=New cluster num workers
ActionDatabricksJobRun.NewClusterNumWorkers.Tooltip=O trabalhador conta para um clássico grupo de trabalho. Usado quando Cluster / Computação é novo cluster.
ActionDatabricksJobRun.NewClusterJson.Label=New cluster JSON (opcional)
ActionDatabricksJobRun.NewClusterJson.Tooltip=Opcional novo objeto JSON. Quando set e Cluster/computação é new cluster, sobrepõe centelha versão/nodo tipo id/número trabalhadores.
ActionDatabricksJobRun.EnvironmentKey.Label=Chave do ambiente sem servidor
ActionDatabricksJobRun.EnvironmentKey.Tooltip=Chave de ambiente de trabalho para computação sem servidor (padrão: padrão). Usado quando Cluster / Computação não tem servidor. A tarefa faz referência a isso através do environment key; nenhum existente cluster id ou new cluster é enviado.
ActionDatabricksJobRun.EnvironmentClient.Label=Cliente de ambiente sem servidor
ActionDatabricksJobRun.EnvironmentClient.Tooltip=Versão de cliente sem servidor, por exemplo, 4 para Spark 4.x. Usado quando Cluster / Computação não tem servidor.
