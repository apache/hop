CalciteSqlFormatConfigPlugin.Name=Apache Calcite SQL formatter
CalciteSqlFormatConfigPlugin.Group.Layout=Layout
CalciteSqlFormatConfigPlugin.Group.Keywords=Keywords and identifiers
CalciteSqlFormatConfigPlugin.Indentation.Label=Indentation (spaces)
CalciteSqlFormatConfigPlugin.Indentation.Tooltip=Number of spaces to indent nested SQL. Calcite default is 4; Hop default is 2.
CalciteSqlFormatConfigPlugin.LineLength.Label=Line length
CalciteSqlFormatConfigPlugin.LineLength.Tooltip=Preferred maximum line length. 0 means no maximum.
CalciteSqlFormatConfigPlugin.ClauseStartsLine.Label=Clause starts a new line
CalciteSqlFormatConfigPlugin.ClauseStartsLine.Tooltip=Start FROM, WHERE, GROUP BY, HAVING, WINDOW and ORDER BY on a new line.
CalciteSqlFormatConfigPlugin.AlwaysUseParentheses.Label=Always use parentheses
CalciteSqlFormatConfigPlugin.AlwaysUseParentheses.Tooltip=Wrap every expression in parentheses even when operator precedence does not require it.
CalciteSqlFormatConfigPlugin.SelectListItemsOnSeparateLines.Label=SELECT list items on separate lines
CalciteSqlFormatConfigPlugin.SelectListItemsOnSeparateLines.Tooltip=Put each item in the SELECT list on its own line.
CalciteSqlFormatConfigPlugin.WhereListItemsOnSeparateLines.Label=WHERE items on separate lines
CalciteSqlFormatConfigPlugin.WhereListItemsOnSeparateLines.Tooltip=Put each item in the WHERE list on its own line.
CalciteSqlFormatConfigPlugin.CaseClausesOnNewLines.Label=CASE clauses on new lines
CalciteSqlFormatConfigPlugin.CaseClausesOnNewLines.Tooltip=Put WHEN, THEN and ELSE of a CASE expression at the start of a new line.
CalciteSqlFormatConfigPlugin.WindowDeclarationStartsLine.Label=WINDOW declaration starts a new line
CalciteSqlFormatConfigPlugin.WindowDeclarationStartsLine.Tooltip=Start a WINDOW declaration on a new line.
CalciteSqlFormatConfigPlugin.WindowListItemsOnSeparateLines.Label=WINDOW list items on separate lines
CalciteSqlFormatConfigPlugin.WindowListItemsOnSeparateLines.Tooltip=Put each item in a WINDOW list on its own line.
CalciteSqlFormatConfigPlugin.KeywordsLowercase.Label=Keywords in lower case
CalciteSqlFormatConfigPlugin.KeywordsLowercase.Tooltip=Print SQL keywords such as SELECT and FROM in lower case.
CalciteSqlFormatConfigPlugin.QuoteAllIdentifiers.Label=Quote all identifiers
CalciteSqlFormatConfigPlugin.QuoteAllIdentifiers.Tooltip=Quote every identifier even when the dialect would accept it unquoted.
CalciteSqlFormatConfigPlugin.Save.Error.Title=Error
CalciteSqlFormatConfigPlugin.Save.Error.Message=Error saving Apache Calcite SQL formatter options
