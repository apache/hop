OpenLineageSinkConfiguration.Group.Collector=Collector
OpenLineageSinkConfiguration.Group.Lineage=Lineage
OpenLineageSinkConfiguration.Group.Delivery=Delivery
OpenLineageSinkConfiguration.Url.Label=Collector URL
OpenLineageSinkConfiguration.Url.Tooltip=The URL events are posted to, for example http://marquez:5000/api/v1/lineage. Required.
OpenLineageSinkConfiguration.ApiKey.Label=API key
OpenLineageSinkConfiguration.ApiKey.Tooltip=Sent as a bearer token, when the collector needs one.
OpenLineageSinkConfiguration.Namespace.Label=Namespace
OpenLineageSinkConfiguration.Namespace.Tooltip=The OpenLineage namespace of Hop''s pipelines and workflows. Empty is ''hop''.
OpenLineageSinkConfiguration.Producer.Label=Producer
OpenLineageSinkConfiguration.Producer.Tooltip=The producer URI the events carry. Empty is the Apache Hop OpenLineage plugin.
OpenLineageSinkConfiguration.TransformJobs.Label=A job per transform
OpenLineageSinkConfiguration.TransformJobs.Tooltip=Report each transform as a job of its own, with the datasets it read and wrote, instead of putting every dataset on the pipeline''s job.
OpenLineageSinkConfiguration.ParentRuns.Label=Parent run facets
OpenLineageSinkConfiguration.ParentRuns.Tooltip=Name the run that started a run (the pipeline of a transform, the workflow of an action) in a parent facet.
OpenLineageSinkConfiguration.FileSpecNaming.Label=Name files by the OpenLineage spec
OpenLineageSinkConfiguration.FileSpecNaming.Tooltip=Name a file dataset by its scheme and location, and its path, as the OpenLineage naming spec does. Cleared, files keep the names of Hop 2.20 and earlier.
OpenLineageSinkConfiguration.SqlParse.Label=Parse SQL
OpenLineageSinkConfiguration.SqlParse.Tooltip=Parse the SQL of Table input and Execute SQL script to find the tables they read and write.
OpenLineageSinkConfiguration.SpoolDirectory.Label=Spool folder
OpenLineageSinkConfiguration.SpoolDirectory.Tooltip=A folder where events wait until the collector accepted them, so an outage or a restart delays lineage instead of losing it. Use a folder per sink and per Hop process. Empty keeps events in memory only.
OpenLineageSinkConfiguration.SpoolMaxBytes.Label=Spool size (bytes)
OpenLineageSinkConfiguration.SpoolMaxBytes.Tooltip=The most the spool folder holds. Empty is 64 MB.
OpenLineageSinkConfiguration.BufferSize.Label=Queue size (events)
OpenLineageSinkConfiguration.BufferSize.Tooltip=How many events wait for delivery in memory. Empty is 10000.
OpenLineageSinkConfiguration.Overflow.Label=When the queue is full
OpenLineageSinkConfiguration.Overflow.Tooltip=Drop the event, or wait for room up to the enqueue timeout and drop it then.
OpenLineageSinkConfiguration.Overflow.Drop=Drop the event
OpenLineageSinkConfiguration.Overflow.Block=Wait for room
OpenLineageSinkConfiguration.EnqueueTimeout.Label=Enqueue timeout (ms)
OpenLineageSinkConfiguration.EnqueueTimeout.Tooltip=How long an event waits for room in a full queue before it is dropped.
OpenLineageSinkConfiguration.MaxRetries.Label=Retries
OpenLineageSinkConfiguration.MaxRetries.Tooltip=How many times a failed delivery is retried. Empty is 3.
OpenLineageSinkConfiguration.RetryBackoff.Label=Retry backoff (ms)
OpenLineageSinkConfiguration.RetryBackoff.Tooltip=The wait before the first retry; it doubles with each next one. Empty is 500.
OpenLineageSinkConfiguration.ConnectTimeout.Label=Connect timeout (ms)
OpenLineageSinkConfiguration.ConnectTimeout.Tooltip=Empty is 5000.
OpenLineageSinkConfiguration.ReadTimeout.Label=Read timeout (ms)
OpenLineageSinkConfiguration.ReadTimeout.Tooltip=Empty is 30000.
OpenLineageSinkConfiguration.ShutdownDrain.Label=Shutdown wait (ms)
OpenLineageSinkConfiguration.ShutdownDrain.Tooltip=How long Hop waits, when it stops, for the events still waiting to be delivered. Empty is 30000.
OpenLineageSinkConfiguration.MetricsInterval.Label=Metrics log interval (ms)
OpenLineageSinkConfiguration.MetricsInterval.Tooltip=How often the sink logs how many events it sent, dropped and spooled. Empty or 0 is never.
OpenLineageSinkConfiguration.TrustStorePath.Label=Trust store
OpenLineageSinkConfiguration.TrustStorePath.Tooltip=A trust store with the certificate of the collector, when the JVM''s own doesn''t have it.
OpenLineageSinkConfiguration.TrustStorePassword.Label=Trust store password
OpenLineageSinkConfiguration.TrustStorePassword.Tooltip=The password of the trust store.
OpenLineageSinkConfiguration.KeyStoreType.Label=Trust store type
OpenLineageSinkConfiguration.KeyStoreType.Tooltip=Empty is PKCS12.
