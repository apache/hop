MongoDbOutput.Description=grava todas as linhas em uma coleção MongoDB no banco de dados especificado.
MongoDbOutput.Injection.AUTH_DATABASE=Especifique o banco de dados de autenticação MongoDB.
MongoDbOutput.Injection.AUTH_KERBEROS=Esta opção indica se a autenticação Kerberos deve ser usada.
MongoDbOutput.Injection.AUTH_MECHANISM=Especifique o mecanismo de autenticação MongoDB (SCRAM-SHA-1 ou MONGODB-CR).
MongoDbOutput.Injection.AUTH_PASSWORD=senha necessária para acessar a base de dados.
MongoDbOutput.Injection.AUTH_USERNAME=nome de usuário necessário para acessar a base de dados.
MongoDbOutput.Injection.BATCH_INSERT_SIZE=Especifique o tamanho do lote que deseja usar. Se nenhum valor for fornecido, o tamanho padrão será 100 linhas.
MongoDbOutput.Injection.COLLECTION=O nome da coleção da qual recuperar dados.
MongoDbOutput.Injection.DATABASE_NAME=O nome do banco de dados do qual recuperar dados.
MongoDbOutput.Injection.DROP=Este campo indicará se os campos de índice devem ser criados ou eliminados.
MongoDbOutput.Injection.FIELDS=Os campos de saída.
MongoDbOutput.Injection.HOSTNAME=O nome do host MongoDB.
MongoDbOutput.Injection.INCOMING_AS_MONGO=Este campo indica o uso do nome do campo como o nome da chave do campo mongo.
MongoDbOutput.Injection.INCOMING_FIELD_NAME=Este campo exibe o nome do campo baseado no valor do campo de caminho.
MongoDbOutput.Injection.INDEX_FIELD=A lista de campos de índice.
MongoDbOutput.Injection.INDEXES=A lista de índices a serem criados ou descartados.
MongoDbOutput.Injection.INSERT_NULL=Este campo indicará se devem ser inseridos ou ignorados valores nulos.
MongoDbOutput.Injection.JSON=Este campo indica se o campo recebido está no formato JSON.
MongoDbOutput.Injection.MODIFIER_OPERATION=Especifique uma operação modificadora ($set, $inc, $push) para modificações no local de campos existentes.
MongoDbOutput.Injection.MODIFIER_POLICY=Este campo permite definir a política modificadora (Inserir e atualizar, Inserir, Atualizar) que está afetando o campo especificado durante a execução.
MongoDbOutput.Injection.MODIFIER_UPDATE=Esta opção permite que modificadores sejam usados para alterar campos individuais em documentos correspondentes.
MongoDbOutput.Injection.MONGO_DOCUMENT_PATH=Este campo indica o caminho do campo.
MongoDbOutput.Injection.MULTI=Especifique esta opção para indicar se todos os registros correspondentes serão atualizados durante um upsert em vez de apenas o primeiro.
MongoDbOutput.Injection.PORT=O número da porta do MongoDB.
MongoDbOutput.Injection.READ_PREFERENCE=Especifique a preferência de leitura do MongoDB (primário, primárioPreferido, secundário, secundárioPreferido, mais próximo).
MongoDbOutput.Injection.RETRY_DELAY=Especifique a duração (em segundos) entre novas tentativas.
MongoDbOutput.Injection.RETRY_NUMBER=Especifique o número de tentativas para as operações de escrita.
MongoDbOutput.Injection.SPARSE=Este campo indica se o índice deve conter apenas entradas para os documentos que possuem um valor no campo indexado.
MongoDbOutput.Injection.TAG_SET=Tag opcional definida para uso com preferências de leitura.
MongoDbOutput.Injection.TIMEOUT_CONNECTION=Especifique o tempo (em milissegundos) de espera para conectar-se a um banco de dados antes de atingir o tempo limite.
MongoDbOutput.Injection.TIMEOUT_SOCKET=Especifique o tempo (em milissegundos) antes do tempo limite durante uma operação de gravação.
MongoDbOutput.Injection.TRUNCATE=Esta opção excluirá os dados existentes na coleção de destino antes do início da inserção.
MongoDbOutput.Injection.UNIQUE=Este campo indica se o índice será criado como um índice exclusivo. Um índice exclusivo é aquele em que os campos não duplicam valores.
MongoDbOutput.Injection.UPDATE=Especifique esta opção para realizar uma atualização nos dados existentes, caso contrário eles serão inseridos.
MongoDbOutput.Injection.UPDATE_MATCH_FIELD=Este campo indica se o campo de entrada é usado na consulta para a operação de atualização.
MongoDbOutput.Injection.UPSERT=Especifique esta opção para criar um novo documento se nenhum registro corresponder aos critérios de consulta.
MongoDbOutput.Injection.USE_ALL_REPLICA_SET_MEMBERS=Esta opção indica se os servidores de réplica do Mongo devem ser usados.
MongoDbOutput.Injection.USE_SSL_SOCKET_FACTORY=Especifique um booleano indicando se conexões SSL devem ser usadas.
