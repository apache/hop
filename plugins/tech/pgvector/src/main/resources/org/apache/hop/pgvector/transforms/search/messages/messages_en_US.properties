PgVectorSearch.resultIdField.Label=Result ID field
PgVectorSearch.resultIdField.Tooltip=Output field for the matched row ID
PgVectorSearch.resultDocumentIdField.Label=Result document ID field
PgVectorSearch.resultDocumentIdField.Tooltip=Output field for the matched document ID
PgVectorSearch.resultChunkIndexField.Label=Result chunk index field
PgVectorSearch.resultChunkIndexField.Tooltip=Output field for the matched chunk index
PgVectorSearch.resultContentField.Label=Result content field
PgVectorSearch.resultContentField.Tooltip=Output field for the matched chunk text
PgVectorSearch.resultScoreField.Label=Result score field
PgVectorSearch.resultScoreField.Tooltip=Output field for the similarity score

PgVectorSearch.Tab.Main=Main
PgVectorSearchDialog.Filters.Label=Filters
PgVectorSearchDialog.Filters.Column.Table=Table column
PgVectorSearchDialog.Filters.Column.Stream=Stream field

