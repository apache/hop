HdfsMeta.Name = HDFS Connection
HdfsMeta.Name.Label = Name
HdfsMeta.Description = Connect to HDFS through WebHDFS, HttpFS or Knox (no Hadoop client libraries)
HdfsVFS.Description.Label = Description
HdfsVFS.Description.Tooltip = Optional description of this connection
HdfsVFS.Transport.Label = Transport
HdfsVFS.Transport.Tooltip = HttpFS (recommended from OpenShift: one gateway, no DataNode access). Knox (HTTPS topology). WebHDFS (NameNode HTTP plus every DataNode HTTP port).
HdfsVFS.Hostname.Label = Endpoint hostname
HdfsVFS.Hostname.Tooltip = HttpFS, Knox or NameNode hostname. Example: '${HDFS_HTTPFS_HOST}'
HdfsVFS.Port.Label = Port
HdfsVFS.Port.Tooltip = Defaults: HttpFS 14000, Knox 8443, WebHDFS 9870. Example: '${HDFS_HTTPFS_PORT}'
HdfsVFS.Https.Label = HTTPS
HdfsVFS.Https.Tooltip = Use HTTPS to the gateway or NameNode HTTP port
HdfsVFS.BasePath.Label = HTTP base path
HdfsVFS.BasePath.Tooltip = Override the REST prefix. Empty uses /webhdfs/v1. Knox example: /gateway/cdp-proxy/webhdfs/v1
HdfsVFS.HaNamenodes.Label = Extra NameNode HTTP endpoints
HdfsVFS.HaNamenodes.Tooltip = Optional host:port lines used as WebHDFS failover after the primary endpoint. Ignored for HttpFS and Knox.
HdfsVFS.DefaultRoot.Label = Default HDFS root
HdfsVFS.DefaultRoot.Tooltip = Optional prefix prepended to paths, for example /user/hop
HdfsVFS.SimpleUser.Label = Simple-auth user
HdfsVFS.SimpleUser.Tooltip = user.name query parameter when Kerberos is off (unsecured clusters only)
HdfsVFS.KerberosEnabled.Label = Enable Kerberos
HdfsVFS.KerberosEnabled.Tooltip = Log in with a keytab (or ticket cache) and send SPNEGO on every request
HdfsVFS.Principal.Label = Principal
HdfsVFS.Principal.Tooltip = Kerberos principal, for example hop/hop@EXAMPLE.COM or '${HDFS_PRINCIPAL}'
HdfsVFS.Keytab.Label = Keytab
HdfsVFS.Keytab.Tooltip = Path to the keytab file (OpenShift Secret mount)
HdfsVFS.Krb5.Label = krb5.conf
HdfsVFS.Krb5.Tooltip = Path to krb5.conf. This is a JVM-wide setting; use one file per process.
HdfsVFS.Realm.Label = Realm
HdfsVFS.Realm.Tooltip = Optional java.security.krb5.realm when krb5.conf is not set
HdfsVFS.Kdc.Label = KDC
HdfsVFS.Kdc.Tooltip = Optional java.security.krb5.kdc when krb5.conf is not set
HdfsVFS.Renewal.Label = Re-login interval (minutes)
HdfsVFS.Renewal.Tooltip = Fallback interval when the TGT end time cannot be read. Default 360. Tickets are renewed at 80% of remaining lifetime when known.
HdfsVFS.TicketCache.Label = Use existing ticket cache
HdfsVFS.TicketCache.Tooltip = Use the process ticket cache instead of a keytab (laptops). Prefer a keytab in OpenShift.
HdfsVFS.Truststore.Label = Trust material
HdfsVFS.Truststore.Tooltip = Optional CA file for HTTPS. PEM/CRT (CDP Auto-TLS ca.pem) or a Java keystore (JKS/PKCS12). Example: '/var/run/secrets/hdfs/ca.pem'
HdfsVFS.TruststorePassword.Label = Keystore password
HdfsVFS.TruststorePassword.Tooltip = Password for a JKS or PKCS12 keystore. Leave empty for PEM files.
HdfsVFS.HostnameVerification.Label = Verify TLS hostname
HdfsVFS.HostnameVerification.Tooltip = Disable only when a gateway certificate does not match the hostname
HdfsVFS.TestCluster.Label = Test connection
HdfsVFS.TestCluster.Tooltip = Call WebHDFS GETFILESTATUS with the current Cluster, Kerberos and TLS settings
HdfsVFS.TestCluster.Success.Title = HDFS connection
HdfsVFS.TestCluster.Error.Title = HDFS connection failed
HdfsVFS.TestCluster.Error.Message = Could not reach the HDFS HTTP endpoint with the current settings
HdfsVFS.TestKerberos.Label = Test Kerberos
HdfsVFS.TestKerberos.Tooltip = Log in with the keytab or ticket cache and report the ticket end time
HdfsVFS.TestKerberos.Success.Title = Kerberos login
HdfsVFS.TestKerberos.Error.Title = Kerberos login failed
HdfsVFS.TestKerberos.Error.Message = Could not obtain a Kerberos ticket with the current settings
HdfsVFS.TestTls.Label = Test TLS
HdfsVFS.TestTls.Tooltip = Load the PEM or keystore, then handshake with the HTTPS endpoint when host and HTTPS are set
HdfsVFS.TestTls.Success.Title = TLS
HdfsVFS.TestTls.Error.Title = TLS check failed
HdfsVFS.TestTls.Error.Message = Could not load trust material or complete the TLS handshake
