VaultVariableResolver.label.vaultAddress = Vault address
VaultVariableResolver.label.vaultToken = Vault token
VaultVariableResolver.label.pathPrefix = Path prefix (optional)
VaultVariableResolver.label.namespace = Namespace
VaultVariableResolver.label.verifyingSsl = Validate HTTPS connections?
VaultVariableResolver.tooltip.verifyingSsl = Enable this in production!  It validates connections with an X.509 certificate specified with one of the PEM options below.
VaultVariableResolver.label.pemFilePath = PEM (X.509 certificate) file path
VaultVariableResolver.label.pemString = PEM (X.509 certificate) String
VaultVariableResolver.label.openTimeout = Open connection timeout
VaultVariableResolver.label.readTimeout = Read timeout
VaultVariableResolver.label.authenticationType = Authentication type
VaultVariableResolver.tooltip.authenticationType = TOKEN uses a Vault client token. KUBERNETES exchanges a Kubernetes ServiceAccount JWT for a short-lived Vault token.
VaultVariableResolver.label.kubernetesRole = Kubernetes role
VaultVariableResolver.tooltip.kubernetesRole = The Vault Kubernetes auth role bound to this workload's ServiceAccount.
VaultVariableResolver.label.kubernetesJwtPath = Kubernetes JWT file path
VaultVariableResolver.tooltip.kubernetesJwtPath = Path of the ServiceAccount token file. Defaults to /var/run/secrets/kubernetes.io/serviceaccount/token. You can also use a variable such as '${KUBERNETES_JWT_PATH}'.
VaultVariableResolver.label.kubernetesJwt = Kubernetes JWT
VaultVariableResolver.tooltip.kubernetesJwt = Optional JWT string, used instead of the file when set. Typical in tests or when the token is injected as '${KUBERNETES_JWT}'.
VaultVariableResolver.label.kubernetesAuthPath = Kubernetes auth mount path
VaultVariableResolver.tooltip.kubernetesAuthPath = Vault auth mount, without the leading auth/. Defaults to kubernetes.