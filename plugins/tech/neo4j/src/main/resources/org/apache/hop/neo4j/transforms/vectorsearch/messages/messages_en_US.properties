GraphVectorSearch.Name=Graph vector search
GraphVectorSearch.Description=Finds the nodes or relationships nearest to a vector through a vector index of a graph database
GraphVectorSearch.Keywords=graph,vector,embedding,similarity,search,nearest,rag,graphrag,neo4j,memgraph,falkordb
GraphVectorSearchDialog.Shell.Title=Graph vector search
GraphVectorSearch.Tab.Search=Search
GraphVectorSearch.Tab.Output=Output

GraphVectorSearch.Connection.Label=Graph database connection
GraphVectorSearch.Connection.Tooltip=The connection to a graph database with vector indexes: Neo4j, Memgraph or FalkorDB
GraphVectorSearch.ElementType.Label=Search
GraphVectorSearch.ElementType.Tooltip=NODE searches a vector index on nodes, RELATIONSHIP one on relationships
GraphVectorSearch.IndexName.Label=Vector index name
GraphVectorSearch.IndexName.Tooltip=The name of the vector index to search, on Neo4j and Memgraph
GraphVectorSearch.Label.Label=Node label or relationship type
GraphVectorSearch.Label.Tooltip=The label of the nodes, or the type of the relationships, with the vector index, on FalkorDB which has no index names
GraphVectorSearch.VectorProperty.Label=Vector property
GraphVectorSearch.VectorProperty.Tooltip=The indexed property with the vectors, on FalkorDB which has no index names
GraphVectorSearch.Similarity.Label=Similarity function
GraphVectorSearch.Similarity.Tooltip=The similarity function the vector index was created with. The score is the cosine similarity (-1 to 1) for COSINE and 1 / (1 + squared distance) for EUCLIDEAN, on every database.
GraphVectorSearch.EmbeddingField.Label=Query embedding field
GraphVectorSearch.EmbeddingField.Tooltip=The field with the vector to search for: a Vector field, or text like [0.1,0.2,0.3]
GraphVectorSearch.TopK.Label=Top K
GraphVectorSearch.TopK.Tooltip=The maximum number of nodes or relationships to find for every row
GraphVectorSearch.MinScore.Label=Minimum score
GraphVectorSearch.MinScore.Tooltip=Only return the nodes or relationships with at least this score. Applied after the top K, so fewer than K rows can come back. Empty for no minimum.
GraphVectorSearch.EatingRowOnNoMatch.Label=Do not pass the row if the search finds nothing
GraphVectorSearch.EatingRowOnNoMatch.Tooltip=When off, a row which finds nothing is passed on with empty search fields. When on, the row is dropped. Rows with an empty vector are handled the same way.
GraphVectorSearch.ScoreField.Label=Score field
GraphVectorSearch.ScoreField.Tooltip=The output field with the similarity score: higher for nearer nodes or relationships. Leave empty to leave the field out.
GraphVectorSearch.ReturnProperties.Label=Returned properties
GraphVectorSearch.ReturnProperties.Tooltip=The properties of the nodes or relationships found to return, each in an output field
GraphVectorSearch.Property.Property.Label=Property
GraphVectorSearch.Property.Property.Tooltip=The property of the node or relationship to return
GraphVectorSearch.Property.FieldName.Label=Output field
GraphVectorSearch.Property.FieldName.Tooltip=The name of the output field, the property name when empty
GraphVectorSearch.Property.Type.Label=Type
GraphVectorSearch.Property.Type.Tooltip=The Hop type of the output field, String when empty

GraphVectorSearch.Injection.CONNECTION=The name of the graph database connection
GraphVectorSearch.Injection.ELEMENT_TYPE=Search the vector index of nodes or relationships: NODE or RELATIONSHIP
GraphVectorSearch.Injection.INDEX_NAME=The name of the vector index
GraphVectorSearch.Injection.LABEL=The label of the nodes, or the type of the relationships, with the vector index
GraphVectorSearch.Injection.VECTOR_PROPERTY=The indexed property with the vectors
GraphVectorSearch.Injection.SIMILARITY=The similarity function of the index: COSINE or EUCLIDEAN
GraphVectorSearch.Injection.EMBEDDING_FIELD=The field with the vector to search for
GraphVectorSearch.Injection.TOP_K=The maximum number of nodes or relationships to find
GraphVectorSearch.Injection.MIN_SCORE=The minimum score
GraphVectorSearch.Injection.EAT_ROW_ON_NO_MATCH=Do not pass the row if the search finds nothing
GraphVectorSearch.Injection.SCORE_FIELD=The output field with the score
GraphVectorSearch.Injection.RETURN_PROPERTIES=The properties of the nodes or relationships to return
GraphVectorSearch.Injection.PROPERTY=The property of the node or relationship to return
GraphVectorSearch.Injection.FIELD_NAME=The output field of the property
GraphVectorSearch.Injection.TYPE=The Hop type of the output field

GraphVectorSearch.Error.NoConnection=Please specify a graph database connection
GraphVectorSearch.Error.NoIndex=Please specify the name of the vector index, or for FalkorDB the label or relationship type and the vector property
GraphVectorSearch.Error.NoEmbeddingField=Please specify the field with the vector to search for
GraphVectorSearch.Error.EmbeddingFieldNotFound=Embedding field ''{0}'' not found in the input
GraphVectorSearch.Error.TopK=Top K ''{0}'' is not a number of at least 1
GraphVectorSearch.Error.MinScore=Minimum score ''{0}'' is not a number
GraphVectorSearch.Error.NotSupported=Connection ''{0}'' is to {1}, which has no vector search. Use Neo4j, Memgraph or FalkorDB.
GraphVectorSearch.Error.RelationshipsNotSupported=Connection ''{0}'' is to {1}, which has no vector search over relationships. Use Neo4j 5.18 or later, Memgraph 3 or FalkorDB, or search nodes.
GraphVectorSearch.Error.Closing=Error closing the graph database connection
GraphVectorSearch.Warning.MinScoreAfterTopK=The minimum score is applied after the top K, so fewer than K rows may come back
GraphVectorSearch.Log.EmptyEmbedding=Field ''{0}'' has no vector: no search
