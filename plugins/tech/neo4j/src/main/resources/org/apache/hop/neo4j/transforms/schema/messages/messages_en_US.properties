GetGraphSchema.Name=Get graph schema
GetGraphSchema.Description=Reads the labels, relationship types and properties of a graph database
GetGraphSchema.Keywords=graph,schema,labels,relationship types,properties,metadata,neo4j,memgraph,falkordb,age,gremlin,neptune
GetGraphSchemaDialog.Shell.Title=Get graph schema
GetGraphSchema.Tab.Schema=Schema
GetGraphSchema.Tab.Fields=Output fields

GetGraphSchema.Connection.Label=Graph database connection
GetGraphSchema.Connection.Tooltip=The graph database connection or Neo4j connection to read the schema of
GetGraphSchema.SampleSize.Label=Sample size
GetGraphSchema.SampleSize.Tooltip=The number of nodes and relationships to read, per label and relationship type where the database lists them. Neo4j and Memgraph with schema information read their own catalog and ignore it. Default: 1000.

GetGraphSchema.ElementTypeField.Label=Element type field
GetGraphSchema.ElementTypeField.Tooltip=Output field with NODE or RELATIONSHIP. Leave empty to leave the field out.
GetGraphSchema.NameField.Label=Name field
GetGraphSchema.NameField.Tooltip=Output field with the node label or relationship type. Leave empty to leave the field out.
GetGraphSchema.PropertyField.Label=Property field
GetGraphSchema.PropertyField.Tooltip=Output field with the property name, empty for a label or type without properties. Leave empty to leave the field out.
GetGraphSchema.PropertyTypesField.Label=Property types field
GetGraphSchema.PropertyTypesField.Tooltip=Output field with the types of the property values, separated by commas, for example String or List<Float>. Leave empty to leave the field out.
GetGraphSchema.MandatoryField.Label=Mandatory field
GetGraphSchema.MandatoryField.Tooltip=Output field which is true if every node or relationship (in the sample) has the property, empty if unknown. Leave empty to leave the field out.
GetGraphSchema.IndexedField.Label=Indexed field
GetGraphSchema.IndexedField.Tooltip=Output field which is true if an index covers the property, empty if the database doesn't list its indexes. Leave empty to leave the field out.
GetGraphSchema.UniqueField.Label=Unique field
GetGraphSchema.UniqueField.Tooltip=Output field which is true if a unique index or constraint covers the property, empty if unknown. Leave empty to leave the field out.
GetGraphSchema.StartLabelsField.Label=Start labels field
GetGraphSchema.StartLabelsField.Tooltip=Output field with the labels of the nodes a relationship type starts from, separated by commas. Leave empty to leave the field out.
GetGraphSchema.EndLabelsField.Label=End labels field
GetGraphSchema.EndLabelsField.Tooltip=Output field with the labels of the nodes a relationship type ends at, separated by commas. Leave empty to leave the field out.

GetGraphSchema.Injection.CONNECTION=The name of the graph database connection
GetGraphSchema.Injection.SAMPLE_SIZE=The number of nodes and relationships to sample

GetGraphSchema.Error.NoConnection=Please specify a graph database connection
GetGraphSchema.Error.SampleSize=The sample size ''{0}'' is not a number of at least 1
GetGraphSchema.Error.NotSupported=Connection ''{0}'' to {1} can''t tell its schema
GetGraphSchema.Warning.InputIgnored=This transform reads the schema of the database: the rows of the previous transforms are ignored
GetGraphSchema.Log.Sampled=Read {0} schema entries from a sample of {1} nodes and relationships
GetGraphSchema.Log.Catalog=Read {0} schema entries from the catalog of the database
