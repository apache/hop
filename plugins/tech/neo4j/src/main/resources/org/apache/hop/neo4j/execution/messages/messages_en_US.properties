NeoExecutionInfoLocation.Connection.Label = Graph database connection
NeoExecutionInfoLocation.Connection.Tooltip = Select the graph database to store the execution information in. It needs to speak Cypher.
NeoExecutionInfoLocation.CreateIndexAction.Label = Copy a Graph index action to clipboard
NeoExecutionInfoLocation.CreateIndexAction.Tooltip = Copy a Graph index action to clipboard. It will contain all the index actions that are required to make this graph database location perform well.
NeoExecutionInfoLocation.CreateIndexes.Label = Show indexes DDL
NeoExecutionInfoLocation.CreateIndexes.Tooltip = Show the statements needed to create indexes for a graph database location. It will contain all the index DDL required to make this graph database location perform well.
