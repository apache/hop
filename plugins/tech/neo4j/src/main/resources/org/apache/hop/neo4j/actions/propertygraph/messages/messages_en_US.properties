ActionCreatePropertyGraph.Group.Graph=Property graph
ActionCreatePropertyGraph.Group.NodeTables=Node tables
ActionCreatePropertyGraph.Group.EdgeTables=Edge tables
ActionCreatePropertyGraph.Connection.Label=Relational database connection
