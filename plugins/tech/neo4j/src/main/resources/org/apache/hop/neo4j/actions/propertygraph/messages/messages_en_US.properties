ActionCreatePropertyGraph.GraphModel.Label=Graph model
ActionCreatePropertyGraph.GraphModel.Tooltip=The graph model with the nodes, relationships and properties of the property graph
ActionCreatePropertyGraph.CreatingTables.Label=Create missing tables?
