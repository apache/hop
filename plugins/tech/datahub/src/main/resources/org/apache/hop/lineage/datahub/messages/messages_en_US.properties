DataHubDataCatalog.Url.Label=DataHub GMS URL
DataHubDataCatalog.Url.Tooltip=The URL of DataHub''s metadata service (GMS), for example http://localhost:8080 or 'https://<account>.acryl.io/gms'. A variable such as '${DATAHUB_URL}' works too.
DataHubDataCatalog.Token.Label=Access token
DataHubDataCatalog.Token.Tooltip=A DataHub personal access token, with the right to read the datasets. Leave it empty when DataHub doesn''t use token authentication.
DataHubDataCatalog.Environment.Label=Environment
DataHubDataCatalog.Environment.Tooltip=The environment (fabric) in the dataset URNs, for example PROD or DEV. Use the same one as the DataHub lineage sink, so tables and files resolve to the datasets lineage writes. The default is PROD.
DataHubDataCatalog.ConnectTimeout.Label=Connect timeout (ms)
DataHubDataCatalog.ConnectTimeout.Tooltip=How long to wait for a connection to DataHub, in milliseconds. The default is 5000.
DataHubDataCatalog.ReadTimeout.Label=Read timeout (ms)
DataHubDataCatalog.ReadTimeout.Tooltip=How long to wait for DataHub to answer a question, in milliseconds. The default is 30000.
DataHubDataCatalog.TrustStorePath.Label=Trust store
DataHubDataCatalog.TrustStorePath.Tooltip=A trust store with the certificate of a DataHub that uses a certificate Java doesn''t trust. Leave it empty otherwise.
DataHubDataCatalog.TrustStorePassword.Label=Trust store password
DataHubDataCatalog.TrustStorePassword.Tooltip=The password of the trust store, if it has one.
DataHubDataCatalog.TrustStoreType.Label=Trust store type
DataHubDataCatalog.TrustStoreType.Tooltip=The type of the trust store, for example PKCS12 or JKS. The default is PKCS12.
