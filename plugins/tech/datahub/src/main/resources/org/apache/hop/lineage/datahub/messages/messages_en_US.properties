DataHubDataCatalog.Url.Label=DataHub GMS URL
DataHubDataCatalog.Url.Tooltip=The URL of DataHub''s metadata service (GMS), for example http://localhost:8080 or 'https://<account>.acryl.io/gms'. A variable such as '${DATAHUB_URL}' works too.
DataHubDataCatalog.Token.Label=Access token
DataHubDataCatalog.Token.Tooltip=A DataHub personal access token, with the right to read the datasets. Leave it empty when DataHub doesn''t use token authentication.
DataHubDataCatalog.Environment.Label=Environment
DataHubDataCatalog.Environment.Tooltip=The environment (fabric) in the dataset URNs, for example PROD or DEV. Use the same one as the DataHub lineage sink, so tables and files resolve to the datasets lineage writes. The default is PROD.
DataHubDataCatalog.ConnectTimeout.Label=Connect timeout (ms)
DataHubDataCatalog.ConnectTimeout.Tooltip=How long to wait for a connection to DataHub, in milliseconds. The default is 5000.
DataHubDataCatalog.ReadTimeout.Label=Read timeout (ms)
DataHubDataCatalog.ReadTimeout.Tooltip=How long to wait for DataHub to answer a question, in milliseconds. The default is 30000.
DataHubDataCatalog.TrustStorePath.Label=Trust store
DataHubDataCatalog.TrustStorePath.Tooltip=A trust store with the certificate of a DataHub that uses a certificate Java doesn''t trust. Leave it empty otherwise.
DataHubDataCatalog.TrustStorePassword.Label=Trust store password
DataHubDataCatalog.TrustStorePassword.Tooltip=The password of the trust store, if it has one.
DataHubDataCatalog.TrustStoreType.Label=Trust store type
DataHubDataCatalog.TrustStoreType.Tooltip=The type of the trust store, for example PKCS12 or JKS. The default is PKCS12.
DataHubDataCatalog.DatabaseInstances.Label=Database platform instances
DataHubDataCatalog.DatabaseInstances.Tooltip=Give the tables of a database server the platform instance of the DataHub ingestion source that reads that server. Their datasets are then named '<instance>.<database>.<schema>.<table>', as DataHub names the tables it ingests with a platform_instance. Leave it empty when that ingestion has no platform instance.
DataHubDatabaseInstance.Connection.Label=Relational connection
DataHubDatabaseInstance.Connection.Tooltip=The relational connection to the database server. The platform instance applies to every table on that server (host and port), whichever connection reaches it.
DataHubDatabaseInstance.PlatformInstance.Label=Platform instance
DataHubDatabaseInstance.PlatformInstance.Tooltip=The platform_instance of the DataHub ingestion source of this database server, for example warehouse.
DataHubSinkConfig.SchemaPolicy.MISSING=When DataHub has none, or has Hop''s
DataHubSinkConfig.SchemaPolicy.ALWAYS=Always
DataHubSinkConfig.SchemaPolicy.NEVER=Never
DataHubSinkConfiguration.Group.DataHub=DataHub
DataHubSinkConfiguration.DataCatalog.Label=DataHub data catalog
DataHubSinkConfiguration.DataCatalog.Tooltip=The DataHub data catalog to write to: its URL, access token, environment and trust store. The token needs the right to write metadata.
DataHubSinkConfiguration.PlatformInstance.Label=Platform instance
DataHubSinkConfiguration.PlatformInstance.Tooltip=Keeps the pipelines and workflows of several Hop installations apart in one DataHub. Empty uses none.
DataHubSinkConfiguration.DatasetSchema.Label=Write dataset schemas
DataHubSinkConfiguration.DatasetSchema.Tooltip=When to write the schema of a dataset Hop read or wrote. By default only when DataHub has none, or the one it has came from Hop.
DataHubSinkConfiguration.Lifecycle.Label=Deprecate deleted datasets
DataHubSinkConfiguration.Lifecycle.Tooltip=Deprecate a dataset a run deleted or moved, and clear that deprecation when a later run writes it again.
DataHubSinkConfiguration.Actor.Label=Actor
DataHubSinkConfiguration.Actor.Tooltip=The DataHub user named as the actor of the runs and deprecations Hop writes. Empty is urn:li:corpuser:datahub.
DataHubSinkConfiguration.SqlParse.Label=Parse SQL
DataHubSinkConfiguration.SqlParse.Tooltip=Parse the SQL of Table input and Execute SQL script to find the tables they read and write.
ActionPublishToDataHub.Name=Publish to DataHub
ActionPublishToDataHub.Description=Publishes the pipelines and workflows of a folder to DataHub without running them: their tasks, the tables and files they read and write, and the layouts of those files
ActionPublishToDataHub.Keywords=datahub,lineage,catalog,publish,metadata
ActionPublishToDataHub.Group.Options=Options
ActionPublishToDataHub.Sink.Label=DataHub lineage sink
ActionPublishToDataHub.Sink.Tooltip=The lineage sink of type DataHub to publish to: the same DataHub, environment and platform instance the runs report to.
ActionPublishToDataHub.Folder.Label=Folder
ActionPublishToDataHub.Folder.Tooltip=The folder with the pipelines and workflows to publish, with its subfolders. The default is the project''s home folder, '${PROJECT_HOME}'.
ActionPublishToDataHub.Documentation.Label=Include documentation
ActionPublishToDataHub.Documentation.Tooltip=Also publish what hop doc writes for each pipeline and workflow (details, parameters and notes) as a DataHub document, related to its pipeline and tasks. Needs DataHub 1.7 or later.
ActionPublishToDataHub.Error=Unable to publish to DataHub: {0}
