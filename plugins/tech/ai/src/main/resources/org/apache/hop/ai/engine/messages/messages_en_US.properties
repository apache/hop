AiAdvisorEngine.Disabled=The AI Assistant is disabled. Enable it under Configuration → Plugins → AI Assistant.
AiAdvisorEngine.NoAdvisor=Select an assistant for this session.
AiAdvisorEngine.Cancelled=The question was cancelled.
AiAdvisorEngine.NoProvider=No AI provider is selected. Create one under Metadata → AI Provider, or pick one in the Provider field.
AiAdvisorEngine.ProviderNotLoaded=AI provider ''{0}'' could not be loaded. Open it in the Metadata perspective to check it.
AiAdvisorEngine.ProviderNotFound=AI provider ''{0}'' was not found in this project.
AiAdvisorEngine.PromptTooLarge=This question needs about {0} tokens of context, but AI provider ''{1}'' has a context size of {2} tokens, with {3} kept for the answer. Uncheck large items under Sharing (plugin catalog, full XML, execution log, selected metadata), start a new session to drop the conversation history, or raise Context size on the AI provider if the model supports it.
AiChatFactory.MissingType=AI provider ''{0}'' has no provider type. Open it in the Metadata perspective, select a provider type and save it.
AiContextBuilder.NotLinked.Pipeline=This session is not linked to an open pipeline. Open the pipeline and click AI Assistant on its toolbar, or click Link to the open file on the AI Assistant toolbar.
AiContextBuilder.NotLinked.Workflow=This session is not linked to an open workflow. Open the workflow and click AI Assistant on its toolbar, or click Link to the open file on the AI Assistant toolbar.
AiContextBuilder.NoQuestion=Please enter a question for the AI Assistant.
AiAdvisorEngine.ProposalsMissing=The answer describes proposed changes, but has no hop_proposals block with them.
AiAdvisorEngine.ProposalsBlocked=These proposals cannot be applied as they are:
