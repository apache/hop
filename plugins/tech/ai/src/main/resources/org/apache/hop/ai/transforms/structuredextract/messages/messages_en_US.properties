StructuredExtract.Name=Structured extract
StructuredExtract.Description=Pull named, typed fields out of text using an AI provider

StructuredExtractDialog.Shell.Title=Structured extract
StructuredExtract.Tab.Main=Main

StructuredExtract.aiProvider.Label=AI provider
StructuredExtract.aiProvider.Tooltip=AI provider serving the chat model that does the extraction
StructuredExtract.modelName.Label=Model
StructuredExtract.modelName.Tooltip=Optional. Overrides the provider's model for this transform only.
StructuredExtract.inputField.Label=Input field
StructuredExtract.inputField.Tooltip=Field holding the text to read fields out of. A row with empty text is passed on with the new fields left empty.
StructuredExtract.instructions.Label=Extra instructions
StructuredExtract.instructions.Tooltip=Optional. Added to the instruction sent with every row, for anything the field descriptions cannot say, such as which language the text is in or how to treat ambiguity.

StructuredExtractDialog.Fields.Label=Fields to extract
StructuredExtractDialog.Fields.Column.Name=Name
StructuredExtractDialog.Fields.Column.Type=Type
StructuredExtractDialog.Fields.Column.Description=Description
StructuredExtractDialog.Fields.Column.Required=Required
StructuredExtractDialog.Fields.Column.AllowedValues=Allowed values

StructuredExtract.Validation.ProviderRequired=An AI provider is required
StructuredExtract.Validation.InputFieldRequired=An input field is required
StructuredExtract.Validation.InputFieldNotFound=Input field ''{0}'' not found in the input stream
StructuredExtract.Validation.NoFields=At least one field to extract is required
StructuredExtract.Validation.DuplicateField=Field ''{0}'' is listed more than once
StructuredExtract.Validation.FieldAlreadyInStream=Field ''{0}'' is already in the input stream, so it would appear twice
StructuredExtract.Validation.BadType=Field ''{0}'' cannot be extracted: {1}
StructuredExtract.Validation.NoDescription=Field ''{0}'' has no description. A description is the most effective way to improve what the model returns.

StructuredExtract.Error.Calling=Error calling the model
StructuredExtract.Log.NoSchemaSupport=Model ''{0}'' does not accept a JSON schema, so the fields are described in the prompt instead and the answer is checked on the way back

StructuredExtractMeta.Injection.AI_PROVIDER=AI provider serving the chat model
StructuredExtractMeta.Injection.MODEL_NAME=Model name, overriding the provider's
StructuredExtractMeta.Injection.INPUT_FIELD=Field holding the text to read fields out of
StructuredExtractMeta.Injection.INSTRUCTIONS=Extra instructions added to every request
StructuredExtractMeta.Injection.FIELDS=The fields to extract
StructuredExtractMeta.Injection.FIELD_NAME=Output field name
StructuredExtractMeta.Injection.FIELD_TYPE=Hop value type: String, Integer, Number, BigNumber, Boolean, Date or Timestamp
StructuredExtractMeta.Injection.FIELD_DESCRIPTION=What this field means, sent to the model
StructuredExtractMeta.Injection.FIELD_REQUIRED=Whether the model must return this field
StructuredExtractMeta.Injection.FIELD_ALLOWED_VALUES=Comma separated list of the only values allowed
