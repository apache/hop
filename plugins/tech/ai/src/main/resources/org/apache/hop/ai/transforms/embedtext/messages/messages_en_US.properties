EmbedText.Name=Embed text
EmbedText.Description=Turn a text field into an embedding vector using an AI provider

EmbedTextDialog.Shell.Title=Embed text
EmbedText.Tab.Main=Main

EmbedText.aiProvider.Label=AI provider
EmbedText.aiProvider.Tooltip=AI provider serving the embedding model. The model comes from the provider's EMBEDDING entry.
EmbedText.modelName.Label=Model
EmbedText.modelName.Tooltip=Optional. Overrides the provider's EMBEDDING model for this transform only.
EmbedText.inputField.Label=Input field
EmbedText.inputField.Tooltip=Field holding the text to embed. A row with empty text is passed on with empty output fields.
EmbedText.outputField.Label=Output field
EmbedText.outputField.Tooltip=Field the embedding is written to
EmbedText.outputFormat.Label=Output format
EmbedText.outputFormat.Tooltip=STRING writes a JSON array, which pgvector upsert accepts as a literal. VECTOR writes a Vector field, which avoids rendering the numbers to text and back, and needs the Vector value type plugin.
EmbedText.batchSize.Label=Batch size
EmbedText.batchSize.Tooltip=Rows buffered before the provider is called. Rows whose text is empty are buffered too, so they keep their place in the stream, but they are not sent. Embedding calls are billed and rate limited per request, so batching matters.
EmbedText.includeModelMetadata.Label=Include model metadata
EmbedText.includeModelMetadata.Tooltip=Add the model name and the vector width to each row, so a later re-index can tell which model produced an embedding
EmbedText.modelField.Label=Model field
EmbedText.modelField.Tooltip=Output field for the embedding model name
EmbedText.dimensionsField.Label=Dimensions field
EmbedText.dimensionsField.Tooltip=Output field for the number of dimensions in the vector

EmbedText.Validation.ProviderRequired=An AI provider is required
EmbedText.Validation.InputFieldRequired=An input field is required
EmbedText.Validation.InputFieldNotFound=Input field ''{0}'' not found in the input stream
EmbedText.Validation.OutputFieldRequired=An output field is required
EmbedText.Validation.BatchSizePositive=Batch size must be at least 1
EmbedText.Validation.NoMetadataFields=Include model metadata is on, but neither the model field nor the dimensions field has a name, so nothing is added

EmbedText.Error.Embedding=Error calling embedding model {0}
EmbedText.Error.BatchSizeMismatch=The provider returned {0} embeddings for the {1} text(s) it was sent

EmbedTextMeta.Injection.AI_PROVIDER=AI provider serving the embedding model
EmbedTextMeta.Injection.MODEL_NAME=Embedding model name, overriding the provider's
EmbedTextMeta.Injection.INPUT_FIELD=Field holding the text to embed
EmbedTextMeta.Injection.OUTPUT_FIELD=Field the embedding is written to
EmbedTextMeta.Injection.OUTPUT_FORMAT=STRING or VECTOR
EmbedTextMeta.Injection.BATCH_SIZE=Rows sent to the provider in one call
EmbedTextMeta.Injection.INCLUDE_MODEL_METADATA=Add the model name and vector width to each row
EmbedTextMeta.Injection.MODEL_FIELD=Output field for the embedding model name
EmbedTextMeta.Injection.DIMENSIONS_FIELD=Output field for the number of dimensions
