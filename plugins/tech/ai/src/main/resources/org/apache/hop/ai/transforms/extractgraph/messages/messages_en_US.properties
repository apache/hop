ExtractGraph.Name=Extract graph
ExtractGraph.Description=Read the entities in a text and the relationships between them with a language model, for a knowledge graph
ExtractGraphDialog.Shell.Title=Extract graph
ExtractGraph.Tab.Main=Extraction
ExtractGraph.Tab.Output=Output fields

ExtractGraph.aiProvider.Label=AI provider
ExtractGraph.aiProvider.Tooltip=The AI provider whose CHAT model reads the text
ExtractGraph.modelName.Label=Model name
ExtractGraph.modelName.Tooltip=Optional: a model to use instead of the provider''s CHAT model
ExtractGraph.inputField.Label=Text field
ExtractGraph.inputField.Tooltip=The field holding the text to read the graph from, for example a chunk from the Text chunker
ExtractGraph.entityTypes.Label=Entity types
ExtractGraph.entityTypes.Tooltip=Optional, comma separated, for example Person, Organization, Product. When set, a type is matched ignoring case and an entity with any other type is left out
ExtractGraph.relationshipTypes.Label=Relationship types
ExtractGraph.relationshipTypes.Tooltip=Optional, comma separated, for example WORKS_FOR, MAKES. When set, a type is matched ignoring case and a relationship with any other type is left out
ExtractGraph.instructions.Label=Instructions
ExtractGraph.instructions.Tooltip=Optional: extra guidance for the model, for example about the domain of the texts
ExtractGraph.passRowsWithoutResults.Label=Pass through rows without results
ExtractGraph.passRowsWithoutResults.Tooltip=Write a row with empty graph fields for an input row without text or without any entity or relationship. Off: such a row produces no output

ExtractGraph.kindField.Label=Element kind field
ExtractGraph.kindField.Tooltip=Holds ENTITY or RELATIONSHIP for every output row
ExtractGraph.nameField.Label=Entity name field
ExtractGraph.nameField.Tooltip=The name of an entity, empty for relationships
ExtractGraph.typeField.Label=Type field
ExtractGraph.typeField.Tooltip=The type of the entity or relationship
ExtractGraph.descriptionField.Label=Description field
ExtractGraph.descriptionField.Tooltip=A one sentence description of the entity or relationship
ExtractGraph.sourceField.Label=Relationship source field
ExtractGraph.sourceField.Tooltip=The name of the entity a relationship starts at, empty for entities
ExtractGraph.targetField.Label=Relationship target field
ExtractGraph.targetField.Tooltip=The name of the entity a relationship ends at, empty for entities

ExtractGraph.Validation.ProviderRequired=Please select an AI provider
ExtractGraph.Validation.InputFieldRequired=Please select the text field
ExtractGraph.Validation.InputFieldNotFound=The text field ''{0}'' is not in the input rows
ExtractGraph.Validation.OutputFieldRequired=Every output field needs a name
ExtractGraph.Error.Calling=Error asking the model to read the graph
ExtractGraph.Log.Dropped=Left out {0}
ExtractGraph.Log.NoSchemaSupport=Model ''{0}'' can''t be held to a JSON schema: the schema goes in the instructions and the answer is checked on the way back

ExtractGraphMeta.Injection.AI_PROVIDER=The name of the AI provider
ExtractGraphMeta.Injection.MODEL_NAME=The model to use instead of the provider''s CHAT model
ExtractGraphMeta.Injection.INPUT_FIELD=The field holding the text
ExtractGraphMeta.Injection.ENTITY_TYPES=The allowed entity types, comma separated
ExtractGraphMeta.Injection.RELATIONSHIP_TYPES=The allowed relationship types, comma separated
ExtractGraphMeta.Injection.INSTRUCTIONS=Extra guidance for the model
ExtractGraphMeta.Injection.PASS_ROWS_WITHOUT_RESULTS=Write a row with empty graph fields for an input row without results (Y/N)
ExtractGraphMeta.Injection.KIND_FIELD=The element kind output field
ExtractGraphMeta.Injection.NAME_FIELD=The entity name output field
ExtractGraphMeta.Injection.TYPE_FIELD=The type output field
ExtractGraphMeta.Injection.DESCRIPTION_FIELD=The description output field
ExtractGraphMeta.Injection.SOURCE_FIELD=The relationship source output field
ExtractGraphMeta.Injection.TARGET_FIELD=The relationship target output field
