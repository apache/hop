HopAiConfig.Tab.Name=AI Assistant
HopAiConfigOptionPlugin.GitWarning.Label=Use Git (or similar version control) and create a feature branch before applying AI-driven changes.\nYou can then revert the whole project, or selected files, if things do not go as intended.
HopAiConfigOptionPlugin.GitWarning.Tooltip=Graph Undo only reverses some canvas edits. Metadata saves and pasted transforms or actions are not undone that way. A feature branch is the reliable rollback.
HopAiConfigOptionPlugin.AiEnabled.Label=Enable the AI Assistant
HopAiConfigOptionPlugin.AiEnabled.Tooltip=When disabled, the AI Assistant is hidden and no prompts are sent. Default is off. Before applying AI changes, work on a Git feature branch so you can revert the project if needed.
HopAiConfigOptionPlugin.DefaultProvider.Label=Default AI provider
HopAiConfigOptionPlugin.DefaultProvider.Tooltip=Named AI Provider metadata used by the AI Assistant. Pipelines can still pick a different provider.
HopAiConfigOptionPlugin.AllowFullXml.Label=Allow sending full XML
HopAiConfigOptionPlugin.AllowFullXml.Tooltip=Second gate for the session "Include full XML" checkbox. Off by default. Full XML is large and can contain SQL, filenames and notes. Leave this off unless you need it, and only after secrets live in environment variables or a keystore.
HopAiConfigOptionPlugin.ExtraContext.Label=Extra context
HopAiConfigOptionPlugin.ExtraContext.Tooltip=Standing notes sent with every AI Assistant question. The default reminds the model that metadata names are case-sensitive (`local` is not `Local`), that pipeline and workflow run configurations are different types, and that Hop is not Kettle. Add project conventions here.
HopAiConfigOptionPlugin.ExtraContextFiles.Label=Context files
HopAiConfigOptionPlugin.ExtraContextFiles.Tooltip=One VFS path per line. Files that exist are appended to the system prompt as instructions the assistant follows; missing files are skipped. Variables are resolved. Empty by default. Only list files you wrote for the AI Assistant, for example '${PROJECT_HOME}/ai-assistant.md': an AGENTS.md is usually written for coding agents, and a file from someone else's project can steer the assistant.
HopAiConfigOptionPlugin.Save.Error.Title=Error
HopAiConfigOptionPlugin.Save.Error.Message=Error saving AI configuration
HopAiConfigOptionPlugin.Group=AI Assistant
HopAiConfigOptionPlugin.KeepConversations.Label=Keep conversations after Hop GUI closes
HopAiConfigOptionPlugin.KeepConversations.Tooltip=Saves the AI Assistant sessions of each project as plain text (questions, answers, proposals and options, not the context that was sent) in the audit folder, '${HOP_AUDIT_FOLDER}', next to the other things Hop GUI remembers per project. That folder is on your machine and outside the project, so the conversations do not end up in version control. Uncheck to start every Hop GUI session without conversations.
HopAiConfigOptionPlugin.RequestOnClose.Label=When a window closes during a question
HopAiConfigOptionPlugin.RequestOnClose.Tooltip=What happens to a question that is still waiting for its answer when you close the AI Assistant window or dock, or Hop GUI. Finish in the background records the answer in the session, so you find it when you open the session again. Cancel stops waiting, as Stop does, and no answer is recorded.
AiRequestOnClose.FINISH_IN_BACKGROUND=Finish in the background
AiRequestOnClose.CANCEL=Cancel the question
