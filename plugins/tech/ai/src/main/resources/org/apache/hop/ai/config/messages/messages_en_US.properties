HopAiConfig.Tab.Name=AI Assistant
HopAiConfigOptionPlugin.GitWarning.Label=Use Git (or similar version control) and create a feature branch before applying AI-driven changes.\nYou can then revert the whole project, or selected files, if things do not go as intended.
HopAiConfigOptionPlugin.GitWarning.Tooltip=Graph Undo only reverses some canvas edits. Metadata saves and pasted transforms or actions are not undone that way. A feature branch is the reliable rollback.
HopAiConfigOptionPlugin.AiEnabled.Label=Enable AI advisory
HopAiConfigOptionPlugin.AiEnabled.Tooltip=When disabled, AI Help is hidden and no prompts are sent. Default is off. Before applying AI changes, work on a Git feature branch so you can revert the project if needed.
HopAiConfigOptionPlugin.DefaultProvider.Label=Default AI provider
HopAiConfigOptionPlugin.DefaultProvider.Tooltip=Named AI Provider metadata used by GUI advisors. Pipelines can still pick a different provider.
HopAiConfigOptionPlugin.AllowFullXml.Label=Allow sending full XML
HopAiConfigOptionPlugin.AllowFullXml.Tooltip=Second gate for the session "Include full XML" checkbox. Off by default. Full XML is large and can contain SQL, filenames and notes. Leave this off unless you need it, and only after secrets live in environment variables or a keystore.
HopAiConfigOptionPlugin.ExtraContext.Label=Extra context
HopAiConfigOptionPlugin.ExtraContext.Tooltip=Standing notes sent with every AI Assistant question. The default reminds the model that metadata names are case-sensitive (`local` is not `Local`), that pipeline and workflow run configurations are different types, and that Hop is not Kettle. Add project conventions here.
HopAiConfigOptionPlugin.ExtraContextFiles.Label=Context files
HopAiConfigOptionPlugin.ExtraContextFiles.Tooltip=One VFS path per line. Files that exist are appended to the system prompt; missing files are skipped. Default is '${PROJECT_HOME}/AGENTS.md'. Variables are resolved.
HopAiConfigOptionPlugin.Save.Error.Title=Error
HopAiConfigOptionPlugin.Save.Error.Message=Error saving AI configuration
