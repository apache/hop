AiProvider.name=AI Provider
AiProvider.description=Named credentials and model settings for an AI / LLM backend
AiProviderEditor.Name.Label=AI Provider name
AiProviderEditor.Type.Label=Provider
AiProviderEditor.TypeError.Title=AI provider type
AiProviderEditor.TypeError.Message=Unable to switch AI provider type
AiProviderEditor.Test.Label=Test
AiProviderEditor.Test.Success.Title=Success
AiProviderEditor.Test.Error.Title=Error
AiProviderEditor.Test.Error.Message=We couldn't reach this AI provider
AiProviderEditor.RefreshModels.Label=Refresh models
AiProviderEditor.RefreshModels.Success.Title=Models
AiProviderEditor.RefreshModels.Success.Message=Loaded {0} model(s). You can still type a model name that is not in the list.
