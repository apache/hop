AiProvider.name=AI Provider
AiProvider.description=Named credentials and model settings for an AI / LLM backend
AiProviderEditor.Name.Label=AI Provider name
AiProviderEditor.Type.Label=Provider
AiProviderEditor.TypeError.Title=AI provider type
AiProviderEditor.TypeError.Message=Unable to switch AI provider type
AiProviderEditor.Test.Label=Test
AiProviderEditor.Test.Success.Title=Success
AiProviderEditor.Test.Error.Title=Error
AiProviderEditor.Test.Error.Message=We couldn't reach this AI provider
AiProviderEditor.RefreshModels.Label=Refresh models
AiProviderEditor.RefreshModels.Success.Title=Models
AiProviderEditor.RefreshModels.Success.Message=Loaded {0} model(s). You can still type a model name that is not in the list.
AiProviderEditor.RefreshModels.Error.Title=Refresh models
AiProviderEditor.RefreshModels.Error.Message=Could not list models from this provider
AiProvider.BaseUrl.Label=Base URL
AiProvider.BaseUrl.Tooltip=API base URL. Leave empty to use the provider default. Example: '${AI_BASE_URL}'
AiProvider.ApiKey.Label=API key
AiProvider.ApiKey.Tooltip=API key or token. Do not paste a live key into this metadata. Prefer '${AI_API_KEY}' from an environment configuration file, or a keystore expression such as '#{vault:secret/data/ai:api-key}'. Resolved at send time.
AiProvider.Timeout.Label=Timeout (seconds)
AiProvider.Timeout.Tooltip=Request timeout in seconds
AiProviderEditor.Models.Label=Models per role
AiProviderEditor.Models.Explanation=Optional: a model for each role. A CHAT row replaces Model name; EMBEDDING and SCORING rows serve the embedding and reranking transforms.
AiProviderEditor.Group.Connection=Connection
AiProviderEditor.Group.Model=Model
AiProviderEditor.Models.Tooltip=Optional. A model for each role this provider serves, so one provider can back a chat transform, an embedding transform and a reranker. A transform picks the row for the role it needs. Leave empty to use the model name above, which is the chat model.
AiProviderEditor.Models.Column.Role=Role
AiProviderEditor.Models.Column.ModelName=Model name

AiProvider.ModelName.Label=Model name
AiProvider.ModelName.Tooltip=The chat model, sent to the provider. Use Refresh models to load names from the endpoint. You can still type a value such as '${AI_MODEL}'. A CHAT row under Models per role replaces this value.
AiProvider.Temperature.Label=Temperature
AiProvider.Temperature.Tooltip=Sampling temperature (for example 0.3)
AiProvider.ContextSize.Label=Context size (tokens)
AiProvider.ContextSize.Tooltip=How many tokens the model can read at once: prompt, history and answer together. Hop warns before sending a question that likely does not fit. For Ollama this also sets the context window the model is loaded with (num_ctx). Leave empty for 16384 with Ollama and the provider's own limit otherwise. A larger window uses more memory.
AiProvider.MaxOutputTokens.Label=Max output tokens
AiProvider.MaxOutputTokens.Tooltip=The longest answer the model may write, in tokens. Leave empty for the provider's default (4096 for Anthropic, which requires a value). Too low a value cuts answers and proposals short.
AiProvider.Validate.NoType=Select a provider type.
AiProvider.Validate.Temperature=Temperature ''{0}'' must be a number from 0 to 2.
AiProvider.Validate.PositiveNumber={0} ''{1}'' must be a whole number above 0.
AiProviderEditor.Validate.Title=The AI provider cannot be saved
