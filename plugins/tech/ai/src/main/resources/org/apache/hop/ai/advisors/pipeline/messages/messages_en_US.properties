PipelineAiAdvisor.Name=Pipeline AI Help
PipelineAiAdvisor.Description=Advise on pipeline design, transform selection and error diagnosis
PipelineAiAdvisor.Scenario.General.Label=General
PipelineAiAdvisor.Scenario.General.Description=Questions about the open pipeline
PipelineAiAdvisor.Scenario.TransformSelection.Label=Transform selection
PipelineAiAdvisor.Scenario.TransformSelection.Description=Which transform plugin to add
PipelineAiAdvisor.Scenario.ErrorDiagnosis.Label=Error diagnosis
PipelineAiAdvisor.Scenario.ErrorDiagnosis.Description=Check results and execution logs
PipelineAiAdvisor.Scenario.Design.Label=Pipeline design
PipelineAiAdvisor.Scenario.Design.Description=Architecture, hops and performance
PipelineAiAdvisor.Sharing.Baseline=graph structure
PipelineAiAdvisor.Sharing.MetadataTypes=metadata type names
PipelineAiAdvisor.Sharing.DatabasePlugins=database plugin ids
PipelineAiAdvisor.Inclusion.Checks=Include pipeline check results
PipelineAiAdvisor.Inclusion.Checks.Tooltip=Validation messages for this pipeline. Useful for most questions. Can mention file paths and connection names. Leave off unless you need them.
PipelineAiAdvisor.Inclusion.Checks.Summary=check results
PipelineAiAdvisor.Inclusion.Catalog=Include transform plugin catalog
PipelineAiAdvisor.Inclusion.Catalog.Tooltip=Ids and names of installed transform plugins, first turn only. Needed so hop_proposals use real plugin ids (TableInput, TypeExitExcelWriterTransform, \u2026). On by default. Uncheck to save tokens.
PipelineAiAdvisor.Inclusion.Catalog.Summary=plugin catalog
PipelineAiAdvisor.Inclusion.Xml=Include full pipeline XML (also requires Configuration option)
PipelineAiAdvisor.Inclusion.Xml.Tooltip=Full pipeline XML on the first turn only. Also requires Configuration \u2192 Plugins \u2192 AI Assistant \u2192 Allow sending full XML. Highest token cost and leak risk. Use only when the graph structure is not enough, and only if secrets are variables, not literals.
PipelineAiAdvisor.Inclusion.Xml.Summary=full XML
PipelineAiAdvisor.Inclusion.Logs=Include execution log excerpt
PipelineAiAdvisor.Inclusion.Logs.Tooltip=Excerpt of the last execution log, first turn only. Needed for runtime errors. Logs can contain row samples, paths and resolved values. Leave off unless you are diagnosing a failed run.
PipelineAiAdvisor.Inclusion.Logs.Summary=execution log
PipelineAiAdvisor.Inclusion.Metadata=Include selected metadata
PipelineAiAdvisor.Inclusion.Metadata.Tooltip=JSON of metadata objects you pick (connections, run configurations, and so on). Off by default. Use Select to choose specific elements. Passwords and API keys are redacted; still prefer variables over literals.
PipelineAiAdvisor.Inclusion.Metadata.Summary=metadata
