WorkflowAiAdvisor.Name=Workflow AI Help
WorkflowAiAdvisor.Description=Advise on workflow design, action selection and error diagnosis
WorkflowAiAdvisor.Scenario.General.Label=General
WorkflowAiAdvisor.Scenario.General.Description=Questions about the open workflow
WorkflowAiAdvisor.Scenario.ActionSelection.Label=Action selection
WorkflowAiAdvisor.Scenario.ActionSelection.Description=Which action plugin to add
WorkflowAiAdvisor.Scenario.ErrorDiagnosis.Label=Error diagnosis
WorkflowAiAdvisor.Scenario.ErrorDiagnosis.Description=Check results and execution logs
WorkflowAiAdvisor.Scenario.Design.Label=Workflow design
WorkflowAiAdvisor.Scenario.Design.Description=Orchestration, hops and reliability
WorkflowAiAdvisor.Sharing.Baseline=graph structure
WorkflowAiAdvisor.Sharing.MetadataTypes=metadata type names
WorkflowAiAdvisor.Sharing.DatabasePlugins=database plugin ids
WorkflowAiAdvisor.Inclusion.Checks=Include workflow check results
WorkflowAiAdvisor.Inclusion.Checks.Tooltip=Validation messages for this workflow. Useful for most questions. Can mention file paths and connection names. Leave off unless you need them.
WorkflowAiAdvisor.Inclusion.Checks.Summary=check results
WorkflowAiAdvisor.Inclusion.Catalog=Include action plugin catalog
WorkflowAiAdvisor.Inclusion.Catalog.Tooltip=Ids and names of installed action plugins, first turn only. Needed so hop_proposals use real plugin ids. On by default. Uncheck to save tokens.
WorkflowAiAdvisor.Inclusion.Catalog.Summary=plugin catalog
WorkflowAiAdvisor.Inclusion.Xml=Include full workflow XML (also requires Configuration option)
WorkflowAiAdvisor.Inclusion.Xml.Tooltip=Full workflow XML on the first turn only. Also requires Configuration \u2192 Plugins \u2192 AI Assistant \u2192 Allow sending full XML. Highest token cost and leak risk. Use only when the graph structure is not enough, and only if secrets are variables, not literals.
WorkflowAiAdvisor.Inclusion.Xml.Summary=full XML
WorkflowAiAdvisor.Inclusion.Logs=Include execution log excerpt
WorkflowAiAdvisor.Inclusion.Logs.Tooltip=Excerpt of the last execution log, first turn only. Needed for runtime errors. Logs can contain row samples, paths and resolved values. Leave off unless you are diagnosing a failed run.
WorkflowAiAdvisor.Inclusion.Logs.Summary=execution log
WorkflowAiAdvisor.Inclusion.Metadata=Include selected metadata
WorkflowAiAdvisor.Inclusion.Metadata.Tooltip=JSON of metadata objects you pick (connections, run configurations, and so on). Off by default. Use Select to choose specific elements. Passwords and API keys are redacted; still prefer variables over literals.
WorkflowAiAdvisor.Inclusion.Metadata.Summary=metadata
