RestAuthenticator.Hint.BearerUnauthorized=The server rejected the Bearer token (HTTP 401). Hop cannot renew a fixed Bearer token. For a token that expires, use the OAuth 2 authentication type, which fetches a new token when the server rejects the old one.
RestAuthenticator.Log.OAuth2TokenRejectedRetrying=The server rejected the OAuth 2 access token (HTTP 401). Fetched a new token and sending the request once more.
RestAuthenticator.Log.OAuth2TokenRenewalFailed=The server rejected the OAuth 2 access token (HTTP 401), and fetching a new token failed: {0}
