RestConnectionEditor.OAuth2.Authorize=Authorize...
RestConnectionEditor.OAuth2.Authorize.Tooltip=Opens the authorization server in a browser, then exchanges the code you get back for a refresh token. Do this once; pipelines then run unattended.
RestConnectionEditor.OAuth2.Authorize.Title=Authorize
RestConnectionEditor.OAuth2.Authorize.Info=1. Open the URL below in a browser and approve the request.\n2. The browser is sent to your redirect URI with a "code=" parameter in the address bar.\n3. Copy that code value and paste it below.\n\nAuthorization codes are short-lived, so do not leave this open for long.
RestConnectionEditor.OAuth2.OpenBrowser=Open in browser
RestConnectionEditor.OAuth2.OpenBrowserFailed=Unable to open a browser. Copy the URL above manually instead.
RestConnectionEditor.OAuth2.Code=Authorization code
RestConnectionEditor.OAuth2.Authorized=Authorized. The refresh token has been filled in and the grant switched to REFRESH_TOKEN, so this connection can now run unattended. Remember to save it.
RestConnectionEditor.OAuth2.Authorized.Title=Authorized
RestConnectionEditor.OAuth2.AuthorizeFailed=The authorization could not be completed.
RestConnectionEditor.OAuth2.AuthorizeFailed.Title=Authorization failed
