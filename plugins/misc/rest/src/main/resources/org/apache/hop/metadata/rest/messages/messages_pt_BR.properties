RestConnectionEditor.OAuth2.CredentialsInBody.Tooltip=Onde o segredo do cliente viaja. Por padrão, vai em um cabeçalho de Autorização Básica, marque isso para um servidor que só aceita no corpo do formulário. A identificação do cliente é sempre enviada no corpo, como quiser.
