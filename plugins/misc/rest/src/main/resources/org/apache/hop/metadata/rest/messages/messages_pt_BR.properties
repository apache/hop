RestConnectionEditor.OAuth2.Authorize.Tooltip=Abre o servidor de autorização em um navegador, então troca o código que você recebe de volta para uma ficha de atualização. Faça isso uma vez, condutos e correrão sem vigilância.
RestConnectionEditor.OAuth2.Authorize.Title=Autorizar
RestConnectionEditor.OAuth2.Authorize.Info=Abra a URL abaixo em um navegador e aprove o pedido. O navegador é enviado para o seu URI redirecionado com um parâmetro "code=" na barra de endereços. Copie esse valor de código e cole abaixo. Os códigos de autorização são curtos, então não deixe isso aberto por muito tempo.
