RestConnectionEditor.OAuth2.Code=Código de autorização.
RestConnectionEditor.OAuth2.Authorized=Autorizado. A ficha de atualização foi preenchida e a bolsa mudou para REFRESH TOKEN, então esta conexão pode ser executada sem acompanhamento. Lembre-se de salvá-lo.
