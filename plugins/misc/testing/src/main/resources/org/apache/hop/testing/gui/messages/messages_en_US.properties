TestingGuiPlugin.GoldenDataSetReplacement.Title=Golden data set
TestingGuiPlugin.GoldenDataSetReplacement.Message=When you attach a golden data set to a transform, that transform is replaced with a Dummy transform during unit test execution.{0}{0}The rows that would have been sent into the transform are captured and compared to the golden data set. The transform itself is not executed.{0}{0}This is typically done to prevent the unit test pipeline from writing to a file or a database.{0}Attach the golden data set to the output transform (for example Text File Output or Table Output).{0}Do not attach it to the transform whose results you want to verify\:{0}that transform would be skipped and would not produce those results.
TestingGuiPlugin.InputDataSetReplacement.Title=Input data set
TestingGuiPlugin.InputDataSetReplacement.Message=When you attach an input data set to a transform, that transform is replaced with an Injector transform during unit test execution.{0}{0}The static content of the data set is injected as rows instead of running the original transform.{0}{0}This is typically done so the unit test does not read from a file, a database, or another external source.
