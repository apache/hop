HopPasswordVariableResolver.label.resolveAsVariable=Resolva o argumento como um nome de variável
HopPasswordVariableResolver.tooltip.resolveAsVariable=Quando ativado, o valor após os dois pontos é tratado como um nome de variável. Essa variável é pesquisada e seu valor é descriptografado. Quando desativado, o argumento é descriptografado como literal (por exemplo, criptografado … ou AES2 …). Preferir o formulário de nome de variável para expressões mais limpas como '# {hop-pwd:SFTP PASSWORD}'.
HopPasswordVariableResolver.label.failIfVariableNotDefined=Falha se a variável não for definida.
HopPasswordVariableResolver.tooltip.failIfVariableNotDefined=Quando habilitado junto com "Resolver argumento como um nome de variável", um nome de variável indefinida causa um erro (conduto/fluxo de trabalho falha). Quando desativado, uma variável é ignorada e a expressão original fica inalterada.
