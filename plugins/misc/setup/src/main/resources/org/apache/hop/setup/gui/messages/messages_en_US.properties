SetupPrompt.Header=Keep Hop configuration across upgrades?
SetupPrompt.Message=Hop is using the installation folder for configuration. Configure a user-level '${HOP_CONFIG_FOLDER}' so projects, environments and GUI settings survive upgrades?

WelcomeSetup.Title=Environment setup
WelcomeSetup.Overview=By default Hop stores configuration next to the installation. Set '${HOP_CONFIG_FOLDER}' and '${HOP_AUDIT_FOLDER}' so upgrades keep your projects and settings.\n\nOpen <a>Configure Hop environment</a> from the Welcome dialog or Tools \u2192 Configure Hop environment\u2026
WelcomeSetup.Cli=From the command line, in the Hop install directory:\n\n  ./hop setup apply --defaults\n\nThen restart Hop. See the <a>Hop setup documentation</a>.
