WelcomeSetup.Title=Montagem do ambiente
WelcomeSetup.Overview=Por padrão o Hop armazena a configuração ao lado da instalação. Defina '${HOP CONFIG FOLDER}' e '${HOP AUDIT FOLDER}' para que as atualizações mantenham seus projetos e configurações.\n\nAbrir <a>Configurar ambiente de Hop</a> do diálogo de boas-vindas ou Ferramentas \u2192 Configurar ambiente de Hop\u2026
WelcomeSetup.Cli=Da linha de comando, no diretório Hop install:\n\n./hop setup apply --defaults\n\nEm seguida, reinicie Hop. Veja a documentação de configuração do Hop.
