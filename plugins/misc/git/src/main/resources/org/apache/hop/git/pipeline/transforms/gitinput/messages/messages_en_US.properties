GitInput.Name=Git Input
GitInput.Description=Read commits from a local Git clone or from Git hosting APIs (GitHub, GitLab, Bitbucket, Forgejo, Gitea)
GitInput.keyword=git github gitlab bitbucket forgejo gitea commits issues pull requests merge requests local repository

GitInputDialog.Shell.Title=Git Input
GitInputDialog.Source.Label=Source
GitInputDialog.Source.Tooltip=REMOTE uses provider REST APIs. LOCAL reads commits from a clone on disk with JGit.
GitInputDialog.LocalRepository.Label=Local repository path
GitInputDialog.LocalRepository.Tooltip=Path to a local Git working tree or clone. Issues and pull requests are not available for local repositories.
GitInputDialog.Connection.Label=Git connection
GitInputDialog.Connection.Tooltip=Select or create a Git connection with provider API credentials
GitInputDialog.ResourceType.Label=Resource type
GitInputDialog.ResourceType.Tooltip=What to read. A local repository offers COMMITS and COMMIT_FILES; the other types need a provider API.
GitInputDialog.Owner.Label=Repository owner
GitInputDialog.Owner.Tooltip=Organization, group or workspace that owns the repository. The list shows the first 100; use Browse... to search all of them.
GitInputDialog.Repository.Label=Repository name
GitInputDialog.Repository.Tooltip=Repository name. The list shows the first 100 of this owner; use Browse... to search all of them.
GitInputDialog.State.Label=State (issues/PRs/events)
GitInputDialog.State.Tooltip=Filters which issues are scanned for ISSUE_EVENTS (GitHub, GitLab, Bitbucket). Ignored for ISSUE_COMMENTS on GitHub (repo-wide comment feed).
GitInputDialog.Since.Label=Since (commits, ISO-8601)
GitInputDialog.Since.Tooltip=Only read commits after this timestamp, for example 2026-01-01T00:00:00Z. Leave empty to read the full history.
GitInputDialog.Branch.Label=Branch (commits)
GitInputDialog.Branch.Tooltip=Branch or tag to read commits from. The list shows the first 100; use Browse... to search all of them.
GitInputDialog.PageSize.Label=Page size
GitInputDialog.PageSize.Tooltip=Batch size per fetch. For remote sources, total rows per run is about page size x max pages. Local repositories stream all matching rows; page size only controls batching.
GitInputDialog.MaxPages.Label=Max pages (0 = all)
GitInputDialog.MaxPages.Tooltip=How many API pages to fetch for remote sources. Example: 100 x 100 = up to 10,000 rows. Set 0 to read every page until the provider runs out. Ignored when source is LOCAL.
GitInputDialog.IncludeRawJson.Label=Include raw JSON in output
GitInputDialog.IncludeRawJson.Tooltip=When checked, each row includes a raw_json field with the full provider API payload. Uncheck to omit it and reduce row size.
GitInputDialog.Refresh.Label=Refresh
GitInputDialog.Browse.Label=Browse...
GitInputDialog.Browse.Repositories.Title=Select repository
GitInputDialog.Browse.Branches.Title=Select branch
GitInputDialog.Load.Error.Title=Load from Git provider
GitInputDialog.Load.Organizations.Message=Could not load organizations from the Git connection.
GitInputDialog.Load.Repositories.Message=Could not load repositories for the selected owner.
GitInputDialog.Load.Branches.Message=Could not load branches for the selected repository.

GitInput.Error.UnknownSource=Unknown Git Input source ''{0}''. Use REMOTE or LOCAL.
GitInput.Error.LocalPathRequired=A local repository path is required when the source is LOCAL.
GitInput.Error.ConnectionRequired=A Git connection is required when the source is REMOTE.
GitInput.Error.ConnectionNotFound=The Git connection ''{0}'' does not exist in the metadata.
GitInput.Error.ConnectionLoad=Could not load the Git connection ''{0}''.
GitInput.Error.LocalResourceTypeUnsupported=A local repository supports only COMMITS and COMMIT_FILES, not {0}.
GitInput.Error.CommitFilesRemote=COMMIT_FILES is only available for a local repository. Set Source to LOCAL.
GitInput.Error.RepositoryRequired=A repository owner and name are required when the source is REMOTE.
GitInput.Log.LocalSummary=Read {0} {1} record(s) from {2}. Page size {3} controls streaming batches only; a local repository has no row cap.
GitInput.Log.RemoteSummary=Read {0} {1} record(s) from {2} (page size {3}, max pages {4}).
GitInput.Log.RemoteSummaryAllPages=Read {0} {1} record(s) from {2} (page size {3}, all pages).
GitInput.Log.Truncated=The result set is capped: {0}.

GitInputMeta.Error.CreateValueMeta=Could not create the output field ''{0}''.
GitInputMeta.CheckResult.UnexpectedInput=This transform reads from Git and ignores incoming rows. Remove the incoming hop, or send those rows elsewhere.
GitInputMeta.CheckResult.UnknownSource=Unknown source ''{0}''. Use REMOTE or LOCAL.
GitInputMeta.CheckResult.UnknownResourceType=Unknown resource type ''{0}''.
GitInputMeta.CheckResult.LocalPathMissing=No local repository path is set.
GitInputMeta.CheckResult.LocalResourceTypeUnsupported=A local repository supports only COMMITS and COMMIT_FILES, not {0}.
GitInputMeta.CheckResult.ConnectionMissing=No Git connection is selected.
GitInputMeta.CheckResult.ConnectionNotFound=The Git connection ''{0}'' does not exist in the metadata.
GitInputMeta.CheckResult.ConnectionNotVerified=The Git connection ''{0}'' could not be verified.
GitInputMeta.CheckResult.RepositoryMissing=A repository owner and name are required for a remote source.
GitInputMeta.CheckResult.CommitFilesRemote=COMMIT_FILES is only available for a local repository. Set Source to LOCAL.
GitInputMeta.CheckResult.PageSizeInvalid=Page size ''{0}'' is not a positive number.
GitInputMeta.CheckResult.MaxPagesInvalid=Max pages ''{0}'' is not a positive number or 0 for all pages.
GitInputMeta.CheckResult.RowCap=This transform reads at most {0} row(s) per run. Page size is capped at the provider maximum, so the real cap can be lower.
GitInputMeta.CheckResult.RowCapUnlimited=Max pages is 0, so this transform reads every page the provider will serve. There is no row cap; a large repository can mean many API calls and can run into provider rate limits.
