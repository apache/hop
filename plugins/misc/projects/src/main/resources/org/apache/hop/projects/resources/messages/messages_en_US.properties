ResourceLifecycleEnv.Tab.Title=System resources
ResourceLifecycleEnv.Help=Optional requirements checked when this lifecycle environment is enabled (GUI, hop-run, hop-server, \ldots). Leave fields empty to skip a check. Memory uses the JVM max heap (Runtime.maxMemory / -Xmx). Disk paths must be local folders.
ResourceLifecycleEnv.OnEnable.Label=On enable
ResourceLifecycleEnv.OnEnable.Tooltip=off\: no check; warn\: log/dialog on failure; enforce\: fail enabling the environment. Default depends on purpose (Production\=enforce, Testing/Acceptance\=warn, else off).
ResourceLifecycleEnv.MinMaxMemoryMb.Label=Min JVM max memory (MiB)
ResourceLifecycleEnv.MinMaxMemoryMb.Tooltip=Minimum Runtime.maxMemory() in mebibytes (configured -Xmx capacity), not currently allocated heap.
ResourceLifecycleEnv.MinProcessors.Label=Min CPU cores
ResourceLifecycleEnv.MinProcessors.Tooltip=Minimum Runtime.availableProcessors() reported by the JVM.
ResourceLifecycleEnv.Disk.Label=Local folders (min free space)
ResourceLifecycleEnv.Disk.Column.Path=Folder path
ResourceLifecycleEnv.Disk.Column.MinFreeMb=Min free (MiB)
ResourceLifecycleEnv.Disk.Button.Browse=Browse\u2026
ResourceLifecycleEnv.Check.Title=System resource requirements
ResourceLifecycleEnv.Check.Failed=System resource check failed for environment ''{0}'':\n{1}
ResourceLifecycleEnv.Check.Passed=System resource requirements satisfied for environment ''{0}''.
