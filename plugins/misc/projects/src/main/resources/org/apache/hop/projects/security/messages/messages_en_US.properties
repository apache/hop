ProjectsSecurityTab.Tab.Name=Projects
ProjectsSecurityTab.Hint=Restrict which projects authenticated users may open in Hop Web. Type ''user'' matches a username, ''role'' matches a Hop role (admin, user, operator, readonly), and ''group'' matches a container / IdP / LDAP group name. Security administrators always have access to every project. Desktop / unrestricted sessions are not filtered.
ProjectsSecurityTab.Enabled=Enable project access control
ProjectsSecurityTab.DefaultAllowAll=When no rule matches, allow all projects (uncheck to deny by default)
ProjectsSecurityTab.Rules.Label=Access rules
ProjectsSecurityTab.Col.Type=Type
ProjectsSecurityTab.Col.Subject=Subject
ProjectsSecurityTab.Col.AllProjects=All projects
ProjectsSecurityTab.Col.Projects=Projects
ProjectsSecurityTab.Col.Projects.Tooltip=Comma-separated project names (ignored when All projects is Y)
ProjectsSecurityTab.Error.BadType=Unknown subject type ''{0}''. Use user, role, or group.
ProjectsSecurityTab.AccessDenied.Title=Project access denied
ProjectsSecurityTab.AccessDenied.Message=You are not allowed to open project ''{0}''. Contact an administrator if you need access.
