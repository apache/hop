ResourceLifecycleEnv.Tab.Title=Recursos do sistema.
ResourceLifecycleEnv.Help=Requisitos opcionais verificados quando este ambiente de ciclo de vida é ativado (GUI, hop-run, hop-servidor, \ldots). Deixe os campos vazios para pular uma verificação. A memória usa a pilha máxima da JVM. Os caminhos do disco devem ser pastas locais.
ResourceLifecycleEnv.OnEnable.Label=Ativar
ResourceLifecycleEnv.OnEnable.Tooltip=Off\: sem verificação; adverte\: log/dialog sobre falha; execute\: falha em habilitar o ambiente. O padrão depende do propósito (Produção\=enforce, Testing/Acceptance\=warn, off).
ResourceLifecycleEnv.MinMaxMemoryMb.Label=Min memória máxima JVM (MiB)
ResourceLifecycleEnv.MinMaxMemoryMb.Tooltip=Mínimo de Runtime.maxMemory() em mebibytes (capacidade configurado -Xmx), não alocado atualmente.
ResourceLifecycleEnv.MinProcessors.Label=Min núcleos de CPU
ResourceLifecycleEnv.MinProcessors.Tooltip=Mínimo de Runtime.Processors() reportado pela JVM.
ResourceLifecycleEnv.Disk.Label=Pastas locais (min espaço livre)
ResourceLifecycleEnv.Disk.Column.Path=Caminho da pasta
ResourceLifecycleEnv.Disk.Column.MinFreeMb=Min livre (MiB)
ResourceLifecycleEnv.Disk.Button.Browse=Navegue por 2026
ResourceLifecycleEnv.Check.Title=Requisitos de recursos do sistema
ResourceLifecycleEnv.Check.Failed=A verificação de recursos do sistema falhou para o ambiente ''{0}'':\n{1}
ResourceLifecycleEnv.Check.Passed=Requisitos de recursos do sistema satisfeitos para o ambiente.
