ResourceLifecycleEnv.Tab.Title=Recursos do sistema
ResourceLifecycleEnv.Help=Requisitos opcionais verificados quando este ambiente de ciclo de vida é ativado (GUI, hop-run, hop-servidor, \ldots). Deixe os campos vazios para pular a verificação. A memória usa a pilha máxima da JVM. Os caminhos do disco devem ser pastas locais.
ResourceLifecycleEnv.OnEnable.Label=Ativar
ResourceLifecycleEnv.OnEnable.Tooltip=desligado\: sem verificação; aviso\: registro/diálogo sobre a falha; forçar\: falha na habilitação do ambiente. O padrão depende do propósito (Produção\=forçar, Testes/Aceite\=aviso, senão desligado).
ResourceLifecycleEnv.MinMaxMemoryMb.Label=Mínimo de memória máxima JVM (MiB)
ResourceLifecycleEnv.MinMaxMemoryMb.Tooltip=Mínimo de Runtime.maxMemory() em mebibytes (capacidade configurada -Xmx), não alocado atualmente.
ResourceLifecycleEnv.MinProcessors.Label=Mínimo de núcleos de CPU
ResourceLifecycleEnv.MinProcessors.Tooltip=Mínimo de Runtime.Processors() reportado pela JVM.
ResourceLifecycleEnv.Disk.Label=Pastas locais (Mínimo de espaço livre)
ResourceLifecycleEnv.Disk.Column.Path=Caminho da pasta
ResourceLifecycleEnv.Disk.Column.MinFreeMb=Mínimo livre (MiB)
ResourceLifecycleEnv.Disk.Button.Browse=Navegue\u2026
ResourceLifecycleEnv.Check.Title=Requisitos de recursos do sistema
ResourceLifecycleEnv.Check.Failed=A verificação de recursos do sistema falhou para o ambiente ''{0}'':\n{1}
ResourceLifecycleEnv.Check.Passed=Requisitos de recursos do sistema satisfeitos para o ambiente.
