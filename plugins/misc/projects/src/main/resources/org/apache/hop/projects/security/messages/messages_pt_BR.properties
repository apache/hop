ProjectsSecurityTab.Tab.Name=Projetos
ProjectsSecurityTab.Hint=Restrinja quais projetos os usuários autenticados podem abrir na Hop Web. Digitar ''usuário'' combina com um nome de usuário, ''papel'' combina com uma função de Hop (admin, usuário, operador, somente leitura), e ''grupo'' combina com um nome de grupo de container / IdP / LDAP. Administradores de segurança sempre têm acesso a todos os projetos. Sessões sem restrições não são filtradas.
ProjectsSecurityTab.Enabled=Habilite o controle de acesso do projeto.
ProjectsSecurityTab.DefaultAllowAll=Quando nenhuma regra corresponder, permitir todos os projetos (desmarque para negar por padrão)
