# ---------------------------------------------------------------------------
# Accepting a finding on a transform or action
# ---------------------------------------------------------------------------
LintSuppressGuiPlugin.IgnoreTransform.Name=Ignore lint findings...
LintSuppressGuiPlugin.IgnoreTransform.Tooltip=Mark the findings on this transform as expected, so they are no longer reported. The decision is recorded in the project's hop-lint.yml with the reason you give for it.
LintSuppressGuiPlugin.CheckTransform.Name=Check this transform again
LintSuppressGuiPlugin.CheckTransform.Tooltip=Stop ignoring lint findings on this transform and report them again
LintSuppressGuiPlugin.IgnoreAction.Name=Ignore lint findings...
LintSuppressGuiPlugin.IgnoreAction.Tooltip=Mark the findings on this action as expected, so they are no longer reported. The decision is recorded in the project's hop-lint.yml with the reason you give for it.
LintSuppressGuiPlugin.CheckAction.Name=Check this action again
LintSuppressGuiPlugin.CheckAction.Tooltip=Stop ignoring lint findings on this action and report them again

LintSuppressDialog.Shell.Title=Ignore Lint Findings
LintSuppressDialog.Label.Element=Findings on ''{0}'' will no longer be reported. The decision is recorded in the project''s hop-lint.yml.
LintSuppressDialog.Label.Findings=Currently reported:
LintSuppressDialog.NoFindings=Nothing is currently reported here. Anything found later will be ignored as well.
LintSuppressDialog.Scope.AllRules=Ignore every finding on this element, now and later
LintSuppressDialog.Scope.AllRules.ToolTip=Use this for an element that is filled in at runtime, for example by metadata injection: whatever a check reports about it at design time is expected.
LintSuppressDialog.Scope.ListedRules=Ignore only these rules: {0}
LintSuppressDialog.Scope.ListedRules.ToolTip=Keep checking this element, but accept the rules reported right now. A new kind of problem here will still be reported.
LintSuppressDialog.Label.Reason=Reason (required):
LintSuppressDialog.ReasonRequired.Title=Reason Required
LintSuppressDialog.ReasonRequired.Message=Please say why these findings are expected. It is stored with the pipeline or workflow, so whoever reads it next knows this was a decision rather than an oversight.

