# ---------------------------------------------------------------------------
# Configuration perspective
# ---------------------------------------------------------------------------
LinterConfigPlugin.Option.Enabled.Label=Enable Linter
LinterConfigPlugin.Option.Enabled.ToolTip=Enable or disable the Hop Linter globally
LinterConfigPlugin.Option.LintOnEdit.Label=Lint Automatically While Editing
LinterConfigPlugin.Option.LintOnEdit.ToolTip=Re-run lint checks shortly after you change an open pipeline or workflow. When disabled, files are only linted on open, save, or on demand.
LinterConfigPlugin.Option.ShowIndicators.Label=Show Lint Indicators on Canvas
LinterConfigPlugin.Option.ShowIndicators.ToolTip=Show the lint totals overlay (top-left of the canvas) and the severity badges on transforms/actions in open pipeline and workflow editors
LinterConfigPlugin.Option.ShowIgnoredMarkers.Label=Mark Ignored Transforms and Actions
LinterConfigPlugin.Option.ShowIgnoredMarkers.ToolTip=Draw a muted outline on a transform or action whose lint findings have been marked as expected, so the absence of a warning reads as a decision rather than as a check that never ran
LinterConfigPlugin.Option.ConfigFile.Label=Configuration File
LinterConfigPlugin.Option.ConfigFile.ToolTip=Path to hop-lint.yml configuration file (leave empty for project-specific)
LinterConfigPlugin.Option.PreCommit.Label=Block Git Commits on Lint Failures
LinterConfigPlugin.Option.PreCommit.ToolTip=When enabled, lint checks run before Explorer git commits and block the commit if issues are found
LinterConfigPlugin.Option.PreCommitWarnings.Label=Block Commits on Warnings
LinterConfigPlugin.Option.PreCommitWarnings.ToolTip=When enabled, warnings also block commits. When disabled, only errors block commits
LinterConfigPlugin.Option.PreCommitMetadata.Label=Include Metadata in Pre-Commit Checks
LinterConfigPlugin.Option.PreCommitMetadata.ToolTip=Also lint staged metadata files (e.g. metadata/**/*.json) during pre-commit checks
LinterConfigPlugin.Option.PipelineVerify.Label=Include Lint Rules in Pipeline Verify
LinterConfigPlugin.Option.PipelineVerify.ToolTip=Add YAML/custom lint findings to the native pipeline verify Problems tab
LinterConfigPlugin.Option.WorkflowVerify.Label=Include Lint Rules in Workflow Verify
LinterConfigPlugin.Option.WorkflowVerify.ToolTip=Add YAML/custom lint findings to the native workflow verify Problems tab
LinterConfigPlugin.Option.NativeChecks.Label=Include Hop Native Checks in Lint Runs
LinterConfigPlugin.Option.NativeChecks.ToolTip=Also run Hop's built-in pipeline/workflow verify checks during lint project/file scans

