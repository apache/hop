ActionMailValidatorDialog.DefaultSMTPField.Tooltip=Lorsque Apache Hop réalise un contrôle SMTP,\r\nune liste de serveurs mail (exchanger) est extraite depuis\r\nle domaine, ensuite chaque serveur sera interrogé individuellement.\r\nLa quantité de serveurs mail trouvés impacte donc le durée du processus.\r\nSi vous connaissez le serveur à interroger, saisissez le comme serveur défaut SMTP.\r\nApache Hop, uniquement ce serveur sera interrogé.
