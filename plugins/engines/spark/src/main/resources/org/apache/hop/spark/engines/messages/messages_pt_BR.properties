SparkEngine.LoadTemplate.Label=Carregar modelo de configuração
SparkEngine.LoadTemplate.ToolTip=Preencha os campos de mestre, memória e configuração do Spark de um modelo de implantação comum (local, cluster, Databricks, ...)
SparkEngine.LoadTemplate.Dialog.Title=Carregar modelo de configuração do Spark
SparkEngine.LoadTemplate.Dialog.Message=Escolha um modelo. Valores substituem as opções atuais do motor (você pode editá-las depois).
SparkEngine.LoadTemplate.Confirm.Title=Substituir configuração?
SparkEngine.LoadTemplate.Confirm.Message=Substituir as opções atuais do Native Spark com o modelo "0"?
SparkEngine.OptionsMaster.Label=Mestre das faíscas.
SparkEngine.OptionsMaster.ToolTip=URL mestre do Spark, por exemplo, local, local, ou centelha: 7077. Deixe vazio sob centelha para que o mestre da CLI seja usado.
SparkEngine.OptionsAppName.Label=Nome do aplicativo
SparkEngine.OptionsAppName.ToolTip=Nome do aplicativo Spark
SparkEngine.OptionsFatJar.Label=Localização do arquivo do jarro gordo
SparkEngine.OptionsFatJar.ToolTip=Caminho opcional para uma jarra de gordura de Hop encenada em executores para corridas de cluster. Deixe vazio para uma centelha pura com uma jarra de gordura nativa.
SparkEngine.OptionsConfigs.Label=Configuração do Spark (linhas chave=valor)
SparkEngine.OptionsConfigs.ToolTip=Outras entradas SparkConf, uma chave = valor por linha
SparkEngine.OptionsDriverMemory.Label=Memória do motorista
SparkEngine.OptionsDriverMemory.ToolTip=Spark.driver.memory, por exemplo, 2g.
SparkEngine.OptionsExecutorMemory.Label=Memória do executor
SparkEngine.OptionsExecutorMemory.ToolTip=Spark.executor.memória, por exemplo, 2g.
SparkEngine.OptionsExecutorCores.Label=Núcleos de execução
SparkEngine.OptionsExecutorCores.ToolTip=Spark.executor.cores
SparkEngine.OptionsTempLocation.Label=Localização da temperatura
SparkEngine.OptionsTempLocation.ToolTip=Diretório de arquivos temporários
SparkEngine.OptionsPluginsToStage.Label=Plugins para o palco
SparkEngine.OptionsPluginsToStage.ToolTip=Pastas de plugins opcionais separadas por vírgula para o palco no cluster
SparkEngine.OptionsPathSchemeMap.Label=Mapa do esquema do caminho (de=para linhas)
SparkEngine.OptionsPathSchemeMap.ToolTip=Opcional esquema URI reescrever para Spark File / Lake PATH apenas (não clássico Hop VFS). Um de=para por linha, por exemplo, s3=s3a ou minio=s3a. Os comentários começam com #. Ainda configure Spark.hadoop.fs.s3a.* (ou outros FS) para o esquema alvo.
SparkEngine.OptionsGenericRunMode.Label=Modo de execução de transformação genérica
SparkEngine.OptionsGenericRunMode.ToolTip=O padrão para o Hop transforma-se em mapPartitions. Fãs distribuídas em divisórias Spark. DRIVER ONLY roda a mini-pipeline uma vez no driver Spark para que fluxos de trabalho aninhados não executem em múltiplos nós. Substituir por transformação com a ação de contexto "Modo de Execução de Parque".
