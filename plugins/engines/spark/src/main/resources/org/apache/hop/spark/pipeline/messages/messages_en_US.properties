SparkTransformPlan.AddSequence.CounterTransform=It reads its counter settings from a transform: every partition keeps a counter of its own, so the values are not unique.
SparkTransformPlan.AddSequence.Database=It takes its values from a database sequence.
SparkTransformPlan.Chain=Chain: {0}.
SparkTransformPlan.GroupBy.ByGroup=Spark puts the rows of every group on one partition, in their order, and Hop''s Group by aggregates each partition.
SparkTransformPlan.GroupBy.OnePartition=Without grouping fields, or when it always gives back a result row, all rows go to one partition.
SparkTransformPlan.RunMode.Driver=The run configuration runs Hop transforms on the driver.
SparkTransformPlan.RunMode.Transform=Spark Run Mode of the transform: {0}.
SparkTransformPlan.TableInput.NotPartitioned=Only a plain partitioned read runs as Spark code: all four partition options set, and no rows coming in, no parameters in the SQL, no specified fields and no row limit.
SparkTransformPlan.UniqueRowsByHashSet.ByKey=Spark puts the rows with the same compare fields on one partition, in their order, and Hop''s transform removes the duplicates on each partition.
