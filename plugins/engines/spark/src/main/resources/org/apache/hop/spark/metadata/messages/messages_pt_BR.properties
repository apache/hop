SparkCatalog.Name=Catálogo Spark
SparkCatalog.Description=Catálogo Spark SQL para formatos de tabela abertos.
SparkCatalog.Name.Label=Nome
SparkCatalog.CatalogName.Label=Nome do catálogo Spark
SparkCatalog.CatalogName.Tooltip=Nome usado em Spark.sql.catalog. Deve corresponder à primeira parte dos identificadores da tabela.
SparkCatalog.CatalogType.Label=Tipo de catálogo
SparkCatalog.CatalogType.Tooltip=Hadoop (warehouse), descanso (uri), personalizado (implementação), ou colmeia/cola avançada via conf extra
SparkCatalog.Implementation.Label=Classe de implementação
SparkCatalog.Implementation.Tooltip=Nome de classe completo (padrão org.apache.iceberg.spark.SparkCatalog). Preciso de um tipo personalizado.
SparkCatalog.Warehouse.Label=Depósito
SparkCatalog.Warehouse.Tooltip=Caminho do armazém/URI (tipo hadoop; arquivo:// ou s3a://...)
SparkCatalog.Uri.Label=URI.
SparkCatalog.Uri.Tooltip=Ponto final do catálogo REST (ou URI para colmeia avançada)
SparkCatalog.Credential.Label=Credencial / token
SparkCatalog.Credential.Tooltip=Segredo opcional (campo de palavras-passe). Não está registrado. Para os catálogos REST este mapa para centelhar.Sql.catalog.
SparkCatalog.ConfExtra.Label=Conf extra (linhas chave=valor)
SparkCatalog.ConfExtra.Tooltip=Uma chave = valor por linha (# comentários permitidos). Chaves curtas se tornam centelha.Sql.catalog. Trate como sensível se as fichas estiverem incluídas.
SparkCatalog.LoadTemplate.Label=Carregar modelo de catálogo
SparkCatalog.LoadTemplate.ToolTip=Preencha o formulário de um cenário de catálogo chamado (Iceberg Hadoop/REST, Colmeia, Cola, \u2026). Substitua os placeholders pelo seu ambiente.
SparkCatalog.LoadTemplate.Dialog.Title=Carregar modelo de catálogo
SparkCatalog.LoadTemplate.Dialog.Message=Escolha um cenário de catálogo. As pessoas devem ser ajustadas para o seu ambiente.
SparkCatalog.LoadTemplate.Confirm.Title=Substituir configurações de catálogo?
SparkCatalog.LoadTemplate.Confirm.Message=Substituir os campos do catálogo atual por modelo "0"?
