SparkEngine.LoadTemplate.Label=Load configuration template
SparkEngine.TestConfiguration.Label=Test configuration
SparkEngine.TestConfiguration.ToolTip=Checks this configuration from the Hop machine for its cluster type: the settings, the files and folders it uses, and the cluster it points to. Nothing is submitted to the cluster. Every failure says how to fix it.
SparkEngine.TestConfigurationWithJob.Label=Test with a test job
SparkEngine.TestConfigurationWithJob.ToolTip=Runs the checks of Test configuration, and then a small pipeline on the cluster with this configuration: 1000 rows through a Hop transform on the executors. It passes when the run finishes and, in client mode, its row counts come back to Hop. It uses the cluster for a moment.
SparkEngine.LoadTemplate.ToolTip=Fill master, memory, and Spark config fields from a common deployment template (local, cluster, Databricks, …)
SparkEngine.LoadTemplate.Dialog.Title=Load Spark configuration template
SparkEngine.LoadTemplate.Dialog.Message=Choose a template. Values replace the current engine options (you can edit them afterward).
SparkEngine.LoadTemplate.Confirm.Title=Replace configuration?
SparkEngine.LoadTemplate.Confirm.Message=Replace the current Native Spark options with template "{0}"?

SparkEngine.Group.General=General
SparkEngine.Group.Cluster=Cluster
SparkEngine.Group.Resources=Resources
SparkEngine.Group.HopOnSpark=Hop on Spark
SparkEngine.Group.SparkSettings=Spark settings
SparkEngine.OptionsSparkSettings.Label=Spark settings
SparkEngine.OptionsSparkSettings.ToolTip=Spark settings for the session and the job, as spark-submit --conf takes them: a key that starts with spark. and its value. The key list suggests common settings for the cluster type; any other Spark setting can be typed. Hadoop settings go in as spark.hadoop.<key>.
SparkEngine.SparkSetting.Key.Label=Key
SparkEngine.SparkSetting.Key.ToolTip=A Spark setting, for example spark.sql.shuffle.partitions
SparkEngine.SparkSetting.Value.Label=Value
SparkEngine.SparkSetting.Value.ToolTip=The value of the setting; variables can be used
SparkEngine.OptionsPathSchemes.Label=Path scheme map
SparkEngine.PathScheme.From.Label=From scheme
SparkEngine.PathScheme.From.ToolTip=The scheme of a path in a Spark File or Lake Table transform, for example minio
SparkEngine.PathScheme.To.Label=To scheme
SparkEngine.PathScheme.To.ToolTip=The scheme Spark reads it with, for example s3a
SparkEngine.OptionsMaster.Label=Spark master
SparkEngine.OptionsMaster.ToolTip=Spark master URL, e.g. local[*], local[4], or spark://host:7077. Leave empty under spark-submit so the CLI master is used.
SparkEngine.OptionsAppName.Label=Application name
SparkEngine.OptionsAppName.ToolTip=Spark application name
SparkEngine.OptionsFatJar.Label=Fat jar file location
SparkEngine.OptionsFatJar.ToolTip=Optional Hop fat jar that the executors load. Leave empty to let Hop build it: for a cluster master (anything but local or local[n]) the engine ships a native-provided fat jar of this installation, built once and cached in the folder set by '${HOP_FAT_JAR_CACHE_FOLDER}' (default: .hop/fat-jars in your home folder). Under spark-submit the application jar is used.
SparkEngine.OptionsHadoopConfDir.Label=Hadoop configuration folder
SparkEngine.OptionsHadoopConfDir.ToolTip=Folder with core-site.xml, hdfs-site.xml and yarn-site.xml for runs that Hop starts itself (Hop GUI, hop-run, Hop Server). Empty: for a YARN master, '${HADOOP_CONF_DIR}' and '${YARN_CONF_DIR}' are used. Not used under spark-submit.
SparkEngine.OptionsDriverMemory.Label=Driver memory
SparkEngine.OptionsDriverMemory.ToolTip=spark.driver.memory, e.g. 2g
SparkEngine.OptionsExecutorMemory.Label=Executor memory
SparkEngine.OptionsExecutorMemory.ToolTip=spark.executor.memory, e.g. 2g
SparkEngine.OptionsExecutorCores.Label=Executor cores
SparkEngine.OptionsExecutorCores.ToolTip=spark.executor.cores
SparkEngine.OptionsPathSchemeMap.ToolTip=URI schemes the Spark File and Lake Table transforms rewrite before Spark reads or writes the path, for example minio to s3a or s3 to s3a. Classic Hop transforms keep using Hop's file systems. Configure the file system of the target scheme as well, for example spark.hadoop.fs.s3a.* in the Spark settings.
SparkEngine.OptionsGenericRunMode.Label=Generic transform run mode
SparkEngine.OptionsGenericRunMode.ToolTip=Default for Hop transforms that run as mapPartitions (Workflow Executor, most classic transforms). DISTRIBUTED fans out across Spark partitions. DRIVER_ONLY runs the mini-pipeline once on the Spark driver so nested workflows do not execute on multiple nodes. Override per transform with the "Spark Run Mode" context action.
SparkClusterType.LOCAL=Local: Spark in this Hop process
SparkClusterType.STANDALONE=Spark standalone cluster
SparkClusterType.YARN=Hadoop YARN
SparkClusterType.KUBERNETES=Kubernetes
SparkClusterType.SUBMITTED=spark-submit: you start the pipeline with spark-submit, which sets the master
SparkClusterType.DATABRICKS=Databricks: the pipeline runs on a Databricks cluster
SparkEngine.OptionsClusterType.Label=Cluster type
SparkEngine.OptionsClusterType.ToolTip=Where the pipeline runs. It decides which options apply and which checks the test runs. Changing it fills in a Spark master of that type when the current one is of another type. A run configuration saved before this option takes its type from the Spark master.
SparkDeployMode.CLIENT=Client: this Hop process is the driver
SparkDeployMode.CLUSTER=Cluster: submit the driver to the cluster
SparkEngine.OptionsDeployMode.Label=Deploy mode
SparkEngine.OptionsDeployMode.ToolTip=Client: Hop GUI, hop-run or Hop Server is the Spark driver and the executors fetch the fat jar and the project from it. Cluster: Hop stages the fat jar and the project package in the staging folder, submits the driver to the cluster and waits for it to finish. Stop kills the driver. Cluster mode needs a project, and a standalone master with the REST submission server enabled (spark.master.rest.enabled=true) YARN with the Hadoop configuration folder set, or Kubernetes (k8s://https://<api server>) with spark.kubernetes.container.image set.
SparkEngine.OptionsStagingFolder.Label=Staging folder
SparkEngine.OptionsStagingFolder.ToolTip=Folder that Hop uploads the fat jar to, and in cluster mode the project package, as a Hop VFS location: a named MinIO, S3, Azure or Google connection, HDFS or a shared file system path. Files are named after their content, so an unchanged fat jar is not uploaded again. In client mode the executors then read the fat jar from this folder instead of downloading it from Hop in every run; leave it empty to send the fat jar from Hop. Only the people and the cluster that run your pipelines should be able to read it: the project package holds the project metadata and the variables of the run, passwords included, encoded the way Hop stores them.
SparkEngine.OptionsStagingClusterUrl.Label=Staging folder URL for the cluster
SparkEngine.OptionsStagingClusterUrl.ToolTip=The staging folder as the Spark cluster reads it, when that differs from the Hop location. For example 'http://minio:9000/hop-staging' or 's3a://hop-staging' for the Hop location 'minio://hop-staging'. When every Spark worker mounts the staging folder, use 'local:' and the path on the workers, for example 'local:/data/staging': Spark then uses the fat jar where it is, without a download and a copy for every executor. Leave empty when the cluster reads the same URL.
SparkEngine.OptionsSubmitUrl.Label=Submit URL (standalone cluster mode)
SparkEngine.OptionsSubmitUrl.ToolTip=REST submission endpoint of a standalone Spark master; not used on YARN. Leave empty to use port 6066 of the host in the Spark master URL, for example 'http://spark:6066' for 'spark://spark:7077'.
SparkEngine.OptionsDatabricksConnection.Label=Databricks connection
SparkEngine.OptionsDatabricksConnection.ToolTip=The Databricks connection (workspace URL and access token) that Hop submits the run with and uploads the fat jar and the project package through. Needs the Databricks plugin.
SparkEngine.OptionsDatabricksCompute.Label=Databricks compute
SparkEngine.OptionsDatabricksCompute.ToolTip=The id of an all-purpose cluster in Dedicated access mode, or new_cluster for a job cluster that Databricks creates for the run and removes afterwards. Standard (shared) access mode and serverless compute run Spark Connect, which the native Spark engine does not support.
SparkEngine.OptionsDatabricksRuntime.Label=Job cluster runtime
SparkEngine.OptionsDatabricksRuntime.ToolTip=new_cluster only: the Databricks Runtime of the job cluster, for example 18.x-scala2.13 (Spark 4.1, Java 21). Empty uses the default of the Databricks plugin.
SparkEngine.OptionsDatabricksNodeType.Label=Job cluster node type
SparkEngine.OptionsDatabricksNodeType.ToolTip=new_cluster only: the node type of the job cluster, for example Standard_D4ds_v5 on Azure or i3.xlarge on AWS. Empty uses the default of the Databricks plugin, an AWS node type.
SparkEngine.OptionsDatabricksWorkers.Label=Job cluster workers
SparkEngine.OptionsDatabricksWorkers.ToolTip=new_cluster only: the number of workers of the job cluster. Empty is 1.
