SparkPackageConfigDialog.ExcludeDirs.Label=Diretórios de exclusão extra
SparkPackageConfigDialog.ExcludeDirs.Tooltip=Uma base de diretório por linha (por exemplo, tmp, screenshots). Merged com inclusos exclui, a menos que substituam os padrões.
SparkPackageConfigDialog.ExcludeGlobs.Label=Excluir os globos
SparkPackageConfigDialog.ExcludeGlobs.Tooltip=Um globo por linha, relativo à casa do projeto (por exemplo, **/*.jar ou mapeamentos/large/**).
SparkPackageConfigDialog.IncludePaths.Label=Caminhos de inclusão de força
SparkPackageConfigDialog.IncludePaths.Tooltip=Um caminho relativo por linha para incluir mesmo sob um diretório ignorado (por exemplo, trabalho/cluster-env.json).
