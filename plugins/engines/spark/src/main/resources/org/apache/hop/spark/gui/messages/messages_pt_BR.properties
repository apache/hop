SparkGuiPlugin.Menu.SparkPackageConfig.Text=Editar filtros de pacotes Native Spark...
SparkGuiPlugin.Menu.ExportSparkProjectPackage.Text=Exportar pacote de projeto para Native Spark...
SparkGuiPlugin.ExportSparkProject.Dialog.Header=Exportação para a execução do Native Spark
SparkGuiPlugin.ExportSparkProject.Dialog.Message1=Isto constrói um pacote de projeto zip especificamente para executar condutos no motor Native Spark (MainSpark --HopProjectPackage).
SparkGuiPlugin.ExportSparkProject.Dialog.Message2=Inclui arquivos de definição de projeto (pipelines, fluxos de trabalho, recursos pequenos sob projeto /) mais metadados. Json. Os padrões ignoram o trabalho/, os conjuntos de dados/, o alvo/, e outras dirs de volume/IDE (configurado via Ferramentas → Editar filtros de pacote Native Spark / centelha-pacote.json). Este não é o mesmo que File → Exportar projeto atual para zip ou .gitignore.
SparkGuiPlugin.ExportSparkProject.Dialog.Message3=Em Databricks, pacotes sob /Volumes são compartilhados sem SparkFiles; em outro lugar, o zip é distribuído por caminhos simples de Mapeamento e Execução Pipeline sob resolução ${PROJECT HOME}. Use variáveis separadas (HOP DATA / s3a://...) para os caminhos de dados do arquivo Spark — não PROJECT HOME.
SparkPackageConfigDialog.Shell.Title=Native Spark, filtros de pacotes.
SparkPackageConfigDialog.Intro=Configure quais arquivos de projeto estão incluídos ao exportar um pacote de projeto Native Spark (Ferramentas → Exportar pacote de projeto, Databricks Implantar e executar, hop-conf). Salvo como pacote de faíscas. Json na casa do projeto. Não é o mesmo que .gitignore.
SparkPackageConfigDialog.ProjectHome.Label=Projeto lar
