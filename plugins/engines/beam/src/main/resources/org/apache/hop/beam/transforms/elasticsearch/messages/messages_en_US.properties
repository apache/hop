BeamElasticsearchInput.Name=Beam Elasticsearch input
BeamElasticsearchInput.Description=Read JSON documents with the Beam Elasticsearch bounded scroll source
BeamElasticsearchOutput.Name=Beam Elasticsearch output
BeamElasticsearchOutput.Description=Write JSON documents with the Beam Elasticsearch bulk sink
BeamElasticsearch.keyword=Beam,Elastic,Elasticsearch,JSON
BeamElasticsearch.Connection.Group=Connection
BeamElasticsearch.Documents.Group=Documents
BeamElasticsearch.hosts.Label=Hosts
BeamElasticsearch.hosts.Tooltip=Comma-separated HTTP(S) origins, for example https://host:9200. Variables such as '${ES_HOSTS}' are supported.
BeamElasticsearch.index.Label=Index
BeamElasticsearch.index.Tooltip=Index name. Use an existing readable index for input and a writable index for output.
BeamElasticsearch.documentType.Label=Document type (legacy)
BeamElasticsearch.documentType.Tooltip=Optional legacy document type for Elasticsearch 5/6. Leave blank for typeless indices on Elasticsearch 7 and later.
BeamElasticsearch.username.Label=Username
BeamElasticsearch.username.Tooltip=Optional basic authentication username. Both username and password are required when authenticating.
BeamElasticsearch.password.Label=Password
BeamElasticsearch.password.Tooltip=Optional basic authentication password. Stored encrypted using Hop password conventions. Use HTTPS.
BeamElasticsearch.jsonField.Label=JSON field
BeamElasticsearch.jsonField.Tooltip=Input: name of the output String field. Output: incoming String field containing one JSON document object.
BeamElasticsearch.query.Label=Query JSON
BeamElasticsearch.query.Tooltip=Optional JSON request body, for example '{"query":{"match_all":{}}}'. Leave blank to read all documents.
BeamElasticsearch.scrollKeepalive.Label=Scroll keepalive
BeamElasticsearch.scrollKeepalive.Tooltip=Positive scroll context duration, for example 5m. Default: 5m.
BeamElasticsearch.maxBatchSize.Label=Maximum documents per batch
BeamElasticsearch.maxBatchSize.Tooltip=Positive maximum number of documents per bulk request. Default: 1000. Beam may send smaller batches.
BeamElasticsearch.maxBatchBytes.Label=Maximum batch bytes
BeamElasticsearch.maxBatchBytes.Tooltip=Positive maximum bulk batch bytes. Default: 5242880. A single oversized document can exceed this target.
