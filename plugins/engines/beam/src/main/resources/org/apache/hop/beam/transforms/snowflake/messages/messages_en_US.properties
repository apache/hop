BeamSnowflakeInputDialog.Title=Beam Snowflake input
BeamSnowflakeOutputDialog.Title=Beam Snowflake output
BeamSnowflakeInputMeta.Description=Read a Snowflake table or query through a GCS COPY
BeamSnowflakeOutputMeta.Description=Write a bounded collection to Snowflake through a GCS COPY
BeamSnowflakeInput.keyword=beam,snowflake,copy,gcs,input
BeamSnowflakeOutput.keyword=beam,snowflake,copy,gcs,output
BeamSnowflakeInput.ConfigurationValid=Snowflake configuration is valid
BeamSnowflakeOutput.ConfigurationValid=Snowflake configuration is valid
BeamSnowflake.Connection.Group=Connection
BeamSnowflake.Staging.Group=Staging
BeamSnowflakeInput.Read.Group=Read
BeamSnowflakeInput.Fields.Group=Fields
BeamSnowflakeOutput.Write.Group=Write
BeamSnowflakeInput.Fields.Column.Name=Name
BeamSnowflakeInput.Fields.Column.Type=Type
BeamSnowflake.serverName.Label=Server
BeamSnowflake.serverName.Tooltip=Account host, for example account.snowflakecomputing.com. Variables such as '${SNOWFLAKE_SERVER}' are supported.
BeamSnowflake.username.Label=Username
BeamSnowflake.username.Tooltip=Snowflake user. Required for password and key-pair authentication.
BeamSnowflake.password.Label=Password
BeamSnowflake.password.Tooltip=Password used when no private key is set. Stored with Hop password encryption. Prefer a variable such as '${SNOWFLAKE_PASSWORD}'.
BeamSnowflake.privateKey.Label=Private key
BeamSnowflake.privateKey.Tooltip=PEM private key. When this is set, the password is not sent. Prefer a variable such as '${SNOWFLAKE_PRIVATE_KEY}'.
BeamSnowflake.privateKeyPassphrase.Label=Private key passphrase
BeamSnowflake.privateKeyPassphrase.Tooltip=Optional passphrase for the private key. Prefer a variable such as '${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}'.
BeamSnowflake.database.Label=Database
BeamSnowflake.database.Tooltip=Optional database identifier.
BeamSnowflake.warehouse.Label=Warehouse
BeamSnowflake.warehouse.Tooltip=Optional warehouse identifier.
BeamSnowflake.schema.Label=Schema
BeamSnowflake.schema.Tooltip=Optional schema identifier.
BeamSnowflake.role.Label=Role
BeamSnowflake.role.Tooltip=Optional role identifier.
BeamSnowflake.port.Label=Port
BeamSnowflake.port.Tooltip=Optional port from 1 to 65535. Empty uses the Snowflake driver default.
BeamSnowflake.stagingBucket.Label=Staging bucket
BeamSnowflake.stagingBucket.Tooltip=GCS path used as the external stage. It must start with gs:// and end with /. Example '${SNOWFLAKE_STAGE}'.
BeamSnowflake.storageIntegration.Label=Storage integration
BeamSnowflake.storageIntegration.Tooltip=Snowflake storage integration name that can read and write the staging bucket.
BeamSnowflake.quotationMark.Label=Quotation mark
BeamSnowflake.quotationMark.Tooltip=One CSV quotation character. Empty uses the Beam default apostrophe. A backslash or whitespace is not accepted.
BeamSnowflakeInput.tableName.Label=Table
BeamSnowflakeInput.tableName.Tooltip=Table to COPY, as name, schema.name, or database.schema.name. Leave empty when a query is set.
BeamSnowflakeInput.query.Label=Query
BeamSnowflakeInput.query.Tooltip=SQL sent to Snowflake as written. Leave empty when a table is set. Do not set both.
BeamSnowflakeOutput.tableName.Label=Table
BeamSnowflakeOutput.tableName.Tooltip=Destination table, as name, schema.name, or database.schema.name.
BeamSnowflakeOutput.writeDisposition.Label=Write disposition
BeamSnowflakeOutput.writeDisposition.Tooltip=APPEND, TRUNCATE, or EMPTY. The default is APPEND.
BeamSnowflakeOutput.createDisposition.Label=Create disposition
BeamSnowflakeOutput.createDisposition.Tooltip=CREATE_NEVER or CREATE_IF_NEEDED. The default is CREATE_NEVER. A column list is sent only when creating the table.
