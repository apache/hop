BeamMqttInputDialog.Title=Beam MQTT input
BeamMqttOutputDialog.Title=Beam MQTT output
BeamMqttInputMeta.Description=Read MQTT payloads using Apache Beam
BeamMqttOutputMeta.Description=Publish MQTT payloads using Apache Beam
BeamMqttMeta.keyword=beam,mqtt,input,output,iot
BeamMqttMeta.ConfigurationValid=MQTT configuration is valid
BeamMqttMeta.Connection=Connection
BeamMqttMeta.Payload=Payload
BeamMqttMeta.Limits=Limits
BeamMqttMeta.serverUri.Label=Server URI
BeamMqttMeta.serverUri.Tooltip=MQTT broker URI, tcp://host:1883 or ssl://host:8883. Use TLS for credentials.
BeamMqttMeta.topic.Label=Topic
BeamMqttMeta.topic.Tooltip=Subscription filter for input or a fixed publish topic for output. Variables are supported.
BeamMqttMeta.clientId.Label=Client ID prefix
BeamMqttMeta.clientId.Tooltip=Optional client ID prefix. Beam adds a unique suffix and truncates the ID to 23 characters.
BeamMqttMeta.username.Label=Username
BeamMqttMeta.username.Tooltip=Optional broker username. Variables are supported.
BeamMqttMeta.password.Label=Password
BeamMqttMeta.password.Tooltip=Optional broker password, stored with Hop password encryption. Prefer a secret variable such as '${MQTT_PASSWORD}'.
BeamMqttMeta.payloadField.Label=Payload field
BeamMqttMeta.payloadField.Tooltip=Output field name for input, or the incoming field containing the payload for output.
BeamMqttMeta.payloadType.Label=Payload type
BeamMqttMeta.payloadType.Tooltip=String decodes or encodes UTF-8. Binary preserves the bytes without text conversion.
BeamMqttMeta.maxNumRecords.Label=Maximum records
BeamMqttMeta.maxNumRecords.Tooltip=Maximum source records. Zero or empty means unlimited. Variables are supported.
BeamMqttMeta.maxReadTime.Label=Maximum read time (seconds)
BeamMqttMeta.maxReadTime.Tooltip=Maximum source read duration in seconds. Zero or empty means unlimited. Variables are supported.
BeamMqttMeta.retained.Label=Retain messages
BeamMqttMeta.retained.Tooltip=Publish with the MQTT retained flag. Beam uses QoS 1 (at least once).
