BeamEnginesSpark.OptionsAppName.Label=Nome da aplicação
BeamEnginesSpark.OptionsAppName.ToolTip=Define o nome do aplicativo Spark
BeamEnginesSpark.OptionsBatchIntervalMillis.Label=Streaming: intervalo de lote (ms)
BeamEnginesSpark.OptionsBatchIntervalMillis.ToolTip=Intervalo de lote para streaming do Spark em milissegundos.
BeamEnginesSpark.OptionsBlobStorageAccount.Label=Conta de Armazenamento de Blobs do Azure
BeamEnginesSpark.OptionsBlobStorageAccount.ToolTip=Nome da conta de armazenamento de Blobs do Azure
BeamEnginesSpark.OptionsBlobStorageEndpoint.Label=Endpoint de armazenamento de Blobs do Azure
BeamEnginesSpark.OptionsBlobStorageEndpoint.ToolTip=Formato do Azure Blob storage endpoint https://<STORAGE ACCOUNT>.blob.core.windows.net/
BeamEnginesSpark.OptionsBlobStorageKey.Label=Chave de armazenamento do Blob Storage do Azure
BeamEnginesSpark.OptionsBlobStorageKey.ToolTip=Chave de armazenamento de Blobs do Azure
BeamEnginesSpark.OptionsBundleSize.Label=Tamanho do pacote
BeamEnginesSpark.OptionsBundleSize.ToolTip=Se definido, bundleSize será usado para dividir fontes limitadas, caso contrário, o padrão será dividir fontes limitadas no Spark defaultParallelism. Mais eficaz quando usado com Spark dynamicAllocation.
BeamEnginesSpark.OptionsCheckpointDir.Label=Streaming: diretório de ponto de verificação
BeamEnginesSpark.OptionsCheckpointDir.ToolTip=Um diretório de ponto de verificação para resiliência de streaming, ignorado em lote. Para durabilidade, é necessário um sistema de arquivos confiável como HDFS/S3/GS.
BeamEnginesSpark.OptionsCheckpointDurationMillis.Label=Streaming: duração do ponto de verificação (ms)
BeamEnginesSpark.OptionsCheckpointDurationMillis.ToolTip=O período até o ponto de verificação (em milissegundos). Se não for definido, o Spark terá como padrão Max(slideDuration, Seconds(10)). Este padrão PipelineOptions (-1) terminará com o padrão Spark descrito.
BeamEnginesSpark.OptionsEnableSparkMetricSinks.Label=Ativar coletor de métricas
BeamEnginesSpark.OptionsEnableSparkMetricSinks.ToolTip=Habilitar/desabilitar o envio de valores agregadores para coletores de métricas do Spark
BeamEnginesSpark.OptionsMaster.Label=O Master do Spark
BeamEnginesSpark.OptionsMaster.ToolTip=A URL do spark master ao qual se conectar (por exemplo, spark://host:port, local[4]).
BeamEnginesSpark.OptionsMaxRecordsPerBatch.Label=Streaming: máximo de registros por lote
BeamEnginesSpark.OptionsMaxRecordsPerBatch.ToolTip=Máximo de registros por microlote. Apenas para fontes de streaming.
BeamEnginesSpark.OptionsMinReadTimeMillis.Label=Streaming: tempo mínimo de leitura (ms)
BeamEnginesSpark.OptionsMinReadTimeMillis.ToolTip=Tempo mínimo para gastar na leitura, para cada microlote.
BeamEnginesSpark.OptionsReadTimePercentage.Label=Streaming: porcentagem de tempo de leitura
BeamEnginesSpark.OptionsReadTimePercentage.ToolTip=Um valor entre 0 e 1 para descrever a porcentagem de um microlote dedicado à leitura da Fonte ilimitada.
