BeamDebeziumInput.Check.Valid=Debezium source configuration is valid (database connectivity is not checked)
BeamDebeziumInput.Check.NoIncoming=This source transform does not accept incoming hops
BeamDebeziumInput.Name=Beam Debezium input
BeamDebeziumInput.Description=Read database change events with Apache Beam DebeziumIO
BeamDebeziumInput.Keywords=beam,debezium,cdc,change,data,capture,postgresql
BeamDebeziumInput.Connection.Group=Connection
BeamDebeziumInput.Properties.Group=Connector properties
BeamDebeziumInput.Output.Group=Output and limits
BeamDebeziumInput.Connector.Label=Connector
BeamDebeziumInput.Connector.Tooltip=PostgreSQL is bundled. Custom requires compatible user-supplied connector and driver jars.
BeamDebeziumInput.ConnectorClass.Label=Custom connector class
BeamDebeziumInput.ConnectorClass.Tooltip=Fully qualified Kafka Connect SourceConnector class; used only for Custom.
BeamDebeziumInput.Hostname.Label=Hostname
BeamDebeziumInput.Hostname.Tooltip=Database host. Variables such as '${CDC_HOST}' are supported.
BeamDebeziumInput.Port.Label=Port
BeamDebeziumInput.Port.Tooltip=Database TCP port, between 1 and 65535.
BeamDebeziumInput.Username.Label=Username
BeamDebeziumInput.Username.Tooltip=Database account with the required CDC/replication privileges.
BeamDebeziumInput.Password.Label=Password
BeamDebeziumInput.Password.Tooltip=Database password. Use a secret variable such as '${CDC_PASSWORD}'; literal passwords use Hop encryption when saved.
BeamDebeziumInput.Properties.Label=Connector properties (JSON)
BeamDebeziumInput.Properties.Tooltip=JSON object with string values. Variables such as '${CDC_DATABASE}' are supported. Use variables for secrets; this JSON is not encrypted.
BeamDebeziumInput.JsonField.Label=JSON field
BeamDebeziumInput.JsonField.Tooltip=Name of the single String field containing the Beam Debezium JSON event.
BeamDebeziumInput.MaxRecords.Label=Maximum records
BeamDebeziumInput.MaxRecords.Tooltip=Optional positive record limit. Blank reads continuously. Does not change the Beam source to bounded.
BeamDebeziumInput.MaxTime.Label=Maximum run time (ms)
BeamDebeziumInput.MaxTime.Tooltip=Optional positive runtime limit for tests. Checked between polls; not a hard deadline. Blank reads continuously.
BeamDebeziumInput.PollingTimeout.Label=Polling timeout (ms)
BeamDebeziumInput.PollingTimeout.Tooltip=Positive polling timeout; default 1000 milliseconds.
