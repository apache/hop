BeamSplunkOutputDialog.Title=Beam Splunk output
BeamSplunkOutputMeta.Description=Publish events to Splunk HEC using Apache Beam
BeamSplunkOutput.keyword=beam,splunk,hec,output
BeamSplunkOutput.ConfigurationValid=Splunk configuration is valid
BeamSplunkOutput.Connection.Group=Connection
BeamSplunkOutput.Event.Group=Event
BeamSplunkOutput.hecUrl.Label=HEC URL
BeamSplunkOutput.hecUrl.Tooltip=HTTP Event Collector base URL, http://host:8088 or https://host:8088. No path, user or query. Variables are supported.
BeamSplunkOutput.token.Label=HEC token
BeamSplunkOutput.token.Tooltip=Splunk HEC token, stored with Hop password encryption. Prefer a secret variable such as '${SPLUNK_HEC_TOKEN}'.
BeamSplunkOutput.batchCount.Label=Batch count
BeamSplunkOutput.batchCount.Tooltip=Events per HTTP request. Empty uses the Beam default of 10, flushed on a 2 second timer. Variables are supported.
BeamSplunkOutput.rootCa.Label=Root CA certificate
BeamSplunkOutput.rootCa.Tooltip=Optional PEM path used when certificate validation stays enabled. A gs:// path needs the Beam GCS filesystem. Variables are supported.
BeamSplunkOutput.disableCertificateValidation.Label=Disable certificate validation
BeamSplunkOutput.disableCertificateValidation.Tooltip=Leave unchecked. HTTPS validates the server certificate unless this is enabled.
BeamSplunkOutput.enableGzip.Label=Gzip HTTP body
BeamSplunkOutput.enableGzip.Tooltip=Compress the HEC request body. This is the Beam default.
BeamSplunkOutput.eventField.Label=Event field
BeamSplunkOutput.eventField.Tooltip=Incoming field whose string value is the HEC event body.
BeamSplunkOutput.index.Label=Index
BeamSplunkOutput.index.Tooltip=Optional index sent with every event. Variables are supported.
BeamSplunkOutput.source.Label=Source
BeamSplunkOutput.source.Tooltip=Optional source sent with every event. Variables are supported.
BeamSplunkOutput.sourceType.Label=Source type
BeamSplunkOutput.sourceType.Tooltip=Optional source type sent with every event. Variables are supported.
BeamSplunkOutput.host.Label=Host
BeamSplunkOutput.host.Tooltip=Optional host sent with every event. Variables are supported.
