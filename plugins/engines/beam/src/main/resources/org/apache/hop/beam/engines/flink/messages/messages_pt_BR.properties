BeamEnginesFlink.OptionsAutoWatermarkInterval.Label=Intervalo automático de marca d'água
BeamEnginesFlink.OptionsAutoWatermarkInterval.ToolTip=O intervalo em milissegundos para emissão automática de marca d'água.
BeamEnginesFlink.OptionsCheckpointInterval.Label=Intervalo de verificação
BeamEnginesFlink.OptionsCheckpointInterval.ToolTip=O intervalo em milissegundos no qual acionar pontos de verificação do Pipeline em execução. Padrão: Sem ponto de verificação.
BeamEnginesFlink.OptionsCheckpointMode.Label=Modo de verificação
BeamEnginesFlink.OptionsCheckpointMode.ToolTip=O modo de ponto de verificação que define a garantia de consistência.
BeamEnginesFlink.OptionsCheckpointTimeout.Label=Tempo limite de verificação (ms)
BeamEnginesFlink.OptionsCheckpointTimeout.ToolTip=O tempo máximo em milissegundos que um ponto de verificação pode levar antes de ser descartado.
BeamEnginesFlink.OptionsDisableMetrics.Label=Desabilitar métricas
BeamEnginesFlink.OptionsDisableMetrics.ToolTip=Desativar métricas do Beam no Flink Runner
BeamEnginesFlink.OptionsExecutionModeForBatch.Label=Modo de execução em lote
BeamEnginesFlink.OptionsExecutionModeForBatch.ToolTip=Modo do Flink para troca de dados de Pipelines em lote. Defina como BATCH_FORCED se os Pipelines forem bloqueados, consulte https://issues.apache.org/jira/browse/FLINK-10672
BeamEnginesFlink.OptionsExternalizedCheckpointsEnabled.Label=Desabilitar pontos de verificação externalizados
BeamEnginesFlink.OptionsExternalizedCheckpointsEnabled.ToolTip=Ativa ou desativa pontos de verificação externalizados. Funciona em conjunto com CheckpointingInterval
BeamEnginesFlink.OptionsFailOnCheckpointErrors.Label=Falha em erros de checkpoint?
BeamEnginesFlink.OptionsFailOnCheckpointErrors.ToolTip=Define o comportamento esperado para tarefas caso encontrem um erro em seu procedimento de ponto de verificação. Se isso for definido como verdadeiro, a tarefa falhará no erro de ponto de verificação. Se for definido como falso, a tarefa apenas recusará o ponto de verificação e continuará em execução. 
BeamEnginesFlink.OptionsLatencyTrackingInterval.Label=Intervalo de rastreamento de latência
BeamEnginesFlink.OptionsLatencyTrackingInterval.ToolTip=Intervalo em milissegundos para envio de marcas de rastreamento de latência das fontes para os coletores. Valor de intervalo <= 0 desativa o recurso.
BeamEnginesFlink.OptionsMaster.Label=O Flink master
BeamEnginesFlink.OptionsMaster.ToolTip=Endereço do Flink Master onde o Pipeline deverá ser executado. Pode ter o formato "host:port" ou um dos valores especiais [local], [coleção] ou [auto].
BeamEnginesFlink.OptionsMaxBundleSize.Label=Tamanho máximo do pacote
BeamEnginesFlink.OptionsMaxBundleSize.ToolTip=O número máximo de elementos em um pacote configurável.
BeamEnginesFlink.OptionsMaxBundleTimeMills.Label=Tempo máximo do pacote (ms)
BeamEnginesFlink.OptionsMaxBundleTimeMills.ToolTip=O tempo máximo de espera antes de finalizar um pacote (em milissegundos).
BeamEnginesFlink.OptionsNumberOfRetries.Label=Número de novas tentativas de execução
BeamEnginesFlink.OptionsNumberOfRetries.ToolTip=Define o número de vezes que as tarefas com falha são executadas novamente. Um valor zero desativa efetivamente a tolerância a falhas. Um valor -1 indica que o valor padrão do sistema (conforme definido na configuração) deve ser usado.
BeamEnginesFlink.OptionsObjectReuse.Label=Reutilização de objetos
BeamEnginesFlink.OptionsObjectReuse.ToolTip=Define o comportamento de reutilização de objetos.
BeamEnginesFlink.OptionsParallelism.Label=Paralelismo
BeamEnginesFlink.OptionsParallelism.ToolTip=O grau de paralelismo a ser usado ao distribuir operações aos workers. Se o paralelismo não estiver definido, o padrão configurado do Flink será usado, ou 1 se nenhum puder ser encontrado.
BeamEnginesFlink.OptionsPauseBetweenCheckpoints.Label=Pausa mínima entre pontos de verificação
BeamEnginesFlink.OptionsPauseBetweenCheckpoints.ToolTip=A pausa mínima em milissegundos antes do próximo ponto de verificação ser acionado.
BeamEnginesFlink.OptionsRetainExternalizedCheckpointsOnCancellation.Label=Retenha pontos de verificação externalizados no cancelamento
BeamEnginesFlink.OptionsRetainExternalizedCheckpointsOnCancellation.ToolTip=Define o comportamento dos pontos de verificação externalizados no cancelamento.
BeamEnginesFlink.OptionsRetryDelay.Label=Atraso na nova tentativa de execução (ms)
BeamEnginesFlink.OptionsRetryDelay.ToolTip=Define o atraso em milissegundos entre as execuções. Um valor -1 indica que o valor padrão deve ser usado.
BeamEnginesFlink.OptionsShutdownSourcesAfterIdleMs.Label=Desligar fontes na marca d''água final
BeamEnginesFlink.OptionsShutdownSourcesAfterIdleMs.ToolTip=Desliga fontes que ficaram inativas durante o tempo configurado de milissegundos. Depois que uma fonte for desligada, o ponto de verificação não será mais possível. O encerramento das fontes eventualmente leva ao encerramento do pipeline (=o trabalho do Flink termina) depois que todas as entradas forem processadas. A menos que seja definido explicitamente, o padrão será Long.MAX_VALUE quando o ponto de verificação estiver habilitado e 0 quando o ponto de verificação estiver desabilitado. Consulte https://issues.apache.org/jira/browse/FLINK-2491 para ver o progresso nesta questão.
BeamEnginesFlink.JobId.Log=ID do trabalho Flink: {0}
