JmsConsumerDialog.ReceiveTimeout.Tooltip=Stop when no message arrives within this window. The destination is then treated as drained.
JmsConsumerDialog.BodyField=Message body field
JmsConsumerDialog.KeyField=Correlation id field
JmsConsumerDialog.DestinationField=Destination field
JmsConsumerDialog.MessageIdField=Message id field
JmsConsumerDialog.TimestampField=Timestamp field
