JmsConsumer.Name=JMS consumer
JmsConsumer.Description=Read messages from a JMS queue or topic (ActiveMQ Artemis, ActiveMQ Classic, RabbitMQ via JMS, or any JMS provider through JNDI)
JmsConsumer.Keyword=jms,queue,topic,amqp,activemq,artemis,rabbitmq,message,consumer,subscribe

JmsConsumerDialog.Shell.Title=JMS consumer
JmsConsumerDialog.Connection=JMS connection
JmsConsumerDialog.DestinationType=Destination type
JmsConsumerDialog.Destination=Queue / topic name
JmsConsumerDialog.MessageSelector=Message selector
JmsConsumerDialog.MessageSelector.Tooltip=Optional JMS selector expression evaluated by the broker, e.g. priority > 5 AND region = 'EU'
JmsConsumerDialog.DurableSubscription=Durable subscription name
JmsConsumerDialog.DurableSubscription.Tooltip=Topics only. Requires a client id on the JMS connection.
JmsConsumerDialog.Transacted=Use a JMS transaction
JmsConsumerDialog.Transacted.Tooltip=Commit each message in a transaction instead of acknowledging it individually.
JmsConsumerDialog.MaxMessages=Maximum messages (0 = no limit)
