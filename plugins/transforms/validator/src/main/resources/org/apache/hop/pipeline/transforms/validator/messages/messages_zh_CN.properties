System.Warning.OnlySpaces=警告：此数值仅包含空格。
System.Warning.TrailingSpaces=警告：该值末尾有空格。
Validator.Exception.DataConversionErrorEncountered=在进行验证时遇到数据转换错误
Validator.Exception.DoesNotEndWithString=在验证字段 ''{0}'' 时，我们发现字符串值 [{1}] 并未以字符串 [{2}] 结尾
Validator.Exception.DoesNotStartWithString=在验证字段 ''{0}'' 时，字符串值 [{1}] 并未以字符串 [{2}] 开头
Validator.Exception.EndsWithString=在验证字段“{0}”时，我们发现字符串值 [{1}] 以字符串 [{2}] 结尾
Validator.Injection.SUPPRESS_LOG_FAILED_DATA=启用后，写入日志的校验错误消息中不包含失败字段/行数据。错误行仍会发送到错误处理路径。
ValidatorDialog.SuppressLogFailedData.Label=不记录校验失败的数据
ValidatorDialog.SuppressLogFailedData.Tooltip=启用后，校验错误消息中的失败字段/行数据会被省略（显示为“?”），但仍会打印错误日志。若配置了错误处理，错误行仍会发送到错误路径。
