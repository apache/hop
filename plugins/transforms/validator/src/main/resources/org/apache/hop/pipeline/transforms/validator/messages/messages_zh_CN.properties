Validator.Injection.SUPPRESS_LOG_FAILED_DATA=启用后，写入日志的校验错误消息中不包含失败字段/行数据。错误行仍会发送到错误处理路径。
ValidatorDialog.SuppressLogFailedData.Label=不记录校验失败的数据
ValidatorDialog.SuppressLogFailedData.Tooltip=启用后，校验错误消息中的失败字段/行数据会被省略（显示为“?”），但仍会打印错误日志。若配置了错误处理，错误行仍会发送到错误路径。
