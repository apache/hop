System.Warning.OnlySpaces=警告：此数值仅包含空格。
System.Warning.TrailingSpaces=警告：该值末尾有空格。
Validator.Exception.DataConversionErrorEncountered=在进行验证时遇到数据转换错误
Validator.Exception.DoesNotEndWithString=在验证字段 ''{0}'' 时，我们发现字符串值 [{1}] 并未以字符串 [{2}] 结尾
Validator.Exception.DoesNotStartWithString=在验证字段 ''{0}'' 时，字符串值 [{1}] 并未以字符串 [{2}] 开头
