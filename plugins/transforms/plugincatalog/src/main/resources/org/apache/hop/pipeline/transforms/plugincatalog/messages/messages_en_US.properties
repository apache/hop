PluginCatalogDialog.Shell.Title=Plugin Catalog

PluginCatalog.Name=Plugin Catalog
PluginCatalog.Description=Reflect the live Hop plugin registry into rows (transforms, actions, metadata types) with resolved labels and property schemas
PluginCatalog.Keywords=plugin,catalog,registry,transform,action,metadata,reflection,reference,RAG,documentation

PluginCatalog.includeTransforms.Label=Include transforms
PluginCatalog.includeTransforms.Tooltip=Emit one entry per registered transform plugin

PluginCatalog.includeActions.Label=Include actions
PluginCatalog.includeActions.Tooltip=Emit one entry per registered workflow action plugin

PluginCatalog.includeMetadataTypes.Label=Include metadata types
PluginCatalog.includeMetadataTypes.Tooltip=Emit one entry per registered Hop metadata type (connections, run configurations, ...)

PluginCatalog.detailLevel.Label=Detail level
PluginCatalog.detailLevel.Tooltip=PER_PLUGIN: one row per plugin with properties as a JSON column. PER_PROPERTY: one row per property with plugin columns repeated.
