RegexEvalDialog.Comment.Tooltip=In diesem Modus werden Leerzeichen ignoriert,\nund eingebettete Kommentare, die mit # beginnen, werden bis zum Ende einer Zeile ignoriert.\nDer Kommentar-Modus kann auch über den eingebetteten Flag-Ausdruck (?x) aktiviert werden.
RegexEvalDialog.ContentTab.TabTitle=Inhalt
RegexEvalDialog.DotAll.Label=Aktiviere dotall mode
RegexEvalDialog.DotAll.Tooltip=Im Dotall-Modus passt der Ausdruck '.' auf jedes beliebige Zeichen, einschließlich eines Zeilenabschlusses.\nStandardmäßig passt dieser Ausdruck nicht auf Zeilenbegrenzer.\nDer Dotall-Modus kann auch über den eingebetteten Flag-Ausdruck (?s) aktiviert werden.
