RegexEvalDialog.Multiline.Label=aktiviere Mehrzeilenmodus
RegexEvalDialog.Multiline.Tooltip=Im Mehrzeilienmodus passen die Ausdrücke ^ und $ direkt nach bzw. direkt vor,\nbzw. vor einem Zeilenende oder dem Ende der Eingabesequenz überein.\nStandardmäßig passen diese Ausdrücke nur am Anfang und am Ende der gesamten Eingabesequenz.\nDer Mehrzeilenmodus kann auch über den eingebetteten Flag-Ausdruck (?m) aktiviert werden.
