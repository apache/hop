RegexEvalDialog.AllowCaptureGroups.Label=Felder für Capture Groups erstellen
RegexEvalDialog.AllowCaptureGroups.Tooltip=erlaubt die Erzeugung von Feldern, die auf den Capture Groups im regulären Ausdruck basieren.
RegexEvalDialog.CanonEq.Label=Ignoriere Unterschiede in Unicode Kodierungen
RegexEvalDialog.CanonEq.Tooltip=CANON_EQ, um Unterschiede in der Unicode-Kodierung zu ignorieren,\nes sei denn, Sie sind sicher, dass Ihre Zeichenketten nur US-ASCII-Zeichen enthalten und Sie die Leistung steigern wollen.
RegexEvalDialog.CaseInsensitive.Label=aktiviere case-insensitives Matching
RegexEvalDialog.CaseInsensitive.Tooltip=CASE_INSENSITIVE, um die Groß-/Kleinschreibung nicht zu berücksichtigen.\nStandardmäßig wird bei der Suche ohne Groß-/Kleinschreibung davon ausgegangen, dass nur Zeichen im US-ASCII-Zeichensatz abgeglichen werden.\nDurch Angabe des Flags UNICODE_CASE in Verbindung mit diesem Flag kann der Abgleich unter Berücksichtigung der Groß- und Kleinschreibung aktiviert werden.\nDer case-insensitive Abgleich kann auch über den eingebetteten Flag-Ausdruck (?i) aktiviert werden.
