RegexEvalDialog.Unicode.Label=aktiviere Unicode-fähiges case folding
RegexEvalDialog.Unicode.Tooltip=Wenn dieses Flag angegeben ist, wird die Groß- und Kleinschreibung nicht berücksichtigt,\nwenn er durch das Flag CASE_INSENSITIVE aktiviert ist, in Übereinstimmung mit dem Unicode-Standard durchgeführt.\nStandardmäßig geht der case-insensitive Abgleich davon aus, dass nur Zeichen des US-ASCII-Zeichensatzes abgeglichen werden.\nDie Groß- und Kleinschreibung kann auch über den eingebetteten Flag-Ausdruck (?u) aktiviert werden.
RegexEvalDialog.Unix.Label=aktiviert Unix Zeilenumbrüche
RegexEvalDialog.Unix.Tooltip=In diesem Modus wird nur der '\n' Zeilenabschluss erkannt dur die Ausdrücke . , ^ und $.\n*nix Zeilenmodus kann auch aktiviert werden durch den Ausdruck (?d).
