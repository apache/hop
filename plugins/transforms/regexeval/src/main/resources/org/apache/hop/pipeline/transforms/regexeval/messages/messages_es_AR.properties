RegexEvalDialog.Multiline.Label=Habilitar modo multilínea
RegexEvalDialog.Multiline.Tooltip=En el modo multilínea las expresiones ^ y $ coinciden justo antes ó justo después,\n respectivamente, de un terminador de línea o del fin de la secuencia de entrada.\n Por defecto estas expresiones sólo coinciden al comienzo y al final de la secuencia de entrada.\nEl modo multilínea también puede ser activado a través de la expresión de señal embebida (?m).
