RegexEvalDialog.Unicode.Label=Insensibilidad a mayúsculas en Unicode
RegexEvalDialog.Unicode.Tooltip=Cuando esta señal es especificada el apareo no sensible a mayúsculas,\n si fue activado por la señal CASE_INSENSITIVE, es hecho de manera consistente con el estándar Unicode.\nPor defecto, el apareo no sensible a mayúsculas asume que sólo se están apareando caracteres US-ASCII.\nEsta opción también puede ser activada a través de la expresión de señal embebida (?u).
RegexEvalDialog.Unix.Label=Activa el modo de líneas Unix
RegexEvalDialog.Unix.Tooltip=En este modo, sólo el terminador de línea '\n' es reconocido en el comportamiento de  ., ^, y $.\nEl modo de líneas Unix también puede ser activado a través de la expresión de señal embebida (?d).
