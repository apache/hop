RegexEvalDialog.ContentTab.TabTitle=Contenido
RegexEvalDialog.DotAll.Label=Activar modo dotall
RegexEvalDialog.DotAll.Tooltip=En el modo dotall, la expresión . coincide con cualquier caracter, incluyendo un terminador de línea.\n Por defecto esta expresión no coincide con terminadores de línea.\nEl modo dotall también puede ser activado a través de la expresión de señal embebida (?s).
