RegexEvalDialog.CanonEq.Label=Ignorar diferencias en codificaciones Unicode
RegexEvalDialog.CanonEq.Tooltip=CANON_EQ para ignorar diferencias en codificaciones Unicode,\n excepto que esté seguro de que sus cadenas contienen sólo caracteres US ASCII y desee mejorar el rendimiento.
RegexEvalDialog.CaseInsensitive.Label=Habilita apareo insensible a mayúsculas
RegexEvalDialog.CaseInsensitive.Tooltip=CASE_INSENSITIVE para habilitar insensibilidad a mayúsculas.\nPor defecto, el apareo no sensible a mayúsculas asume que sólo se están apareando caracteres US-ASCII.\n Apareo no sensible a mayúsculas y compatible con unicode puede ser activado especificando la señal UNICODE_CASE junto con esta señal.\nEl apareo no sensible a las mayúsculas también puede ser activado a través de la expresión de señal embebida (?i).
