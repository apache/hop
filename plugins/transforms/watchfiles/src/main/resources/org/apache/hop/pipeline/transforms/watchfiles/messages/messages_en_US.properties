WatchFilesMeta.Name=Watch Files
WatchFilesMeta.Description=Continuously emit stable file changes with persistent state and reconciliation
WatchFilesMeta.Keywords=watch,files,directory,monitor,source,vfs
WatchFilesDialog.Title=Watch Files
WatchFilesMeta.directory.Label=Directory
WatchFilesMeta.directory.Tooltip=Folder whose file changes should produce rows. Select a local folder or a named VFS connection.\nExample: a folder receiving CSV exports. Enable Include subdirectories to also watch its child folders.
WatchFilesMeta.editWatchId.Label=Edit state identifier
WatchFilesMeta.editWatchId.Tooltip=Show the saved identifier for manual editing. New transforms already have an automatically generated ID. Disabling this option only hides the field; it keeps the saved ID and history. Changing the identifier starts a separate history in the selected state directory. Existing checkpoints are preserved.
WatchFilesMeta.watchId.Label=State identifier
WatchFilesMeta.watchId.Tooltip=Generated once for a new transform and saved in the pipeline. Keep this ID to resume its checkpoint. Changing it starts a separate history; renaming the transform does not change it. Changing Directory, filters or Include subdirectories requires a new ID or an explicit state reset in Maintenance.
WatchFilesDialog.StateIdentity.Automatic=State identifier: Automatic
WatchFilesDialog.StateIdentity.Saved=State identifier: Saved
WatchFilesDialog.StateIdentityHelp=Saved identifier: {0}\nIt is reused on every start and is independent of the transform name and directory hash. To edit it, enable Edit state identifier in Advanced. Existing identifiers and checkpoints are retained.
WatchFilesMeta.patternSyntax.Label=Pattern syntax
WatchFilesMeta.patternSyntax.Tooltip=Choose how filename patterns are interpreted.\nWildcards: * matches any text, ? matches one character; examples: *.csv, report*, *test*. Other characters are literal.\nJava regular expression: use expressions such as .*\\.csv. Patterns match the whole filename and are case-sensitive.
WatchFilesMeta.includeWildcard.Label=Include filename pattern
WatchFilesMeta.includeWildcard.Tooltip=Match the entire filename using the syntax selected in General. Empty includes all files. Wildcards: * for all files, *.csv for CSV files, *test* for names containing test. Changing the matched scope requires a new Watch ID or a state reset in Maintenance.
WatchFilesMeta.excludeWildcard.Label=Exclude filename pattern
WatchFilesMeta.excludeWildcard.Tooltip=Match the entire filename using the syntax selected in General. Empty excludes nothing. Exclusion takes precedence. Changing the matched scope requires a new Watch ID or a state reset in Maintenance.
WatchFilesMeta.includeSubdirectories.Label=Include subdirectories
WatchFilesMeta.includeSubdirectories.Tooltip=Recursively monitor directories without following symbolic links.
WatchFilesMeta.strategy.Label=Detection strategy
WatchFilesMeta.strategy.Tooltip=Choose how folder changes are detected.\nAutomatic: use system notifications when available, otherwise scan periodically.\nNative: require system notifications and periodically verify the folder.\nPeriodic scans: repeatedly compare the folder with saved observations.
WatchFilesMeta.created.Label=Created
WatchFilesMeta.created.Tooltip=Produce a CREATED row when a matching new file is ready. Existing files also produce CREATED when Process existing files is selected for a first start without saved state.
WatchFilesMeta.modified.Label=Modified
WatchFilesMeta.modified.Tooltip=Produce a MODIFIED row when a previously observed file changes size or modification time and passes the readiness checks. Several writes can be combined into one stable change.
WatchFilesMeta.deleted.Label=Deleted
WatchFilesMeta.deleted.Tooltip=Produce a DELETED row when a previously observed file disappears. The row contains its last known metadata. Filter these rows before sending filenames to a content reader or copy operation.
WatchFilesMeta.pollingInterval.Label=Polling interval (ms)
WatchFilesMeta.pollingInterval.Tooltip=Time between complete folder scans when periodic detection is used. Also used to retry failed scans and metadata checks.\n5000 ms = 5 seconds. Shorter intervals increase scan frequency and filesystem load. Use a positive number or a variable such as '${SCAN_INTERVAL}'.
WatchFilesMeta.reconciliationInterval.Label=Reconciliation interval (ms)
WatchFilesMeta.reconciliationInterval.Tooltip=Time between complete verification scans when native notifications are used. These scans find persisting changes missed by notifications.\n60000 ms = 1 minute. Native events can be detected between scans. Shorter intervals increase filesystem load.
WatchFilesMeta.eventCapacity.Label=Native hint capacity
WatchFilesMeta.eventCapacity.Tooltip=Limit native notification hints handled per iteration. If there are too many, a complete verification scan is requested.\nDefault: 4096. Increase only when tuning a busy local folder. This option applies to native detection.
WatchFilesMeta.maximumEntries.Label=Maximum entries
WatchFilesMeta.maximumEntries.Tooltip=Limit how many files and directories this watcher can track.\nDefault: 100000. If the limit is exceeded, the watcher stops with an error rather than silently ignoring entries. Increase for larger folder trees, allowing for additional memory use.
WatchFilesMeta.waitUntilStable.Label=Wait until the file stops changing
WatchFilesMeta.waitUntilStable.Tooltip=Wait for repeated checks showing unchanged file size and modification time before producing CREATED or MODIFIED rows. Helps avoid processing files while they are being copied.\nTune the checks and spacing in Advanced. Minimum file age applies independently of this checkbox.
WatchFilesMeta.minimumAge.Label=Minimum file age (ms)
WatchFilesMeta.minimumAge.Tooltip=Minimum elapsed time since the file was last modified before it can be emitted. This applies even when Wait until the file stops changing is off.\n2000 ms = 2 seconds; 0 removes the age requirement. Variables are supported.
WatchFilesMeta.stabilityChecks.Label=Stability checks
WatchFilesMeta.stabilityChecks.Tooltip=Number of consecutive unchanged size and modification-time checks required after the first observation.\nDefault: 2. More checks provide a longer observation period; a detected change restarts the count.
WatchFilesMeta.stabilityInterval.Label=Stability interval (ms)
WatchFilesMeta.stabilityInterval.Tooltip=Minimum spacing between readiness checks.\n1000 ms = 1 second. Actual checks can occur later while scans or downstream processing are busy. Minimum file age is an additional requirement. Variables are supported.
WatchFilesMeta.stateDirectory.Label=State directory
WatchFilesMeta.stateDirectory.Tooltip=Local durable state directory. New transforms use .hop/watch-files under the user home directory. This folder must remain outside the watched tree and persist across executions.
WatchFilesMeta.initialScan.Label=First start without saved state
WatchFilesMeta.initialScan.Tooltip=Choose what to do only when this Watch ID has no saved state.\nProcess existing files: emit matching files already in the folder after readiness checks.\nWatch new changes only: record the current files as a quiet starting point.\nWith a valid saved checkpoint, always compare with it and resume observed changes.
WatchFilesMeta.checkpointInterval.Label=Checkpoint interval (ms)
WatchFilesMeta.checkpointInterval.Tooltip=Time between saving acknowledged file observations, also saved on graceful shutdown.\n5000 ms = 5 seconds. Shorter intervals write state more often. This records source observations, not successful downstream processing.

WatchFilesMeta.diagnosticsInterval.Label=Diagnostics interval (ms)
WatchFilesMeta.diagnosticsInterval.Tooltip=How often to log counts and operation durations for monitoring and troubleshooting.\n60000 ms = 1 minute. A final summary is also logged on shutdown. Variables such as '${REPORT_INTERVAL}' are supported.
WatchFilesMeta.slowOperationThreshold.Label=Slow operation threshold (ms)
WatchFilesMeta.slowOperationThreshold.Tooltip=Log a warning when a completed folder scan, file check or state save takes at least this long.\n30000 ms = 30 seconds. Use this to spot slow storage or connections. Configure connection timeouts separately.
WatchFilesMeta.replayFilter.Label=Filename pattern
WatchFilesMeta.replayFilter.Tooltip=One-time selection for this reprocessing action. .* selects all names; .*\\.csv selects CSV files; .*test.* selects names containing test.\nUse a Java regular expression, independent of Pattern syntax in General. Only currently existing matching files can be emitted again after restart.
WatchFilesDialog.Inspect=View status
WatchFilesDialog.Backup=Create backup
WatchFilesDialog.Replay=Reprocess files...
WatchFilesDialog.Reset=Clear saved history...
WatchFilesDialog.Restore=Restore backup...
WatchFilesDialog.Migrate=Update saved-state format...
WatchFilesDialog.LocalStateRequired=State directory must be local.
WatchFilesDialog.BackupResult=Preserved checkpoint artifacts in:\u0020
WatchFilesDialog.ReplayResult=Observed entries removed for replay on next start:\u0020
WatchFilesDialog.StateError=State operation failed:\u0020
WatchFilesDialog.ReplayConfirm=Re-emit currently existing files matching the replay filename regex on next start? This may duplicate destination data. The source must be stopped and CREATED events must be enabled. A backup is preserved first.
WatchFilesDialog.ResetConfirm=Back up and remove this Watch ID''s observed state? The next start follows First start without saved state. This can cause duplicates or establish a new quiet baseline. The source must be stopped.
WatchFilesDialog.RestoreConfirm=Restore the selected checkpoint after preserving current artifacts? It must belong to this Watch ID. An older checkpoint can cause duplicates. The source must be stopped.
WatchFilesDialog.MigrateConfirm=Preserve a backup and rewrite this checkpoint in the current schema? The source must be stopped.

WatchFilesDialog.CreatedRequired=Enable CREATED events before replay.

WatchFilesMeta.Group.General=General
WatchFilesMeta.Group.Advanced=Advanced
WatchFilesMeta.Group.Maintenance=Maintenance
WatchFilesMeta.strategy.AUTO=Automatic (recommended)
WatchFilesMeta.strategy.NATIVE=Native filesystem notifications
WatchFilesMeta.strategy.POLLING=Periodic folder scans
WatchFilesMeta.patternSyntax.WILDCARD=Wildcards (* and ?)
WatchFilesMeta.patternSyntax.REGEXP=Java regular expression
WatchFilesMeta.initialScan.EMIT_EXISTING=Process existing files
WatchFilesMeta.initialScan.IGNORE_EXISTING=Watch new changes only
WatchFilesMeta.initialScan.COMPARE_WITH_STATE=Resume saved state; otherwise watch new changes
WatchFilesDialog.GeneralHelp=Advanced contains detection, timing and state settings. A saved checkpoint is always resumed. Maintenance provides inspection and explicit reprocessing.
WatchFilesDialog.Patterns.WILDCARD=Filename patterns: * = all files; *.csv = CSV files; test* = starts with test; *test = ends with test; *test* = contains test.
WatchFilesDialog.Patterns.REGEXP=Filename patterns use Java regular expressions (selected in General): .* = all files; .*\\.csv = CSV files. The entire filename must match.

WatchFilesDialog.Detection.AUTO=Automatic detection (recommended).\nLocal folders use system notifications when available; other locations or unsupported notifications use periodic scans.\nBoth intervals are shown because the detection method is chosen when the pipeline starts. Polling controls periodic scans and retries; reconciliation controls native verification scans.
WatchFilesDialog.Detection.NATIVE=Native filesystem notifications.\nReact to system file-change notifications and verify the folder periodically using Reconciliation interval. This mode requires a local filesystem with notification support; initialization fails if unavailable.\nMinimum file age and stability checks can delay emission until the file is ready.
WatchFilesDialog.Detection.POLLING=Periodic folder scans.\nRepeatedly list the folder and compare file size and modification time with saved observations. Polling interval controls the scan frequency.\nUseful for remote locations or network mounts with unreliable notifications. Shorter intervals increase filesystem load; readiness checks can add further delay.
WatchFilesDialog.PollingHelp.AUTO=Used when Automatic selects periodic scanning, and for retrying failed scans or file checks in either detection method.\n5000 ms = 5 seconds. A smaller value scans or retries more often and can increase filesystem load. Use a positive number or a variable such as '${SCAN_INTERVAL}'.
WatchFilesDialog.PollingHelp.POLLING=Time between complete folder scans. Each successful scan detects persisting creations, modifications and deletions relative to saved observations.\n5000 ms = 5 seconds. A smaller value scans more often and increases filesystem load. Busy scans, readiness checks or downstream processing can delay emission. Variables are supported.
WatchFilesDialog.PollingHelp.NATIVE=The saved polling interval is used to retry failed scans and file checks even in native mode.\n5000 ms = 5 seconds. Switch to Automatic to edit this retained setting.
WatchFilesDialog.ReconciliationHelp=Time between complete verification scans while using native notifications. These scans recover persisting changes missed by notifications.\n60000 ms = 1 minute. Native events can be detected between these scans. Smaller values increase scan frequency and filesystem load. Variables are supported.
WatchFilesDialog.IncludeHelp.WILDCARD=Select filenames to include with wildcard patterns.\n* or empty = all files; *.csv = CSV files; report* = starts with report; *test = ends with test; *test* = contains test; ? = one character.\nMatches the whole filename, including its extension, and is case-sensitive. Exclusions take precedence. Changing the matched scope requires a new Watch ID or a state reset in Maintenance.
WatchFilesDialog.IncludeHelp.REGEXP=Select filenames to include with a Java regular expression.\n.* or empty = all files; .*\\.csv = CSV files; .*test.* = contains test.\nMatches the whole filename and is case-sensitive. Exclusions take precedence. Changing the matched scope requires a new Watch ID or a state reset in Maintenance.
WatchFilesDialog.ExcludeHelp.WILDCARD=Exclude matching filenames even if the include pattern matches.\nEmpty = exclude nothing; *.tmp = temporary files; *backup* = names containing backup. * excludes all files.\nUses the wildcard syntax selected in General and is case-sensitive. Changing the matched scope requires a new Watch ID or a state reset in Maintenance.
WatchFilesDialog.ExcludeHelp.REGEXP=Exclude matching filenames even if the include pattern matches.\nEmpty = exclude nothing; .*\\.tmp = temporary files; .*backup.* = names containing backup. .* excludes all files.\nUses Java regular expressions and is case-sensitive. Changing the matched scope requires a new Watch ID or a state reset in Maintenance.

WatchFilesMeta.Group.Reprocess=Files to reprocess
WatchFilesDialog.MaintenanceHelp=Saved history helps avoid re-emitting unchanged files.\nNo maintenance is needed for normal monitoring.
WatchFilesDialog.AdvancedRecovery=Advanced recovery
WatchFilesDialog.AdvancedRecoveryHelp=Show tools to clear saved history, restore a backup or update an older state format. Use these when repairing or restarting file tracking.
WatchFilesDialog.InspectHelp=Show saved observations or the running watcher diagnostics. Reading the status leaves the saved history unchanged. An observed file is not a confirmation of downstream processing.
WatchFilesDialog.BackupHelp=Stop the watcher, then create a backup of this Watch ID''s saved history. The current history and your monitored files remain unchanged.
WatchFilesDialog.ReplayHelp=Choose filenames to emit again after restarting the pipeline. Stop the watcher and enable Created first. You select the filter in a separate window and confirm before history is changed. Files can be processed more than once.
WatchFilesDialog.ResetHelp=Clear this Watch ID''s observed-file history after creating a backup. Monitored files are retained. The next start follows First start without saved state in General. A separate confirmation is required.
WatchFilesDialog.RestoreHelp=Select a backup to restore the watcher history. A backup of the current history is preserved first. Restoring an older history can cause files to be emitted again. Stop the watcher before confirming.
WatchFilesDialog.MigrateHelp=Convert saved history from an older state format to the current format, preserving a backup and the observed entries. This is an exceptional maintenance operation. Stop the watcher before confirming.
WatchFilesDialog.ReprocessTitle=Reprocess files
WatchFilesDialog.ReprocessHelp=Choose observed filenames to emit again on the next pipeline start.\nExamples: .* = all names; .*\\.csv = CSV files; .*test.* = names containing test.\nThis is a one-time regular expression, independent of Pattern syntax in General. Files must still exist, and Created must be enabled. A confirmation follows OK; Cancel leaves the history unchanged.
WatchFilesDialog.InvalidReplayTitle=Invalid filename pattern
WatchFilesDialog.InvalidReplayPattern=Enter a valid Java regular expression, for example .* or .*\\.csv.\n
WatchFilesMeta.maximumRunTime.Label=Maximum run time (blank = continuous)
WatchFilesMeta.maximumRunTime.Tooltip=Leave blank to watch continuously. Enter a positive duration, for example 30 minutes or 1.5 hours (use a decimal point), or a variable such as '${WATCH_DURATION}'. Timing starts when row processing begins, after initialization. At the limit, save state and finish normally so downstream rows can complete. A blocked filesystem operation or downstream handoff can delay completion.
WatchFilesMeta.maximumRunTimeUnit.Label=Run time unit
WatchFilesMeta.maximumRunTimeUnit.Tooltip=Choose minutes or hours for the maximum run time. For example, 90 minutes and 1.5 hours have the same duration. Shown only when a duration is entered.
WatchFilesMeta.maximumRunTimeUnit.MINUTES=Minutes
WatchFilesMeta.maximumRunTimeUnit.HOURS=Hours
