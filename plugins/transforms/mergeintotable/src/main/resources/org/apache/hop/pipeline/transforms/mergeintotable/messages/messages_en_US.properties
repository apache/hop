MergeIntoTable.Name=Merge into table
MergeIntoTable.Description=Insert or update each row in a table with one upsert statement (MERGE, ON CONFLICT or ON DUPLICATE KEY), without a lookup query
MergeIntoTableMeta.keyword=merge,upsert,insert,update,table,database,output

MergeIntoTableDialog.Shell.Title=Merge into table
MergeIntoTableDialog.ConnectionMissing.Title=No connection
MergeIntoTableDialog.ConnectionMissing.Message=Select a database connection first.
MergeIntoTableDialog.BrowseError.Title=Error
MergeIntoTableDialog.BrowseError.Message=Unable to browse the tables of this connection.
MergeIntoTableDialog.GetFieldsFailed.Title=Get fields failed
MergeIntoTableDialog.GetFieldsFailed.Message=Unable to get the fields of the previous transforms.

MergeIntoTableMeta.Group.General=General
MergeIntoTableMeta.Group.Keys=Keys
MergeIntoTableMeta.Group.Values=Fields
MergeIntoTableMeta.Connection.Label=Connection
MergeIntoTableMeta.Connection.Tooltip=The database connection to write to. Its database type must support an upsert statement: MERGE, INSERT ... ON CONFLICT or INSERT ... ON DUPLICATE KEY UPDATE.
MergeIntoTableMeta.Schema.Label=Target schema
MergeIntoTableMeta.Schema.Tooltip=The schema of the target table. Leave empty for the default schema of the connection.
MergeIntoTableMeta.Table.Label=Target table
MergeIntoTableMeta.Table.Tooltip=The table every row is merged into.
MergeIntoTableMeta.BrowseTable.Label=Browse...
MergeIntoTableMeta.BrowseTable.Tooltip=Select the target schema and table in the database explorer.
MergeIntoTableMeta.CommitSize.Label=Commit size
MergeIntoTableMeta.CommitSize.Tooltip=The number of rows merged before a commit, and the size of a batch. 0 or empty: every row is committed on its own (auto-commit), without batches.
MergeIntoTableMeta.UseBatch.Label=Use batch updates
MergeIntoTableMeta.UseBatch.Tooltip=Send the upsert statements to the database in batches of the commit size instead of one at a time. A row is passed on, or sent to the error hop, only after the database committed or refused it. Only used on a connection whose batch failure contract is validated (see the Advanced options of the connection): elsewhere every row runs as a statement of its own, and the log says so.
MergeIntoTableMeta.UpsertForm.Label=Upsert statement
MergeIntoTableMeta.UpsertForm.Tooltip=The statement written for every row. Automatic picks the first form the database type declares that the connection and the table qualify for: ON CONFLICT needs a primary key or unique index on exactly the key columns, ON DUPLICATE KEY needs that to be the only unique index of the table.
MergeUpsertForm.AUTOMATIC.Description=Automatic
MergeUpsertForm.MERGE.Description=MERGE
MergeUpsertForm.ON_CONFLICT.Description=INSERT ... ON CONFLICT
MergeUpsertForm.ON_DUPLICATE_KEY.Description=INSERT ... ON DUPLICATE KEY UPDATE
MergeIntoTableMeta.UpdateExisting.Label=Update existing rows
MergeIntoTableMeta.UpdateExisting.Tooltip=Update a row whose key is already in the table. Off: only rows with a new key are inserted and existing rows are left alone.
MergeIntoTableMeta.UpdateOnlyChanged.Label=Update only changed rows
MergeIntoTableMeta.UpdateOnlyChanged.Tooltip=Update an existing row only when one of its updated columns differs from the incoming value. NULLs compare as equal.
MergeIntoTableMeta.KeyFields.Label=The keys that identify a row in the table (all compared with "=")
MergeIntoTableMeta.KeyFields.Tooltip=A row is updated when every key column equals its stream field, and inserted otherwise. Key columns are never updated.
MergeIntoTableMeta.ValueFields.Label=The columns to write
MergeIntoTableMeta.ValueFields.Tooltip=Every column here is written when a row is inserted. Set Update to N to leave a column alone when an existing row is updated.
MergeIntoTableMeta.Column.StreamField.Label=Stream field
MergeIntoTableMeta.Column.TableColumn.Label=Table column
MergeIntoTableMeta.Column.Update.Label=Update
MergeIntoTableMeta.Column.Update.Tooltip=Y: the column is written on insert and on update. N: the column is only written on insert.
MergeIntoTableMeta.Column.KeyStreamField.Tooltip=The incoming field with the key value
MergeIntoTableMeta.Column.KeyTableColumn.Tooltip=The key column of the table
MergeIntoTableMeta.Column.ValueStreamField.Tooltip=The incoming field with the value to write
MergeIntoTableMeta.Column.ValueTableColumn.Tooltip=The table column to write the value to

