JsonInput.category=Eingabe
JsonInput.description=Relevante Teile der JSON-Struktur (aus einer Datei oder einem eingehenden Feld) extrahieren und als Zeilen ausgeben
JsonInput.Error.FileSizeZero=Datei [{0}] ist leer!
JsonInput.ErrorInTransformRunning=Fehler bei der Ausführung der Transformation! {0}
JsonInput.Exception.CouldnotFindField=Das Feld "{0}" konnte nicht in der Zeile gefunden werden!
JsonInput.Injection.ADD_RESULT_FILE=Eingabedateien zum Ergebnis der Pipeline hinzufügen.
JsonInput.Injection.DO_NOT_FAIL_IF_NO_FILE=Das Setzen dieser Option wird die Ausführung fortgesetzt, selbst wenn keine Eingabedateien empfangen wurden.
JsonInput.Injection.EXCLUDE_FILEMASK=Dateifilter um Eingabedateien zu filtern, wenn der Pfad auf einen Ordner verweist.
JsonInput.Injection.FIELD_CURRENCY=Währungssymbol, welches verwendet wird.
JsonInput.Injection.FIELD_DECIMAL=Dezimaltrennzeichen, welches verwendet wird.
JsonInput.Injection.FIELD_FORMAT=Formatmaske, die für die Formatierung verwendet wird.
JsonInput.Injection.FIELD_GROUP=Gruppierungssymbol, welches verwendet wird.
JsonInput.Injection.FIELD_LENGTH=Diese Option zeigt die Länge des Feldes an.
JsonInput.Injection.FIELD_NAME=Feldname
JsonInput.Injection.FIELD_PATH=Der Pfad innerhalb der Eingabe, welcher für die Lokalisierung der Daten verwendet werden soll.
JsonInput.Injection.FIELD_PRECISION=Diese Option gibt an, welche Präzision numerische Werte eingelesen werden sollen.
JsonInput.Injection.FIELD_REPEAT=Diese Option gibt an, ob das Feld sich wiederholt.
JsonInput.Injection.FIELD_TRIM_TYPE=Das Symbol, welches für Gruppierung verwendet wird.
JsonInputMeta.CheckResult.NoInput=Keine Eingabe aus anderen Transforms erhalten.
