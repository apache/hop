CsvInputDialog.UsageInfoDialog.DialogMessage=Die CSV-Dateieingabetransformation wurde entwickelt, um fortgeschrittene Dateilesetechniken zu unterstützen, wie:\n- Nicht blockierende E/A (NIO)\n- Paralleles Lesen von Dateien\n- Faule Konvertierung (Verzögerung der teuren Datenkonvertierung in der Hoffnung, dass sie nie stattfindet)\nLeider können wir dies nur mit lokalen Dateien unterstützen, nicht auf dem Apache Virtual File System. \n{Hier sind einige alternative Umwandlungen, die Sie verwenden können:\n- Textdateieingabe: mit Unterstützung für komplexe Datenformate und Dateien auf Apache VFS-Systemen\n- Beam-Dateieingabe: für paralleles Lesen in einer Beam-Pipeline
