TextChunker.chunkSize.Label=Chunk size
TextChunker.chunkSize.Tooltip=Maximum size for each chunk in characters (approximate for paragraphs)

TextChunker.chunkOverlap.Label=Chunk overlap
TextChunker.chunkOverlap.Tooltip=Number of characters to overlap between chunks (for continuity)

TextChunker.includeMetadata.Label=Include metadata
TextChunker.includeMetadata.Tooltip=Add metadata fields (chunk index, position, document ID) to output

TextChunker.chunkIndexField.Label=Chunk index field
TextChunker.chunkIndexField.Tooltip=Name of the field for chunk index (0-based)

TextChunker.chunkStartPosField.Label=Chunk start position field
