TextChunker.documentIdField.Label=Document ID field
TextChunker.documentIdField.Tooltip=Name of the field for document ID (unique per input row)

TextChunker.chunkCountField.Label=Total chunks field
TextChunker.chunkCountField.Tooltip=Name of the field for total number of chunks per document

ChunkingStrategy.CHARACTER=Character
ChunkingStrategy.PARAGRAPH=Paragraph
ChunkingStrategy.STRUCTURE=Structure

