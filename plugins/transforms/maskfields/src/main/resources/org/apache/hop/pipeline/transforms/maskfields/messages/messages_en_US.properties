MaskFieldsDialog.Shell.Title=Mask fields
MaskFields.Group.Fields=Fields
MaskFields.InfoTransform.Label=Info transform
MaskFields.InfoTransform.Tooltip=Transform that delivers the list of replacement values. Connect it with an info hop.
MaskFields.InfoStream.Description=The transform that delivers replacement values
MaskFields.GetFields.Label=Get fields
MaskFields.GetFields.Tooltip=Add a row for each incoming field
MaskFields.GetFields.Error.Title=Error
MaskFields.GetFields.Error.Message=Unable to read the incoming fields
MaskFields.Fields.Tooltip=Each field is replaced using the masking pattern named on its row
MaskFields.Column.Field.Label=Field
MaskFields.Column.Pattern.Label=Masking pattern
MaskFields.Injection.FieldName=Field name
MaskFields.Injection.PatternName=Masking pattern

MaskFields.Check.NoInput=This transform needs an input stream.
MaskFields.Check.Copies=Mask fields runs as a single copy and cannot be partitioned.
MaskFields.Check.DuplicateField=Field ''{0}'' is listed more than once.
MaskFields.Check.MissingField=Field ''{0}'' is not in the input stream.
MaskFields.Check.NoPattern=Field ''{0}'' has no masking pattern.
MaskFields.Check.MissingPattern=Masking pattern ''{0}'' was not found.
MaskFields.Check.Incompatible=Field ''{0}'' cannot use masking pattern ''{1}'': {2}
MaskFields.Check.NoInfo=A selected pattern reads a list, and no info transform is selected.
MaskFields.Check.ListFieldMissing=Info stream has no field ''{0}'' for masking pattern ''{1}''.
MaskFields.Check.InfoUnused=An info transform is connected and no selected pattern reads a list.
MaskFields.Check.NoConnection=Masking pattern ''{0}'' stores mappings in a database and has no connection.
MaskFields.Check.MissingConnection=Database connection ''{0}'' for masking pattern ''{1}'' was not found.
MaskFields.Check.NoTable=Masking pattern ''{0}'' stores mappings in a database and has no table name.

MaskFields.Error.Copies=Mask fields runs as a single copy and cannot be partitioned.
MaskFields.Error.FieldMissing=Field ''{0}'' is no longer in the input row.
MaskFields.Error.Convert=Unable to write the masked value into field ''{0}'' with pattern ''{1}''.
MaskFields.Error.EmptyList=Masking pattern ''{0}'' received no replacement values from the info transform.
MaskFields.Error.ListFieldMissing=The info transform has no field ''{0}''.
MaskFields.Error.BadSequence=Sequence start ''{0}'' on masking pattern ''{1}'' is not an integer.
MaskFields.Error.OpenStore=Unable to open the mapping table for masking pattern ''{0}''.

MaskingRules.SetEmpty=Set to blank only applies to a string field.
MaskingRules.OnlyNull=This field type can only be set to null.
MaskingRules.NoSyntheticDate=A date field cannot be replaced with a generated token. Use a list, or set the field to null.
MaskingRules.Uuid=A UUID token only applies to a string field.
MaskingRules.Prefix=A prefix or suffix only applies to a string field.
MaskingRules.Unsupported=This field type is not supported.
MaskingRules.ListField=The pattern does not name the list field.

MaskingPattern.Name=Masking pattern
MaskingPattern.Description=A reusable rule for replacing personal data in a field
MaskingPatternEditor.Name.Label=Name
MaskingPattern.Group.Description=Description
MaskingPattern.Group.Rule=Rule
MaskingPattern.Group.Storage=Storage
MaskingPattern.DescriptionField.Label=Description
MaskingPattern.DescriptionField.Tooltip=What this pattern is for
MaskingPattern.Classification.Label=PII classification
MaskingPattern.Classification.Tooltip=A label such as Direct identifier, Quasi-identifier, Sensitive or Special category. The transform does not read this value.
MaskingPattern.ValueSource.Label=Value source
MaskingPattern.ValueSource.Tooltip=SYNTHETIC builds a token. LIST takes values from the info transform. SET_NULL clears the field. SET_EMPTY writes a blank string.
MaskingPattern.Token.Label=Token
MaskingPattern.Token.Tooltip=SEQUENCE writes an integer. UUID writes a random UUID. The token is placed between the prefix and the suffix on a string field.
MaskingPattern.Prefix.Label=Prefix
MaskingPattern.Prefix.Tooltip=Text written before the token, for example 'first-name-'.
MaskingPattern.Suffix.Label=Suffix
MaskingPattern.Suffix.Tooltip=Text written after the token.
MaskingPattern.SequenceStart.Label=Sequence start
MaskingPattern.SequenceStart.Tooltip=First integer to use. The default is 1.
MaskingPattern.ListField.Label=List field
MaskingPattern.ListField.Tooltip=Field on the info transform that holds the replacement values.
MaskingPattern.Storage.Label=Remember values
MaskingPattern.Storage.Tooltip=NONE assigns a new value every row. MEMORY keeps the mapping for this run. DATABASE keeps it in a table across runs. The table stores the original value.
MaskingPattern.Connection.Label=Connection
MaskingPattern.Connection.Tooltip=Database that holds the mapping table.
MaskingPattern.Schema.Label=Schema
MaskingPattern.Schema.Tooltip=Schema of the mapping table. Leave this empty to use the connection default.
MaskingPattern.Table.Label=Table
MaskingPattern.Table.Tooltip=Mapping table. A second table with the suffix _seq stores the next sequence number. Both are created when they are missing.
