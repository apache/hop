FormulaConfigPlugin.Name=Formula
FormulaConfigPlugin.FastPathEnabled.Label=Fast formula evaluation
FormulaConfigPlugin.FastPathEnabled.Tooltip=Evaluate the formulas that only use the supported functions and operators without Apache POI, which is many times faster. Formulas using anything else are always evaluated with Apache POI. Clear this to evaluate every formula with Apache POI. A pipeline can also switch it off with the variable HOP_FORMULA_FAST_PATH_ENABLED set to N.
