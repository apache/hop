VerticaBulkLoaderDialog.AbortOnError.Tooltip=Se um registro é rejeitado, a instrução irá ser abortada e nenhum dado será carregado. Se essa opção não for habilitada, registros rejeitados serão registrados no log, mas não será parado o carregamento em massa.
VerticaBulkLoaderDialog.Delimiter.Tooltip=Especifica o caractere único delimitador de coluna a ser utilizado durante o carregamento. O padrão é TAB (\\t). Certifique-se de utilizar um caractere que não esteja presente em nenhum campo de registro, pois o Vertica não utilizada aspas.
VerticaBulkLoaderDialog.DialogTitle=Carregamento em massa Vertica
VerticaBulkLoaderDialog.ExceptionsLogFile.Label=Arquivo de registro de exceções
VerticaBulkLoaderDialog.ExceptionsLogFile.Tooltip=Especifica o nome do arquivo ou o caminho absoluto onde será escrito as mensagens indicando o número da linha e a ração pela qual cada registro foi rejeitado. O caminho padrão é: catalog-dir/CopyErrorLog/STDIN-copy-from-exceptions
VerticaBulkLoaderDialog.InsertDirect.Label=Insere diretamente no ROS
VerticaBulkLoaderDialog.InsertDirect.Tooltip=Se ativado, a instrução é copiar diretamente e Vertica irá inserir os dados diretamente no ROS (Armazenamento de Leitura Otimizada). Senão, os dados serão inseridos no WOS (Armazenamento de Escrita Otimizada) (e.g. a "trickle load")
VerticaBulkLoaderDialog.NullString.Tooltip=Especifica um texto multi caracteres que representa um valor nulo. Ignorando mainúsculas e minúsculas.  O texto padrão é \\N
VerticaBulkLoaderDialog.RecordTerminator.Label=Texto indicador de fim de registro
VerticaBulkLoaderDialog.RecordTerminator.Tooltip=Especifica um texto multi caracteres que indica o final de um registro.  O padrão é LineFeed (\\n).
VerticaBulkLoaderDialog.RejectedDataLogFile.Label=Arquivo de registro de dados rejeitados
VerticaBulkLoaderDialog.RejectedDataLogFile.Tooltip=Especifica o arquivo ou o caminho absoluto onde será escrito linhas rejeitadas. Este arquivo então pode ser editado para resolver os problemas e então recarregado. O caminho padrão é: catalog-dir/CopyErrorLog/STDIN-copy-from-rejected-data
VerticaBulkLoaderDialog.StreamName.Tooltip=Especifica o nome do fluxo sendo carregado. Esse nome aparece na tabela virtual vt_load_stream.  O padrão é PipelineName.transformName  
