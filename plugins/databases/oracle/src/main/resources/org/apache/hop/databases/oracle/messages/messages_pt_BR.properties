OracleDatabaseMeta.label.ConnectionType=Conectar usando
OracleDatabaseMeta.toolTip.ConnectionType=Como ler o nome do banco de dados. Automático mantém o comportamento histórico: um SID, a menos que o nome comece com / (nome de serviço) ou : (SID), ou a menos que a máquina e a porta estejam vazias, neste caso o nome é um descritor TNS completo.
OracleDatabaseMeta.label.TnsAdmin=Diretório TNS ADMIN
OracleDatabaseMeta.toolTip.TnsAdmin=Diretório contendo nomes.ora e sqlnet.ora. Para uma carteira de banco de dados autônoma, aponte isto para a pasta de carteira aberta: sqlnet.ora nela e depois localize a carteira para você.
OracleDatabaseMeta.label.UseTcps=Use TLS (TCPS)
OracleDatabaseMeta.toolTip.UseTcps=Conecte-se com TCPS em vez de TCPS. Hop então constrói o descritor de conexão longa, porque o formulário pequeno host:port:sid não pode carregar um protocolo. A porta convencional TCPS é 2484, que é usada quando a porta estiver vazia.
OracleDatabaseMeta.label.TlsCredentialType=Credenciais TLS
OracleDatabaseMeta.toolTip.TlsCredentialType=Onde o driver pega seus certificados. Ninguém valida o servidor contra a loja de confiança padrão da JVM. WALLET e JKS são exclusivos: o driver dá prioridade à localização da carteira sobre as propriedades da loja de chaves.
OracleDatabaseMeta.label.WalletDirectory=Diretório da carteira
OracleDatabaseMeta.toolTip.WalletDirectory=Diretório segurando cwallet.sso ou ewallet.p12, por exemplo uma carteira de banco de dados autônoma desativada.
OracleDatabaseMeta.label.WalletPassword=Senha da carteira
OracleDatabaseMeta.toolTip.WalletPassword=Só preciso de uma carteira protegida por senha. Deixe vazio para uma carteira de auto-login.
OracleDatabaseMeta.label.TrustStoreFile=Arquivo TrustStore
OracleDatabaseMeta.toolTip.TrustStoreFile=Arquivo Keystore com a autoridade do certificado que assinou o certificado do servidor.
OracleDatabaseMeta.label.TrustStorePassword=Confiar na senha do Store.
OracleDatabaseMeta.label.TrustStoreType=tipo de TrustStore
OracleDatabaseMeta.toolTip.StoreType=JKS, PKCS12 ou SSO. Deixe vazio para usar o padrão da JVM.
OracleDatabaseMeta.label.KeyStoreFile=Arquivo KeyStore
OracleDatabaseMeta.toolTip.KeyStoreFile=Arquivo de Keystore com o certificado do cliente. Só é necessário quando o servidor pede ao cliente para autenticar (TLS mútuo).
OracleDatabaseMeta.label.KeyStorePassword=Senha do KeyStore
OracleDatabaseMeta.label.KeyStoreType=Tipo de KeyStore
OracleDatabaseMeta.label.SslServerDnMatch=Coincidir certificado do servidor DN
OracleDatabaseMeta.toolTip.SslServerDnMatch=Verifique se o certificado que o servidor apresenta pertence ao servidor que foi solicitado. Desligar isso deixa a conexão aberta para um impostor, então só o faça se você souber por quê.
OracleDatabaseMeta.label.SslServerCertDn=Certificado de servidor DN
OracleDatabaseMeta.toolTip.SslServerCertDn=O nome distinto que o certificado do servidor deve conter, por exemplo, CN=db.example.com,O=Exemplo. Deixe vazio para deixar o driver tirá-lo do serviço que está sendo conectado.
