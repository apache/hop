OracleDatabaseMeta.label.ConnectionType = Connect using
OracleDatabaseMeta.toolTip.ConnectionType = How to read the database name. AUTOMATIC keeps the historical behaviour: a SID, unless the name starts with / (service name) or : (SID), or unless host and port are empty in which case the name is a full TNS descriptor.
OracleDatabaseMeta.label.TnsAdmin = TNS_ADMIN directory
OracleDatabaseMeta.toolTip.TnsAdmin = Directory holding tnsnames.ora and sqlnet.ora. For an Autonomous Database wallet, point this at the unzipped wallet folder: sqlnet.ora in it then locates the wallet for you.
OracleDatabaseMeta.label.UseTcps = Use TLS (TCPS)
OracleDatabaseMeta.toolTip.UseTcps = Connect over TCPS instead of TCP. Hop then builds the long connect descriptor, because the short host:port:sid form cannot carry a protocol. The conventional TCPS port is 2484, which is used when the port is left empty.
OracleDatabaseMeta.label.TlsCredentialType = TLS credentials
OracleDatabaseMeta.toolTip.TlsCredentialType = Where the driver takes its certificates from. NONE validates the server against the JVM default trust store. WALLET and JKS are exclusive: the driver gives the wallet location precedence over the keystore properties.
OracleDatabaseMeta.label.WalletDirectory = Wallet directory
OracleDatabaseMeta.toolTip.WalletDirectory = Directory holding cwallet.sso or ewallet.p12, for example an unzipped Autonomous Database wallet.
OracleDatabaseMeta.label.WalletPassword = Wallet password
OracleDatabaseMeta.toolTip.WalletPassword = Only needed for a password protected (PKCS12) wallet. Leave empty for an auto-login (SSO) wallet.
OracleDatabaseMeta.label.TrustStoreFile = TrustStore file
OracleDatabaseMeta.toolTip.TrustStoreFile = Keystore file holding the certificate authority that signed the server certificate.
OracleDatabaseMeta.label.TrustStorePassword = TrustStore password
OracleDatabaseMeta.label.TrustStoreType = TrustStore type
OracleDatabaseMeta.toolTip.StoreType = JKS, PKCS12 or SSO. Leave empty to use the JVM default.
OracleDatabaseMeta.label.KeyStoreFile = KeyStore file
OracleDatabaseMeta.toolTip.KeyStoreFile = Keystore file holding the client certificate. Only needed when the server asks the client to authenticate (mutual TLS).
OracleDatabaseMeta.label.KeyStorePassword = KeyStore password
OracleDatabaseMeta.label.KeyStoreType = KeyStore type
OracleDatabaseMeta.label.SslServerDnMatch = Match server certificate DN
OracleDatabaseMeta.toolTip.SslServerDnMatch = Check that the certificate the server presents really belongs to the server that was asked for. Switching this off leaves the connection open to an impostor, so only do so if you know why.
OracleDatabaseMeta.label.SslServerCertDn = Server certificate DN
OracleDatabaseMeta.toolTip.SslServerCertDn = The distinguished name the server certificate is expected to carry, for example CN=db.example.com,O=Example. Leave empty to let the driver derive it from the service being connected to.
