RedshiftDatabaseMeta.label.DeploymentType = Deployment
RedshiftDatabaseMeta.toolTip.DeploymentType = PROVISIONED is a Redshift cluster, whose endpoint you enter as the server hostname. SERVERLESS is a workgroup, whose endpoint Hop builds from the workgroup name, the account number and the region.
RedshiftDatabaseMeta.label.Workgroup = Workgroup name
RedshiftDatabaseMeta.toolTip.Workgroup = The name of the serverless workgroup. This is the workgroup, not the namespace — they are easy to mix up, and a namespace name gives a hostname that does not resolve. Leave the server hostname empty to have Hop build the endpoint from this; fill the hostname in to reach the workgroup through a custom domain name or a load balancer, in which case this still tells the driver which workgroup it is.
RedshiftDatabaseMeta.label.AccountId = AWS account number
RedshiftDatabaseMeta.toolTip.AccountId = The 12 digit AWS account number the workgroup belongs to. It is the second label of the endpoint the Redshift console shows for the workgroup.
RedshiftDatabaseMeta.label.ClusterId = Cluster identifier
RedshiftDatabaseMeta.toolTip.ClusterId = The name of the cluster, needed only when the driver cannot read it from the server hostname — a custom domain name or a load balancer in front of the cluster. Leave empty for a normal cluster endpoint.
RedshiftDatabaseMeta.label.AwsRegion = AWS region
RedshiftDatabaseMeta.toolTip.AwsRegion = The region the workgroup or cluster runs in, for example eu-west-1. Used to build a serverless endpoint, and to tell the driver which AWS to ask for temporary credentials.
RedshiftDatabaseMeta.label.AuthenticationType = Authentication
RedshiftDatabaseMeta.toolTip.AuthenticationType = DATABASE signs in with a Redshift user and password. The IAM options make the driver ask AWS for temporary database credentials instead: IAM_CREDENTIALS uses an access key you enter here, IAM_PROFILE a named profile from your AWS credentials file, and IAM_DEFAULT_CHAIN whatever the AWS default credentials chain finds — environment variables, an SSO session, an EC2 instance profile or an ECS task role.
RedshiftDatabaseMeta.label.AwsAccessKeyId = AWS access key ID
RedshiftDatabaseMeta.toolTip.AwsAccessKeyId = The AWS access key ID to authenticate with. This is not a Redshift user: it identifies an IAM user or role that is allowed to fetch database credentials.
RedshiftDatabaseMeta.label.AwsSecretAccessKey = AWS secret access key
RedshiftDatabaseMeta.toolTip.AwsSecretAccessKey = The secret access key belonging to the access key ID above.
RedshiftDatabaseMeta.label.AwsSessionToken = AWS session token
RedshiftDatabaseMeta.toolTip.AwsSessionToken = Only needed for temporary credentials, such as those from an assumed role. Leave empty for a long lived access key.
RedshiftDatabaseMeta.label.AwsProfile = AWS profile
RedshiftDatabaseMeta.toolTip.AwsProfile = The name of a profile in your shared AWS credentials file, usually ~/.aws/credentials. Nothing secret is stored in the Hop connection this way.
RedshiftDatabaseMeta.label.DbUser = Database user
RedshiftDatabaseMeta.toolTip.DbUser = The Redshift user the temporary credentials are issued for. Leave empty to use the username entered above.
RedshiftDatabaseMeta.label.DbGroups = Database groups
RedshiftDatabaseMeta.toolTip.DbGroups = A comma separated list of existing database groups the user joins for the session. Optional.
RedshiftDatabaseMeta.label.AutoCreate = Create the user if missing
RedshiftDatabaseMeta.toolTip.AutoCreate = Create the database user named above when it does not exist yet, rather than failing to authenticate.
