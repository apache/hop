# Dialog
MsSqlServerBulkLoaderDialog.Shell.Title=MS SQL Server bulk loader
MsSqlServerBulkLoaderDialog.Tab.Settings.Label=Settings
MsSqlServerBulkLoaderDialog.Tab.Fields.Label=Fields
MsSqlServerBulkLoaderDialog.TargetSchema.Label=Target schema
MsSqlServerBulkLoaderDialog.TargetTable.Label=Target table
MsSqlServerBulkLoaderDialog.BatchSize.Label=Batch size
MsSqlServerBulkLoaderDialog.BatchSize.Tooltip=The number of rows buffered before they are sent to the server. Each batch is committed on its own.
MsSqlServerBulkLoaderDialog.TruncateTable.Label=Truncate table
MsSqlServerBulkLoaderDialog.TruncateTable.Tooltip=Truncate the target table before the first batch is loaded.
MsSqlServerBulkLoaderDialog.OnlyWhenHaveRows.Label=Truncate only when there are rows
MsSqlServerBulkLoaderDialog.OnlyWhenHaveRows.Tooltip=Leave the target table alone when the incoming stream turns out to be empty.
MsSqlServerBulkLoaderDialog.BulkCopyOptions.Label=Bulk copy options
MsSqlServerBulkLoaderDialog.TableLock.Label=Lock table
MsSqlServerBulkLoaderDialog.TableLock.Tooltip=Take a bulk update lock on the table for the duration of the load. Faster, but no one else can load into it at the same time.
MsSqlServerBulkLoaderDialog.KeepIdentity.Label=Keep identity values
MsSqlServerBulkLoaderDialog.KeepIdentity.Tooltip=Load the identity values coming from the stream instead of letting SQL Server generate them.
MsSqlServerBulkLoaderDialog.KeepNulls.Label=Keep NULL values
MsSqlServerBulkLoaderDialog.KeepNulls.Tooltip=Write NULL for an empty value instead of falling back to the column default.
MsSqlServerBulkLoaderDialog.CheckConstraints.Label=Check constraints
MsSqlServerBulkLoaderDialog.CheckConstraints.Tooltip=Check the table constraints while the rows are loaded. Off by default, which is part of why bulk copy is fast.
MsSqlServerBulkLoaderDialog.FireTriggers.Label=Fire triggers
MsSqlServerBulkLoaderDialog.FireTriggers.Tooltip=Fire the insert triggers on the target table while the rows are loaded.
MsSqlServerBulkLoaderDialog.AllowEncryptedValueModifications.Label=Allow encrypted value modifications
MsSqlServerBulkLoaderDialog.AllowEncryptedValueModifications.Tooltip=Needed to bulk load into columns protected by Always Encrypted. The values are not validated against the column encryption key.
MsSqlServerBulkLoaderDialog.BulkCopyTimeout.Label=Bulk copy timeout (s)
MsSqlServerBulkLoaderDialog.BulkCopyTimeout.Tooltip=How long one batch may take before it is abandoned. 0 means no timeout.
MsSqlServerBulkLoaderDialog.SpecifyFields.Label=Specify database fields
MsSqlServerBulkLoaderDialog.SpecifyFields.Tooltip=Map stream fields onto table columns explicitly. When off, every incoming field is matched to the column with the same name.
MsSqlServerBulkLoaderDialog.ColumnInfo.TableField=Table field
MsSqlServerBulkLoaderDialog.ColumnInfo.StreamField=Stream field
MsSqlServerBulkLoaderDialog.ColumnInfo.OrderHint=Order hint
MsSqlServerBulkLoaderDialog.ColumnInfo.OrderHint.Tooltip=Tell SQL Server the incoming rows are already sorted on this column. Only set it when they really are.
