ActionMssqlBulkLoad.AddDateTime.Label=Añadir fecha y hora
ActionMssqlBulkLoad.AddDateTime.Tooltip=Añadir fecha y hora al nombre del archivo de errores.
ActionMssqlBulkLoad.AddFileToResult.Label=Añadir archivo a los archivos resultado
ActionMssqlBulkLoad.AddFileToResult.Tooltip=Seleccione esta opción si desea añadir el archivo de salida\na los archivos resultado. Esto le permitirá adjuntar al archivo a un email.
ActionMssqlBulkLoad.BatchSize.Label=Tamaño del lote
ActionMssqlBulkLoad.BatchSize.Tooltip=Indica el número de registros en un lote. Cada lote es copiado al servidor como una transacción.\n Si esto falla, SQL Server realiza el "commit" ó "roll back" de la transacción para cada lote.\nPor defecto, todos los datos en el archivo indicado son un único lote.
ActionMssqlBulkLoad.CheckConstraints.Label=Verificar restricciones
ActionMssqlBulkLoad.CheckConstraints.Tooltip=Indica que todas las restricciones en la tabla ó vista destino deben ser verificadas durante la carga masiva.\n Si está desactivada, las restricciones "CHECK" y "FOREIGN KEY" son ignoradas.
ActionMssqlBulkLoad.CodePage.Specific=Específico
ActionMssqlBulkLoad.ConnectionError2.DialogMessage=Por favor seleccione una conexión a base de datos válida.
ActionMssqlBulkLoad.ConnectionGroup.Group.Label=Tabla destino
ActionMssqlBulkLoad.DataFileGroup.Group.Label=Archivo de datos
ActionMssqlBulkLoad.EndFile.Label=Finalizar en la línea
ActionMssqlBulkLoad.EndFile.Tooltip=Considerar que se alcanzó el final del archivo cuando se alcanza la línea indicada.
ActionMssqlBulkLoad.Error.DbNotMSSQL=La base de datos destino ({0}) no es un base MSSQL.
ActionMssqlBulkLoad.Error.ErrorFileExists=Error. El archivo ya existe. El archivo de error se crea al ejecutar el comando. Por favor elimínelo ó utilice la opción "Añadir fecha y hora".
ActionMssqlBulkLoad.Error.FieldTerminatorMissing=Falta el terminador de campo.
ActionMssqlBulkLoad.Error.FileNotExists=El archivo [{0}] no existe.
ActionMssqlBulkLoad.Error.OnlyLocalFileSupported=Sólo los archivos locales están soportados actualmente. El archivo [{0}] no es un archivo local.
ActionMssqlBulkLoad.Error.SpecificCodePageMissing=No se encuentra el código de página. Por favor indique un valor mayor a 127 ó menor a 32.
ActionMssqlBulkLoad.Error.TableNotExists=La tabla [{0}] no existe.
ActionMssqlBulkLoad.FieldTerminator.Label=Campos terminados por:
ActionMssqlBulkLoad.FieldTerminator.Tooltip=Indique el terminador de campos utilizado para archivos "char" y "widechar". El terminador por defecto es el tabulador.
ActionMssqlBulkLoad.FileExists.Label=El archivo [{0}] existe.
ActionMssqlBulkLoad.Filename.Label=Nombre del archivo origen:
ActionMssqlBulkLoad.Filename.Tooltip=Ruta completa del archivo que contiene los datos a importar a la tabla indicada.
ActionMssqlBulkLoad.FileResult.Group.Label=Archivos resutado
ActionMssqlBulkLoad.Filetype.All=Todos los archivos
ActionMssqlBulkLoad.Filetype.Csv=Archivos CSV
ActionMssqlBulkLoad.Filetype.Text=Archivos de texto
ActionMssqlBulkLoad.FireTriggers.Label=Activar disparadores
ActionMssqlBulkLoad.FireTriggers.Tooltip=Indica que se activen los disparadores de inserción definidos en la tabla durante la carga masiva.\n Si existen dichos disparadores, los mismos se dispararán luego de cada lote insertado.
ActionMssqlBulkLoad.FormatFilename.Label=Archivo de formato
ActionMssqlBulkLoad.FormatFilename.Tooltip=Indica la ruta completa del archivo de formato.\n Un archivo de formato describe describe al archivo de datos que contiene las respuestas generadas al utilizar la herramienta de carga masiva en la misma tabla ó vista.
ActionMssqlBulkLoad.KeepIdentity.Label=Mantener la identidad
ActionMssqlBulkLoad.KeepIdentity.Tooltip=Indica si se utilizarán los valores de identidad ó los valores en el archivo importado para la columna identidad.
ActionMssqlBulkLoad.KeepNulls.Label=Mantener nulos
ActionMssqlBulkLoad.KeepNulls.Tooltip=Indica que las columnas vacías deben retener los valores nulos durante la carga masiva\n en lugar de utilizar valores por defecto que hayan sido definidos.
ActionMssqlBulkLoad.Lineterminated.Label=Fila terminada por:
ActionMssqlBulkLoad.Lineterminated.Tooltip=Indica el terminador de fila a utilizar para campos "char" y "widechar".
ActionMssqlBulkLoad.MaxErrors.Label=Máximo nro. de errores
ActionMssqlBulkLoad.MaxErrors.Tooltip=Indica el número máximo de errores de sintaxis permitido en los datos\n antes de cancelar la operación de carga masiva.\n Cada fila que no pueda ser importada será ignorada y contada como un error.
ActionMssqlBulkLoad.Name.Default=Carga Masiva de MSSQL
ActionMssqlBulkLoad.Name.Label=Nombre de la entrada de trabajo:
ActionMssqlBulkLoad.Nodatabase.Label=No se ha definido una conexión a base de datos.
ActionMssqlBulkLoad.Nofilename.Label=No se a definido un nombre de archivo.
ActionMssqlBulkLoad.OrderBy.Label=Ordenar por:
ActionMssqlBulkLoad.OrderBy.Tooltip=Indica cómo están ordenados los datos en el archivo.\nLa operación de carga masiva tendrá mejor rendimiento si los datos a cargar están ordenados de acuerdo al índice agrupado de la tabla.\nSi los datos están ordenados de maner a diferente, ó no existe un índice agrupado en la tabla, la cláusula "ORDER" es ignorada.\nLos nombres de columna provistos deben ser columnas válidas en la tabla destino.
ActionMssqlBulkLoad.RowsPerBatch.Label=Filas por lote
ActionMssqlBulkLoad.Schemaname.Label=Esquema destino:
ActionMssqlBulkLoad.Schemaname.Tooltip=Nombre del esquema de la tabla. El nombre de esquema es opcional si el esquema\n por defecto del usuario realizando la carga masiva es el esquema de la tabla ó vista indicada.
ActionMssqlBulkLoad.SelectColumns.Message=Listado de columnas de la tabla
ActionMssqlBulkLoad.SelectColumns.Title=Listado de columnas de la tabla
ActionMssqlBulkLoad.SpecificCodePage.Label=Página de códigos
ActionMssqlBulkLoad.StartFile.Label=Comenzar en la línea
ActionMssqlBulkLoad.StartFile.Tooltip=Comenzar a leer el archivo a partir de la línea indicada.
ActionMssqlBulkLoad.Tab.Advanced.Label=Avanzado
ActionMssqlBulkLoad.Tab.General.Label=General
ActionMssqlBulkLoad.TableExists.Label=La tabla [{0}] existe.
ActionMssqlBulkLoad.Tablename.Label=Nombre de la tabla destino:
ActionMssqlBulkLoad.Tablename.Tooltip=El nombre de la tabla ó vista en la cual se realizará la carga masiva.
ActionMssqlBulkLoad.Tablock.Label=Bloqueo de tabla
ActionMssqlBulkLoad.Tablock.Tooltip=Indica que se realizará un bloqueo a nivel de tabla durante la duración de la carga masiva.\n Una tabla puede ser cargada concurrentemente por múltiples clientes si la tabla no tiene índices y se activa el bloqueo de tabla.
ActionMssqlBulkLoad.Title=Carga Masiva de MSSQL...
ActionMssqlBulkLoad.Truncate.Label=Truncar tabla
ActionMssqlBulkLoad.Truncate.Tooltip=Truncar la tabla antes de insertar los datos.
ActionMssqlBulkLoad.UnexpectedError.Label=Ocurrió un error inesperado:
ActionMysqlBulkLoad.CodePage.Label=Página de códigos
ActionMysqlBulkLoad.DataFiletype.Label=Tipo de archivo
ActionMysqlBulkLoad.ErrorFilename.Label=Archivo de error
ActionMysqlBulkLoad.ErrorFilename.Tooltip=Indica el archivo utilizado para recolectar las filas que tengan errores de formato.\n Estas filas son copiados a este archivo de errores tal cual existen en el archivo de datos.\nEl archivo de error es creado cuando se ejecuta el comando.\nSi el archivo ya existe ocurrirá un error.\nAdemás, se creará un archivo de control con la extensión ".ERROR.txt".\n Éste hace referencia a cada registro en el archivo de error y provee diagnósticos de los errores.
ActionMysqlBulkLoad.OrderDirection.Label=Dirección
ActionMysqlBulkLoad.OrderDirectionAsc.Label=ASC
ActionMysqlBulkLoad.OrderDirectionDesc.Label=DESC
