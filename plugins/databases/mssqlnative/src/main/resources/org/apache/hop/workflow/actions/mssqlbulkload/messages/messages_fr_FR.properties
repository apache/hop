ActionMssqlBulkLoad.AddDateTime.Label=Ajouter date et heure
ActionMssqlBulkLoad.AddDateTime.Tooltip=Ajouter la date et l''heure au nom du fichier des erreurs
ActionMssqlBulkLoad.AddFileToResult.Label=Ajouter nom de fichier au résultat
ActionMssqlBulkLoad.AddFileToResult.Tooltip=Sélectionnez cette option si vous souhaitez ajouter le nom du fichier\r\narchive produit, à la liste des noms de fichier. 
ActionMssqlBulkLoad.BatchSize.Label=Taille lot 
ActionMssqlBulkLoad.BatchSize.Tooltip=Indique le nombre de lignes contenues dans un lot. \r\nChaque lot est copié sur le serveur comme une transaction unique. \r\nEn cas d'échec, SQL Server valide ou annule la transaction pour chaque lot. \r\nPar défaut, toutes les données du fichier spécifié constituent un seul lot.
ActionMssqlBulkLoad.CheckConstraints.Label=Vérifier contraintes
ActionMssqlBulkLoad.CheckConstraints.Tooltip=Spécifie que toutes les contraintes sur la table ou vue cible doivent être vérifiées pendant l''opération d''importation en bloc. \r\nSans l''option CHECK_CONSTRAINTS, toute contrainte CHECK et FOREIGN KEY est ignorée.
ActionMssqlBulkLoad.CodePage.Specific=Spécifique
ActionMssqlBulkLoad.ConnectionError2.DialogMessage=Veuillez svp sélectionner une connexion valide!
ActionMssqlBulkLoad.ConnectionGroup.Group.Label=Table cible
ActionMssqlBulkLoad.DataFileGroup.Group.Label=Fichier de données
ActionMssqlBulkLoad.Description=Chargement en bloc de données depuis un fichier, dans une table SQL Server
ActionMssqlBulkLoad.EndFile.Label=Jusqu''à la ligne : 
ActionMssqlBulkLoad.EndFile.Tooltip=Lire le fichier jusqu''à la ligne spécifiée.\r\nLe reste va être ignoré.
ActionMssqlBulkLoad.Error.DbNotMSSQL=La base de données {0} n''est pas une base de données Microsoft SQL server!
ActionMssqlBulkLoad.Error.ErrorFileExists=Le fichier des erreurs existe déjà! Ce dernier est créé par le process de chargement. Veuillez svp le supprimer ou sélectionner l''option "Ajouter date et heure"!
ActionMssqlBulkLoad.Error.FieldTerminatorMissing=Le séparateur de champ n''a pas été spécifié!
ActionMssqlBulkLoad.Error.FileNotExists=Le file [{0}] est introuvable!
ActionMssqlBulkLoad.Error.OnlyLocalFileSupported=Les seuls fichiers supportés sont ceux présents en local.
ActionMssqlBulkLoad.Error.SpecificCodePageMissing=Le code de page spécifique n''a pas été spécifié! Veuillez svp indiquer une valeur supérieure\r\nà 127 ou inférieure à 32.
ActionMssqlBulkLoad.Error.TableNotExists=La table [{0}] es introuvale!
ActionMssqlBulkLoad.FieldTerminator.Label=Marque fin de champ: 
ActionMssqlBulkLoad.FieldTerminator.Tooltip=Spécifie la marque de fin de champ à utiliser pour les fichiers de données de type char et widechar.
ActionMssqlBulkLoad.FileExists.Label=Le fichier [{0}] existe.
ActionMssqlBulkLoad.Filename.Label=Fichier données: 
ActionMssqlBulkLoad.Filename.Tooltip=Chemin d''accès complet du fichier de données contenant les données à importer dans la table ou la vue spécifiée.
ActionMssqlBulkLoad.FileResult.Group.Label=Noms de fichier en résultat
ActionMssqlBulkLoad.Filetype.All=Tous les fichiers
ActionMssqlBulkLoad.Filetype.Csv=Fichiers CSV
ActionMssqlBulkLoad.Filetype.Text=Fichier textes
ActionMssqlBulkLoad.FireTriggers.Label=Exécuter déclencheurs d''insertion
ActionMssqlBulkLoad.FireTriggers.Tooltip=Spécifie que tous les déclencheurs d''insertion définis sur la table de destination seront exécutés au cours de l''opération d''importation en bloc. \r\nSi des déclencheurs sont définis pour les opérations INSERT réalisées sur la table cible, ils sont activés à la fin de chaque lot.
ActionMssqlBulkLoad.FormatFilename.Label=Fichier format
ActionMssqlBulkLoad.FormatFilename.Tooltip=Spécifie le chemin d''accès complet au fichier de format. \r\nUn fichier de format décrit le fichier de données qui contient les réponses stockées créées à l''aide de l''utilitaire bcp dans la même table.
ActionMssqlBulkLoad.KeepIdentity.Label=Utiliser valeurs identité
ActionMssqlBulkLoad.KeepIdentity.Tooltip=Indique que la ou les valeurs d''identité figurant dans le fichier de données importé doivent être utilisées dans la colonne d''identité. \r\nSi KEEPIDENTITY n''est pas spécifié, les valeurs d''identité de cette colonne sont vérifiées mais pas importées, \r\net SQL Server affecte automatiquement des valeurs uniques en fonction d''une valeur de départ et d''un incrément spécifié lors de la création de la table.
ActionMssqlBulkLoad.KeepNulls.Label=Conserver valeurs NULL
ActionMssqlBulkLoad.KeepNulls.Tooltip=Spécifie que pendant l''im''portation en bloc les colonnes vides doivent conserver la valeur NULL \r\nau lieu d''insérer des valeurs par défaut dans ces colonnes.
ActionMssqlBulkLoad.Lineterminated.Label=Délimiteur fin de ligne 
ActionMssqlBulkLoad.Lineterminated.Tooltip=Spécifie le délimiteur de fin de ligne à utiliser pour les fichiers de données de type char et widechar.
ActionMssqlBulkLoad.MaxErrors.Label=Max erreurs: 
ActionMssqlBulkLoad.MaxErrors.Tooltip=Nombre maximal d''erreurs de syntaxe tolérées dans les données avant l''annulation de l''importation en bloc. \r\nChaque ligne ne pouvant pas être importée par l''opération d''importation en bloc est ignorée et compte comme une erreur. 
ActionMssqlBulkLoad.Name=Chargement en bloc MSSQL
ActionMssqlBulkLoad.Name.Default=Chargement en bloc MSSQL
ActionMssqlBulkLoad.Name.Label=Nom de l''action: 
ActionMssqlBulkLoad.Nodatabase.Label=Aucune connexion à la DB n''est définie.
ActionMssqlBulkLoad.Nofilename.Label="Aucun nom de fichier défini."
ActionMssqlBulkLoad.OrderBy.Label=Trié par 
ActionMssqlBulkLoad.OrderBy.Tooltip=Indique l''ordre de tri des données dans le fichier. \r\nLes performances de l''importation en bloc seront meilleures si les données en cours d''importation sont triées \r\nd''après l''index cluster de la table, s''il en existe un. \r\nSi le fichier de données est trié dans un autre ordre (c''est-à-dire pas dans l''ordre d''une clé d''index cluster) \r\nou s''il n''y a pas d''index cluster dans la table, la clause ORDER est ignorée.
ActionMssqlBulkLoad.RowsPerBatch.Label=Lignes dans fichier 
ActionMssqlBulkLoad.Schemaname.Label=Schéma cible: 
ActionMssqlBulkLoad.Schemaname.Tooltip=Nom du schéma de la table. Le schema est facultatif si le schéma par défaut de l''utilisateur réalisant l''opération d''importation en bloc est le schéma de la table spécifiée.
ActionMssqlBulkLoad.SelectColumns.Message=Liste colonnes table
ActionMssqlBulkLoad.SelectColumns.Title=Liste colonnes table
ActionMssqlBulkLoad.SpecificCodePage.Label=Code page spécifique
ActionMssqlBulkLoad.StartFile.Label=Début de ligne : 
ActionMssqlBulkLoad.StartFile.Tooltip=Démarrer la lecture du fichier à partir de la logne spécifiée.
ActionMssqlBulkLoad.Tab.Advanced.Label=Avancé
ActionMssqlBulkLoad.Tab.General.Label=Général
ActionMssqlBulkLoad.TableExists.Label=La table [{0}] existe.
ActionMssqlBulkLoad.Tablename.Label=Table cible: 
ActionMssqlBulkLoad.Tablename.Tooltip=Nom de la table dans laquelle les données doivent être importées en bloc. 
ActionMssqlBulkLoad.Tablock.Label=Placer verrou sur table
ActionMssqlBulkLoad.Tablock.Tooltip=Spécifie qu''un verrou est placé sur la table pour la durée de l''opération d''importation en bloc. \r\nUne table peut être chargée simultanément par plusieurs clients à condition qu''elle ne comporte pas d''index et que TABLOCK soit spécifié.
ActionMssqlBulkLoad.Title=Chargement en bloc MSSQL
ActionMssqlBulkLoad.Truncate.Label=Tronquer table 
ActionMssqlBulkLoad.Truncate.Tooltip=Tronquer la table cible avant le chargement des données.
ActionMssqlBulkLoad.UnexpectedError.Label=Apache Hop a rencontré une erreur inattendue:
ActionMysqlBulkLoad.CodePage.Label=Code de page
ActionMysqlBulkLoad.DataFiletype.Label=Type de fichier 
ActionMysqlBulkLoad.ErrorFilename.Label=Fichier erreur
ActionMysqlBulkLoad.ErrorFilename.Tooltip=Fichier utilisé pour collecter les lignes comportant des erreurs de mise en forme et qu''il est impossible de convertir \r\nen un ensemble de lignes OLE DB. Ces lignes sont copiées « telles quelles » du fichier de données vers ce fichier d''erreur.
ActionMysqlBulkLoad.OrderDirection.Label=Sens 
ActionMysqlBulkLoad.OrderDirectionAsc.Label=Ascendant
ActionMysqlBulkLoad.OrderDirectionDesc.Label=Descendant
