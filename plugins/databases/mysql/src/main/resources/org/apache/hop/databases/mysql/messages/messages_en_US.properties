MySQLDatabaseMeta.Exception.LegacyColumnNameException=Something unexpected went wrong trying to get the legacy column name
MySQLDatabaseMeta.Exception.LegacyColumnNameNoDBMetaDataException="Please provide a valid DatabaseMetaData object"
MySQLDatabaseMeta.Exception.LegacyColumnNameNoRSMetaDataException="Please provide a valid ResultSetMetaData object"
MySQLDatabaseMeta.label.MySQLDriverType=Select database type:
MySQLDatabaseMeta.MultiRow.NotStrict=the session''s sql_mode ''{0}'' has neither STRICT_TRANS_TABLES nor STRICT_ALL_TABLES. Without strict mode MySQL writes the column default into a NOT NULL column for a bad row of a multi-row INSERT and only warns, where a one-row INSERT fails.
MySQLDatabaseMeta.MultiRow.ModeUnknown=the session''s sql_mode can''t be read ({0}). Without strict mode MySQL writes the column default into a NOT NULL column for a bad row of a multi-row INSERT and only warns, where a one-row INSERT fails.
MySQLDatabaseMeta.MultiRow.NotTransactional=table {0} uses the {1} storage engine, which has no transactions. There MySQL writes a bad row of a multi-row INSERT with an adjusted value and only warns, or keeps the rows before it, where a one-row INSERT fails. Only InnoDB and NDB tables refuse the statement as a whole.
MySQLDatabaseMeta.MultiRow.EngineUnknown=the storage engine of table {0} can''t be read ({1}). Only InnoDB and NDB tables refuse a bad row of a multi-row INSERT as a whole, the way they refuse a one-row INSERT.
