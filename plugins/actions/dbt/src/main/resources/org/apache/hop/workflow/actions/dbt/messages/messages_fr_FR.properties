ActionDbt.Target.Label=Cible
ActionDbt.Target.Tooltip=La cible dbt à utiliser pour l''exécution. Lorsqu''elle est définie, elle remplace la cible par défaut du projet dbt.
ActionDbt.Select.Label=--select
ActionDbt.Select.Tooltip=Transmis à dbt via l’option `--select`, en utilisant la syntaxe de sélection de nœuds de dbt. Plusieurs sélecteurs peuvent être indiqués au sein d’une même valeur, séparés par des espaces.
ActionDbt.Exclude.Label=--exclude
ActionDbt.Exclude.Tooltip=Transmis à dbt avec l’option --exclude
ActionDbt.FullRefresh.Label=--full-refresh
ActionDbt.FullRefresh.Tooltip=Transmis à dbt sous la forme --full-refresh. dbt n’accepte cet argument que pour les commandes run, build et seed ; il est donc omis pour les autres opérations.
ActionDbt.Threads.Label=--threads
ActionDbt.Threads.Tooltip=Transmis à dbt via l’option --threads. Si ce paramètre est laissé vide, dbt utilise le nombre de threads défini dans profiles.yml.
ActionDbt.Timeout.Label=Délai d’attente en secondes
ActionDbt.Timeout.Tooltip=Limite de durée (temps réel) pour l’exécution de dbt. Si la valeur est vide ou égale à 0, dbt attendra aussi longtemps que nécessaire.
ActionDbt.EmitOpenLineage.Label=Émettre OpenLineage
ActionDbt.EmitOpenLineage.Tooltip=Exécutez dbt via dbt-ol et intégrez sa lignée dans le graphe de lignée de Hop
ActionDbt.Vars.Label=Variables (--vars)
ActionDbt.EnvVars.Label=Variables d’environnement (secrets injectés dans l’exécution de dbt)
