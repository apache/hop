ActionCheckDataCatalog.Name=Check data catalog
ActionCheckDataCatalog.Description=Checks datasets in a data catalog such as DataHub: whether they exist, aren''t deprecated, are recent enough and passed their assertions
ActionCheckDataCatalog.Keywords=datahub,catalog,dataset,freshness,assertion,deprecated,quality,check
ActionCheckDataCatalog.Group.Options=Options
ActionCheckDataCatalog.Group.Datasets=Datasets
ActionCheckDataCatalog.Catalog.Label=Data catalog
ActionCheckDataCatalog.Catalog.Tooltip=The data catalog to ask about the datasets
ActionCheckDataCatalog.CheckDeprecation.Label=Fail when a dataset is deprecated
ActionCheckDataCatalog.CheckDeprecation.Tooltip=Fail the check when the catalog marks a dataset as deprecated
ActionCheckDataCatalog.MaxAge.Label=Maximum age of the data
ActionCheckDataCatalog.MaxAge.Tooltip=Fail the check when the data of a dataset last changed longer ago than this, according to the catalog. Leave it empty not to check the age.
ActionCheckDataCatalog.MaxAgeUnit.Label=Unit of the maximum age
ActionCheckDataCatalog.MaxAgeUnit.Tooltip=Whether the maximum age is in minutes, hours or days
ActionCheckDataCatalog.CheckAssertions.Label=Fail when an assertion failed
ActionCheckDataCatalog.CheckAssertions.Tooltip=Fail the check when the latest run of an assertion the catalog has on a dataset failed or could not be evaluated
ActionCheckDataCatalog.UnknownAnswer.Label=When the catalog can''t answer
ActionCheckDataCatalog.UnknownAnswer.Tooltip=What to do when the catalog can''t be reached, refuses the token, doesn''t support a check or knows nothing to answer it with
ActionCheckDataCatalog.UnknownAnswer.FAIL=Fail the check
ActionCheckDataCatalog.UnknownAnswer.IGNORE=Skip the check and log it
ActionCheckDataCatalog.AgeUnit.MINUTES=Minutes
ActionCheckDataCatalog.AgeUnit.HOURS=Hours
ActionCheckDataCatalog.AgeUnit.DAYS=Days
ActionCheckDataCatalog.DatasetType.TABLE=Table
ActionCheckDataCatalog.DatasetType.FILE=File
ActionCheckDataCatalog.DatasetType.CATALOG_ID=Catalog id
ActionCheckDataCatalog.Column.Type=Type
ActionCheckDataCatalog.Column.Type.Tooltip=A table of a relational connection, a file, or the id of the dataset in the catalog
ActionCheckDataCatalog.Column.Connection=Connection
ActionCheckDataCatalog.Column.Connection.Tooltip=The relational connection of a table
ActionCheckDataCatalog.Column.Schema=Schema
ActionCheckDataCatalog.Column.Name=Table, file or id
ActionCheckDataCatalog.Column.Name.Tooltip=The table, the file name, or the id of the dataset in the catalog, for example a DataHub URN
ActionCheckDataCatalog.Check.Exists=the dataset
ActionCheckDataCatalog.Check.Deprecation=the deprecation
ActionCheckDataCatalog.Check.Freshness=the age of the data
ActionCheckDataCatalog.Check.Assertions=the assertions
ActionCheckDataCatalog.Problem.NotFound=the catalog doesn''t have this dataset
ActionCheckDataCatalog.Problem.Deprecated=the dataset is deprecated
ActionCheckDataCatalog.Problem.DeprecatedNote=the dataset is deprecated: {0}
ActionCheckDataCatalog.Problem.TooOld=the data last changed at {0}, more than {1} {2} ago
ActionCheckDataCatalog.Problem.Assertion=assertion ''{0}'' ended with {1}
ActionCheckDataCatalog.Problem.Unknown=the catalog could not answer about {0} ({1})
ActionCheckDataCatalog.Problem.NothingKnown=nothing is known
ActionCheckDataCatalog.Log.Passed=Dataset {0} passed the checks
ActionCheckDataCatalog.Log.Failed=Dataset {0} failed: {1}
ActionCheckDataCatalog.Log.Summary={0} of {1} datasets passed the checks in data catalog ''{2}''
ActionCheckDataCatalog.Error.NoCatalog=No data catalog is selected
ActionCheckDataCatalog.Error.MissingCatalog=Data catalog ''{0}'' can''t be found
ActionCheckDataCatalog.Error.NoDatasets=No datasets to check
ActionCheckDataCatalog.Error.NoName=A dataset has no table, file or id
ActionCheckDataCatalog.Error.MissingConnection=Relational connection ''{0}'' of table ''{1}'' can''t be found
ActionCheckDataCatalog.Error.MaxAge=The maximum age must be a whole number above 0, was ''{0}''
ActionCheckDataCatalog.Error.Failed=The datasets could not be checked
