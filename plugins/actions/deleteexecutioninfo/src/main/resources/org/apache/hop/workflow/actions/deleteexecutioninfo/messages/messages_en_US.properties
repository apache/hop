ActionDeleteExecutionInfo.Name=Delete execution information
ActionDeleteExecutionInfo.Description=Delete old execution information from a location
ActionDeleteExecutionInfo.keyword=delete,execution,information,cleanup,purge,schedule
ActionDeleteExecutionInfo.Group.Options=Options
ActionDeleteExecutionInfo.Location.Label=Execution information location
ActionDeleteExecutionInfo.Location.Tooltip=Location whose stored executions are deleted. The location itself is kept.
ActionDeleteExecutionInfo.Age.Label=Older than
ActionDeleteExecutionInfo.Age.Tooltip=Delete executions that started longer ago than this. A variable is allowed, for example '${AGE}'.
ActionDeleteExecutionInfo.Unit.Label=Unit
ActionDeleteExecutionInfo.Unit.Tooltip=Unit of the age.
ActionDeleteExecutionInfo.Unit.MINUTES=Minutes
ActionDeleteExecutionInfo.Unit.HOURS=Hours
ActionDeleteExecutionInfo.Unit.DAYS=Days
ActionDeleteExecutionInfo.Unit.WEEKS=Weeks
ActionDeleteExecutionInfo.Unit.MONTHS=Months
ActionDeleteExecutionInfo.DeleteAll.Label=Delete all executions in this location
ActionDeleteExecutionInfo.DeleteAll.Tooltip=Ignore the age and delete every execution stored in the location.
ActionDeleteExecutionInfo.Deleted=Deleted {0} execution(s) from location ''{1}''.
ActionDeleteExecutionInfo.Error.NoLocation=An execution information location is required.
ActionDeleteExecutionInfo.Error.NoMetadata=No metadata provider is available.
ActionDeleteExecutionInfo.Error.Missing=Execution information location ''{0}'' was not found.
ActionDeleteExecutionInfo.Error.Age=The age ''{0}'' must be a positive number.
ActionDeleteExecutionInfo.Error.Failed=Error deleting execution information
ActionDeleteExecutionInfo.Error.Close=Error closing the execution information location
