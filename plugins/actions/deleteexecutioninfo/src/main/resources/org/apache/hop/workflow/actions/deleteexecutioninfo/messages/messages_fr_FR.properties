ActionDeleteExecutionInfo.Name=Supprimer les informations d''exécution
ActionDeleteExecutionInfo.Description=Supprimer les anciennes informations d''exécution d’un emplacement
ActionDeleteExecutionInfo.keyword=delete,execution,information,cleanup,purge,schedule
ActionDeleteExecutionInfo.Group.Options=Options
ActionDeleteExecutionInfo.Location.Label=Emplacement des informations d'exécution
ActionDeleteExecutionInfo.Location.Tooltip=Emplacement dont les exécutions stockées sont supprimées. L’emplacement lui-même est conservé.
ActionDeleteExecutionInfo.Age.Label=Plus ancien que
ActionDeleteExecutionInfo.Age.Tooltip=Supprimez les exécutions ayant démarré il y a plus longtemps que cette durée. L'utilisation d'une variable est possible, par exemple '${AGE}'.
ActionDeleteExecutionInfo.Unit.Label=Unité
ActionDeleteExecutionInfo.Unit.Tooltip=Unité de d'ancienneté.
ActionDeleteExecutionInfo.Unit.MINUTES=Minutes
ActionDeleteExecutionInfo.Unit.HOURS=Heures
ActionDeleteExecutionInfo.Unit.DAYS=Jours
ActionDeleteExecutionInfo.Unit.WEEKS=Semaines
ActionDeleteExecutionInfo.Unit.MONTHS=Mois
ActionDeleteExecutionInfo.DeleteAll.Label=Supprimer toutes les exécutions à cet emplacement
ActionDeleteExecutionInfo.DeleteAll.Tooltip=Ne tenez pas compte de l’ancienneté et supprimez toutes les exécutions stockées à cet emplacement.
ActionDeleteExecutionInfo.Deleted={0} exécution(s) supprimée(s) depuis l’emplacement « {1} ».
ActionDeleteExecutionInfo.Error.NoLocation=Un emplacement pour les informations d’exécution est requis.
ActionDeleteExecutionInfo.Error.NoMetadata=Aucun fournisseur de métadonnées n’est disponible.
ActionDeleteExecutionInfo.Error.Missing=L'emplacement des informations d'exécution « {0} » est introuvable.
