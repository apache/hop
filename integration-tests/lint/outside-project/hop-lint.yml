# Issue #9387: this file sits above the project in outside-project/project, so the linter must not
# use it for that project. If it did, DOC-001 would report undocumented.hpl, and orphan.hpl, which
# this pattern names relative to this folder, would not be linted: its TRANS-002 warning would go.
rules:
  DOC-001:
    enabled: true
exclude:
  - "project/orphan.hpl"
