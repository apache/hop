# The password is NOT in this file: it is read from the process environment, which the Hop dbt
# action fills from its environment-variable list after resolving it through Hop's variable and
# secret resolvers. That is the path this project exists to prove.
hop_dbt_it:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DATABASE') }}"
      schema: dbt
      threads: 2
