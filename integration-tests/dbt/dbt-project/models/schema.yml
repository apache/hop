version: 2

sources:
  - name: hop
    schema: public
    tables:
      - name: orders_source

models:
  - name: orders_by_country
    description: Orders aggregated per country, built by dbt from the table Hop loaded.
    columns:
      - name: country
        tests:
          - not_null
          - unique
      - name: order_count
        tests:
          - not_null

  - name: failing_orders
    description: Deliberately broken model - its not_null test always fails, so main-0002 can prove that a failing dbt test fails the action.
    columns:
      - name: country
        tests:
          - not_null
